<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=places,geometry"></script>
    <style>
        /* CONFIGURAÇÃO DE FUNDO DE ALTA RESOLUÇÃO */
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, #000 100%), url('https://i.postimg.cc/V6tsZRGB/fundo-site.png');
            background-attachment: fixed;
            background-position: center top;
            background-repeat: no-repeat;
            background-size: 100% auto;
            image-rendering: -webkit-optimize-contrast;
            color: #fff; 
        }

        @media (max-width: 768px) {
            body { background-size: cover; background-attachment: scroll; }
        }

        /* Estilo dos Cards com efeito Glassmorphism */
        .item-card {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .neon-text { color: #39FF14; text-shadow: 0 0 12px rgba(57, 255, 20, 0.6); }
        .gold-text { color: #FFD700; text-shadow: 0 0 3px rgba(255, 215, 0, 0.4); }
        
        /* Menu de navegação com fundo sólido para legibilidade no scroll */
        nav {
            background-color: rgba(0, 0, 0, 0.95) !important;
            backdrop-filter: blur(5px);
        }

        .category-btn { border: 1px solid #333; transition: 0.3s; color: #999; text-transform: uppercase; font-size: 10px; font-weight: 900; white-space: nowrap; background: rgba(0,0,0,0.8); }
        .category-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.2); box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
        
        select, input, textarea { background: #111 !important; border: 1px solid #333 !important; border-radius: 12px !important; padding: 12px !important; color: white !important; width: 100%; outline: none; margin-bottom: 8px; font-size: 14px; }
        
        .ing-label { grid-column: 1 / -1; background: rgba(57, 255, 20, 0.1); padding: 8px 12px; border-left: 4px solid #39FF14; font-size: 10px; font-weight: 900; color: #FFD700; margin-top: 15px; text-transform: uppercase; }
        .ing-btn { border: 1px solid #333; padding: 10px; border-radius: 12px; font-size: 10px; text-align: left; background: rgba(10,10,10,0.9); }
        .ing-btn.selected { border-color: #39FF14; background: rgba(57, 255, 20, 0.2); }
        
        .hidden { display: none; }
        .modal-btn { border: 2px solid #333; padding: 12px; border-radius: 15px; font-size: 12px; font-weight: 900; color: #666; text-transform: uppercase; }
        .modal-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
    </style>
</head>
<body class="pb-24">

    <header class="py-8 flex flex-col items-center">
        <div class="w-full max-w-[340px] px-4">
            <img src="https://i.postimg.cc/Vs2JzSPy/Imagem1.png" 
                 alt="KF Sabores" 
                 class="w-full h-auto drop-shadow-[0_0_20px_rgba(57,255,20,0.4)]">
        </div>
    </header>

    <div id="banner-status" class="hidden p-4 mx-4 mb-4 rounded-2xl border text-center bg-red-900/20 border-red-500/50">
        <h2 class="font-black uppercase italic text-sm mb-2 text-red-500">🚫 ESTAMOS FECHADOS AGORA</h2>
        <div id="horarios-lista" class="text-[10px] grid grid-cols-2 gap-x-4 gap-y-1 opacity-80 font-bold uppercase text-white"></div>
    </div>

    <nav class="flex overflow-x-auto p-3 gap-2 sticky top-0 z-50 border-b border-zinc-800 scrollbar-hide">
        <button onclick="switchCategory('promos')" class="category-btn active px-5 py-2 rounded-full shrink-0">🔥 Promos</button>
        <button onclick="switchCategory('tradicional')" class="category-btn px-5 py-2 rounded-full shrink-0">🍕 Tradicional</button>
        <button onclick="switchCategory('especial')" class="category-btn px-5 py-2 rounded-full shrink-0">🌟 Especial</button>
        <button onclick="switchCategory('premium')" class="category-btn px-5 py-2 rounded-full shrink-0">💎 Premium</button>
        <button onclick="switchCategory('doces')" class="category-btn px-5 py-2 rounded-full shrink-0">🍫 Doces</button>
        <button onclick="switchCategory('tapioca')" class="category-btn px-5 py-2 rounded-full shrink-0">Tapiocas</button>
        <button onclick="switchCategory('bebidas')" class="category-btn px-5 py-2 rounded-full shrink-0">🥤 Bebidas</button>
    </nav>

    <main id="items-container" class="p-4 space-y-4 max-w-lg mx-auto min-h-screen"></main>

    <button onclick="toggleCart()" class="fixed bottom-6 right-6 bg-[#39FF14] text-black px-6 py-4 rounded-full shadow-[0_0_30px_rgba(57,255,20,0.5)] z-50 flex items-center gap-3">
        <span class="text-xl">🛒</span><span id="cart-count" class="font-black text-lg">0</span>
    </button>

    <div id="cart-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[90]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto relative">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-zinc-500 text-3xl">&times;</button>
            <h2 class="text-xl font-black neon-text mb-4 italic uppercase text-center">Meu Pedido</h2>
            <div id="cart-items" class="space-y-2 mb-4"></div>
            <div id="form-fechamento">
                <input type="text" id="cust-name" placeholder="Seu Nome">
                <input type="tel" id="cust-phone" placeholder="WhatsApp">
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="mode-delivery" onclick="setModalidade('DELIVERY')" class="modal-btn active">🛵 Entrega</button>
                    <button id="mode-retirada" onclick="setModalidade('RETIRADA')" class="modal-btn">🛍️ Retirada</button>
                </div>
                <div id="area-endereco">
                    <input type="text" id="cust-addr" placeholder="Endereço Completo" onfocus="initAutocomplete()">
                    <p id="distancia-info" class="text-[10px] gold-text mb-2 italic font-bold text-center"></p>
                </div>
                <select id="pay-method" onchange="checkPayment()">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <div class="flex justify-between text-2xl font-black neon-text pt-4 border-t border-zinc-800"><span>Total:</span><span>R$ <span id="cart-total">0.00</span></span></div>
                <button onclick="finalizeOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase mt-4">Enviar Pedido</button>
            </div>
        </div>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700">
            <h3 id="modal-title" class="text-2xl font-black neon-text mb-4 italic uppercase text-center"></h3>
            <div id="modal-options" class="space-y-6"></div>
            <button onclick="addToCartFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase mt-6">Confirmar</button>
            <button onclick="closeModal()" class="w-full py-2 text-zinc-500 text-[10px] uppercase font-bold">Voltar</button>
        </div>
    </div>

    <div id="tapioca-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700">
            <h3 class="text-2xl font-black neon-text mb-4 italic uppercase">Montar Tapioca</h3>
            <div id="tapioca-options" class="grid grid-cols-2 gap-2"></div>
            <div id="tapioca-extras" class="grid grid-cols-2 gap-2 mt-6"></div>
            <button onclick="addTapiocaFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase mt-8">Adicionar</button>
            <button onclick="closeModal()" class="w-full py-2 text-zinc-500 text-[10px] uppercase font-bold">Voltar</button>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "5521997437285";
        const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbx5vSO0JUFs7h-oFwNolt1UuYjIeTRHJh105As8oWaOsrEBCQfxMGcDMEvTlx6Wpm3n/exec";
        
        let estoqueAtual = {}; let zonasEntrega = []; let modoAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
        const HORARIOS = { 4: { abrir: 2000, fechar: 2400 }, 5: { abrir: 2000, fechar: 2500 }, 6: { abrir: 2000, fechar: 2500 }, 0: { abrir: 1900, fechar: 2500 } };

        const menuData = {
            promos: [
                { name: "2 Pizzas 25cm + Refri 1L", price: 55.00, pizzas: 2, refri: "1L" },
                { name: "1 Pizza 35cm + Refri 2L", price: 46.00, pizzas: 1, refri: "2L" },
                { name: "2 Pizzas 35cm + Refri 2L", price: 85.00, pizzas: 2, refri: "2L" }
            ],
            tradicional: [
                { name: "Mussarela", p25: 24, p35: 39 }, { name: "Presunto", p25: 24, p35: 39 }, { name: "Calabresa", p25: 24, p35: 39 }, { name: "3 Queijos", p25: 24, p35: 39 }
            ],
            especial: [
                { name: "Frango c/ Catupiry", p25: 29, p35: 43 }, { name: "Portuguesa", p25: 29, p35: 43 }
            ],
            premium: [
                { name: "Camarão c/ Catupiry", p25: 32, p35: 58 }, { name: "Bacon com Ovos", p25: 32, p35: 58 }
            ],
            doces: [
                { name: "Banana c/ Canela", p25: 30, p35: 45 }, { name: "Sensação", p25: 30, p35: 45 }
            ],
            tapioca_cats: [
                { cat: "Proteínas", items: [{ n: "Lombo", p: 10 }, { n: "Frango", p: 13 }] },
                { cat: "Doces", items: [{ n: "Nutella", p: 16 }, { n: "Doce de Leite", p: 10 }] }
            ],
            tapioca_extras: ["Leite Condensado", "Granulado", "Nenhum"],
            bebidas: [{ name: "Coca Lata", price: 6.00 }, { name: "Guaraná 1.5L", price: 12.00 }]
        };

        const SABORES_PIZZA = [...menuData.tradicional, ...menuData.especial].map(s => s.name);
        const SABORES_PROMO = ["Calabresa", "Mussarela", "Presunto"];
        
        let cart = []; let currentItem = null; let selectedSize = 35; let tapRecheios = []; let tapExtra = "Nenhum"; let modalidadeAtual = "DELIVERY"; let taxaEntrega = 0;

        async function init() {
            verificarStatusLoja();
            switchCategory('promos');
            try {
                const [est, map] = await Promise.all([
                    fetch(`${URL_PLANILHA}?action=getEstoque`).then(r => r.json()),
                    fetch(`${URL_PLANILHA}?action=getMapa`).then(r => r.json())
                ]);
                estoqueAtual = est; zonasEntrega = map;
            } catch(e) {}
        }

        function switchCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(cat.substring(0,3))));
            const container = document.getElementById('items-container');
            if(cat === 'tapioca') {
                container.innerHTML = `<div class="item-card p-8 rounded-3xl border-2 border-[#39FF14] text-center"><h4 class="font-black neon-text text-xl mb-2 italic">TAPIOCAS</h4><button onclick="openTapiocaModal()" class="w-full bg-[#39FF14] text-black font-black py-4 rounded-2xl text-xs mt-4 uppercase">Montar Tapioca</button></div>`;
                return;
            }
            container.innerHTML = (menuData[cat] || []).map((item, index) => {
                const isPausado = estoqueAtual[item.name] === 'PAUSADO';
                return `
                    <div class="item-card p-5 rounded-3xl flex justify-between items-center gap-3" style="${isPausado ? 'opacity: 0.4' : ''}">
                        <div class="flex-1">
                            <h4 class="font-black text-white uppercase italic text-lg leading-tight">${item.name}</h4>
                            <p class="text-[10px] gold-text font-bold mt-2">${item.price ? 'R$ '+item.price.toFixed(2) : 'A partir de R$ '+item.p25.toFixed(2)}</p>
                        </div>
                        <button ${isPausado ? '' : `onclick='openItemModal("${cat}", ${index})'`} class="bg-zinc-800 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase">
                            ${isPausado ? 'OFF' : 'ESCOLHER'}
                        </button>
                    </div>`;
            }).join('');
        }

        function openItemModal(cat, index) {
            currentItem = menuData[cat][index];
            if(cat === 'bebidas') { cart.push({ name: currentItem.name, price: currentItem.price }); updateCartUI(); return; }
            document.getElementById('modal-title').innerText = currentItem.name;
            let list = (cat === 'promos') ? SABORES_PROMO : SABORES_PIZZA;
            let html = createPizzaSelect(1, (cat !== 'promos'), currentItem.name, list);
            if(currentItem.pizzas === 2) html += createPizzaSelect(2, false, list[1], list);
            if(currentItem.p35) html += `<div class="flex gap-2 mt-4"><button onclick="selectSize(25)" id="btn-25" class="flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700">25CM</button><button onclick="selectSize(35)" id="btn-35" class="flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14]">35CM</button></div>`;
            document.getElementById('modal-options').innerHTML = html;
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function createPizzaSelect(num, isF, def, list) {
            return `<div class="space-y-2"><label class="text-[10px] gold-text font-black uppercase italic">Sabor Pizza ${num}</label><div class="grid grid-cols-2 gap-2"><select class="flavor-a" ${isF?'disabled':''}>${list.map(f=>`<option value="${f}" ${f===def?'selected':''}>${f}</option>`).join('')}</select><select class="flavor-b"><option value="">(INTEIRA)</option>${list.map(f=>`<option value="${f}">½ ${f}</option>`).join('')}</select></div></div>`;
        }

        function selectSize(s) { selectedSize = s; document.getElementById('btn-25').className = s===25?'flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14]':'flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700'; document.getElementById('btn-35').className = s===35?'flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14]':'flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700'; }

        function addToCartFinal() {
            const flavAs = document.querySelectorAll('.flavor-a'), flavBs = document.querySelectorAll('.flavor-b');
            let desc = []; flavAs.forEach((f, i) => { let sA = f.value, sB = flavBs[i].value; desc.push(sB && sB !== sA ? `½ ${sA} / ½ ${sB}` : sA + ' (Inteira)'); });
            cart.push({ name: `${currentItem.p35 ? selectedSize+'CM ' : ''}${currentItem.name} (${desc.join(" | ")})`.toUpperCase(), price: currentItem.price || (selectedSize === 25 ? currentItem.p25 : currentItem.p35) });
            updateCartUI(); closeModal();
        }

        function updateCartUI() {
            const subtotal = cart.reduce((acc, i) => acc + i.price, 0);
            const taxa = modalidadeAtual === 'DELIVERY' ? taxaEntrega : 0;
            document.getElementById('cart-total').innerText = (subtotal + taxa).toFixed(2);
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `<div class="flex justify-between bg-black/50 p-3 rounded-xl border border-zinc-800 text-[10px] mb-2"><span class="uppercase">${i.name}</span><button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500 font-bold">✕</button></div>`).join('');
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function closeModal() { document.getElementById('item-modal').classList.add('hidden'); document.getElementById('tapioca-modal').classList.add('hidden'); }
        function verificarStatusLoja() { /* Lógica de horários... */ }
        function finalizeOrder() {
            const n = document.getElementById('cust-name').value, a = document.getElementById('cust-addr').value;
            if(!n || cart.length === 0) return alert("Preencha o nome e adicione itens!");
            let msg = `*🔥 PEDIDO KF SABORES*%0A%0A*👤 CLIENTE:* ${n.toUpperCase()}%0A*📍 END:* ${a.toUpperCase()}%0A%0A*🍕 ITENS:*%0A${cart.map(i => '• ' + i.name).join('%0A')}%0A%0A*💰 TOTAL: R$ ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`);
        }

        init();
    </script>
</body>
</html>
