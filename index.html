<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; }
        .neon-text { color: #39FF14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.8); }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.4); }
        .gold-text { color: #FFD700; }
        .category-btn { border: 1px solid #333; transition: 0.3s; color: #999; text-transform: uppercase; font-size: 10px; font-weight: 900; white-space: nowrap; }
        .category-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        select, input { background: #111 !important; border: 1px solid #333 !important; border-radius: 12px !important; padding: 12px !important; color: white !important; width: 100%; outline: none; margin-bottom: 8px; }
        .modal-btn { border: 2px solid #333; padding: 12px; border-radius: 15px; font-size: 11px; font-weight: 900; color: #666; text-transform: uppercase; }
        .modal-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        .hidden { display: none; }
        .success-screen { text-align: center; padding: 20px; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="pb-24">

    <div class="absolute top-4 right-4 z-[60]">
        <button onclick="ativarModoAdmin()" class="bg-zinc-900/50 text-zinc-600 px-3 py-1 rounded-lg text-[9px] font-bold uppercase border border-zinc-800">Admin</button>
    </div>

    <header class="bg-black py-10 flex flex-col items-center border-b-2 border-[#39FF14]">
        <div class="relative p-5 border-2 neon-border rounded-2xl mb-4 text-center bg-black">
             <h1 class="text-6xl font-black italic tracking-tighter gold-text leading-none">KF</h1>
             <p class="text-xl font-medium neon-text tracking-[.6em] uppercase -mt-1 pl-1 text-center">Sabores</p>
        </div>
        <p class="text-[12px] text-zinc-300 font-normal uppercase tracking-widest italic text-center px-6">Pizzas & Tapiocas Gourmet</p>
    </header>

    <nav id="nav-categorias" class="flex overflow-x-auto bg-black p-3 gap-2 sticky top-0 z-50 border-b border-zinc-800">
        </nav>

    <main id="items-container" class="p-4 space-y-4 max-w-lg mx-auto"></main>

    <div id="cart-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[90]">
        <div id="cart-content" class="bg-zinc-900 w-full max-w-md rounded-[2rem] p-6 border border-zinc-800 max-h-[90vh] overflow-y-auto relative">
            
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-zinc-500 text-3xl font-light p-2">&times;</button>
            
            <h2 class="text-xl font-black neon-text mb-6 italic uppercase text-center mt-2">Meu Pedido</h2>
            
            <div id="cart-items" class="space-y-3 mb-6"></div>
            
            <div id="form-cliente">
                <input type="text" id="cust-name" placeholder="Seu Nome Completo">
                
                <label class="text-[10px] gold-text font-black uppercase italic mt-4 block">Entrega ou Retirada?</label>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="mode-delivery" onclick="setModalidade('DELIVERY')" class="modal-btn active">🛵 Entrega</button>
                    <button id="mode-retirada" onclick="setModalidade('RETIRADA')" class="modal-btn">🛍️ Retirada</button>
                </div>

                <div id="area-endereco">
                    <input type="text" id="cust-addr" placeholder="Endereço, Número e Bairro">
                </div>

                <label class="text-[10px] gold-text font-black uppercase italic mt-2 block">Pagamento</label>
                <select id="pay-method" onchange="checkPayment()">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão (Maquininha)</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <input type="text" id="troco-val" class="hidden" placeholder="Troco para quanto?">

                <div class="text-2xl font-black text-right neon-text my-6 border-t border-zinc-800 pt-4">
                    Total: R$ <span id="cart-total">0.00</span>
                </div>
                
                <div id="btn-final-container">
                    <button onclick="finalizeOrder()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase shadow-lg text-sm">Registrar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-[2rem] p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-2xl font-black neon-text mb-4 italic uppercase text-center"></h3>
            <div id="modal-options" class="space-y-6"></div>
            <button onclick="addToCartFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black text-sm uppercase mt-6">ADICIONAR</button>
            <button onclick="closeModal()" class="w-full py-3 text-zinc-500 text-[10px] mt-2 uppercase font-bold text-center">Voltar</button>
        </div>
    </div>

    <button onclick="toggleCart()" class="fixed bottom-6 right-6 bg-[#39FF14] text-black px-6 py-4 rounded-full shadow-[0_0_25px_#39FF14] z-50 flex items-center gap-3">
        <span class="text-xl">🛒</span><span id="cart-count" class="font-black text-lg">0</span>
    </button>

    <script>
        const WHATSAPP_NUMBER = "5521997437285";
        const URL_PLANILHA = "SUA_URL_DO_GOOGLE_SCRIPT_AQUI"; // Coloque sua URL aqui
        const SENHA_ADMIN = "1233";
        let modoAdmin = false;
        let cart = [];
        let currentItem = null;
        let selectedSize = 35;
        let modalidadeAtual = "DELIVERY";

        const HORARIOS = {
            4: { abrir: 2000, fechar: 2400 }, // Qui
            5: { abrir: 2000, fechar: 2500 }, // Sex
            6: { abrir: 2000, fechar: 2500 }, // Sab
            0: { abrir: 1900, fechar: 2500 }  // Dom
        };

        const menuData = {
            promos: [
                { name: "2 Pizzas 25cm + Refri 1L", price: 55.00, pizzas: 2, refri: "1L" },
                { name: "1 Pizza 35cm + Refri 2L", price: 46.00, pizzas: 1, refri: "2L" }
            ],
            tradicional: [
                { name: "Mussarela", p25: 24, p35: 39, desc: "Molho e mussarela" },
                { name: "Calabresa", p25: 24, p35: 39, desc: "Mussarela, calabresa e cebola" },
                { name: "Portuguesa", p25: 29, p35: 43, desc: "Ovos, cebola, presunto e mussarela" }
            ],
            bebidas: [
                { name: "Guaracamp", price: 2.50 },
                { name: "Coca-Cola 2L", price: 12.00 }
            ]
        };

        function estaAberto() {
            if (modoAdmin) return true;
            const agora = new Date();
            let dia = agora.getDay();
            let horaAtual = (agora.getHours() * 100) + agora.getMinutes();
            if (horaAtual < 500) { horaAtual += 2400; dia = dia === 0 ? 6 : dia - 1; }
            const config = HORARIOS[dia];
            return config ? (horaAtual >= config.abrir && horaAtual <= config.fechar) : false;
        }

        function ativarModoAdmin() {
            if(prompt("Senha Admin:") === SENHA_ADMIN) {
                modoAdmin = true;
                alert("🛠️ MODO ADMIN: Vendas Liberadas!");
            }
        }

        function switchCategory(cat) {
            const container = document.getElementById('items-container');
            const nav = document.getElementById('nav-categorias');
            
            // Renderiza botões da nav
            const cats = ['promos', 'tradicional', 'bebidas'];
            nav.innerHTML = cats.map(c => `<button onclick="switchCategory('${c}')" class="category-btn ${c===cat?'active':''} px-4 py-2 rounded-full shrink-0">${c}</button>`).join('');

            container.innerHTML = (menuData[cat] || []).map((item, idx) => `
                <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center">
                    <div>
                        <h4 class="font-black text-white uppercase italic">${item.name}</h4>
                        <p class="text-[10px] gold-text font-bold mt-1">${item.price ? 'R$ '+item.price.toFixed(2) : 'A partir de R$ '+item.p25.toFixed(2)}</p>
                    </div>
                    <button onclick='openItemModal("${cat}", ${idx})' class="bg-zinc-800 text-[#39FF14] px-4 py-2 rounded-xl text-[10px] font-black uppercase">Escolher</button>
                </div>
            `).join('');
        }

        function openItemModal(cat, idx) {
            currentItem = menuData[cat][idx];
            if(cat === 'bebidas') { 
                cart.push({ name: currentItem.name, price: currentItem.price }); 
                updateCartUI(); 
                return; 
            }
            document.getElementById('modal-title').innerText = currentItem.name;
            let html = `<div class="space-y-4">`;
            if(currentItem.p35) {
                html += `
                    <div class="flex gap-2">
                        <button onclick="selectedSize=25" class="flex-1 p-3 border border-zinc-700 rounded-xl text-xs font-bold">25CM</button>
                        <button onclick="selectedSize=35" class="flex-1 p-3 border-2 border-[#39FF14] rounded-xl text-xs font-bold text-[#39FF14]">35CM</button>
                    </div>`;
            }
            html += `<p class="text-zinc-500 text-[10px] uppercase text-center">Personalização disponível no WhatsApp</p></div>`;
            document.getElementById('modal-options').innerHTML = html;
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function addToCartFinal() {
            let price = currentItem.price || (selectedSize === 25 ? currentItem.p25 : currentItem.p35);
            let name = currentItem.name + (currentItem.p35 ? ` (${selectedSize}cm)` : "");
            cart.push({ name, price });
            updateCartUI();
            closeModal();
        }

        function updateCartUI() {
            const total = cart.reduce((acc, i) => acc + i.price, 0);
            document.getElementById('cart-total').innerText = total.toFixed(2);
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `
                <div class="flex justify-between items-center bg-black p-3 rounded-xl border border-zinc-800">
                    <span class="text-[10px] uppercase font-bold">${i.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="neon-text text-xs font-bold">R$ ${i.price.toFixed(2)}</span>
                        <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500 text-lg">&times;</button>
                    </div>
                </div>
            `).join('');
        }

        function setModalidade(tipo) {
            modalidadeAtual = tipo;
            document.getElementById('mode-delivery').classList.toggle('active', tipo === 'DELIVERY');
            document.getElementById('mode-retirada').classList.toggle('active', tipo === 'RETIRADA');
            document.getElementById('area-endereco').classList.toggle('hidden', tipo === 'RETIRADA');
            if(tipo === 'RETIRADA') document.getElementById('cust-addr').value = "RETIRADA NA LOJA";
            else document.getElementById('cust-addr').value = "";
        }

        async function finalizeOrder() {
            if (!estaAberto()) return alert("Estamos Fechados!");
            
            const n = document.getElementById('cust-name').value;
            const a = document.getElementById('cust-addr').value;
            const p = document.getElementById('pay-method').value;
            const t = document.getElementById('troco-val').value;
            const total = document.getElementById('cart-total').innerText;

            if(!n || !a || cart.length === 0) return alert("Preencha todos os campos!");

            // 1. Enviar para Planilha (em segundo plano)
            const dados = { nome: n, endereco: a, itens: cart.map(i => i.name).join(' | '), pagamento: p + (t?' Troco:'+t:''), total: "R$ "+total, modalidade: modalidadeAtual };
            fetch(URL_PLANILHA, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) });

            // 2. Gerar Mensagem
            let msg = `*NOVO PEDIDO KF SABORES*%0A%0A*CLIENTE:* ${n}%0A*TIPO:* ${modalidadeAtual}%0A*ENDEREÇO:* ${a}%0A%0A*ITENS:*%0A${cart.map(i => '• ' + i.name).join('%0A')}%0A%0A*PAGAMENTO:* ${p}%0A*TOTAL:* R$ ${total}`;

            // 3. Tela de Sucesso (iPhone Friendly)
            document.getElementById('cart-content').innerHTML = `
                <div class="success-screen">
                    <span class="text-6xl block mb-4">✅</span>
                    <h2 class="text-xl font-black neon-text uppercase italic mb-2">Pedido Registrado!</h2>
                    <p class="text-zinc-500 text-[10px] font-bold uppercase mb-8">Clique no botão abaixo para confirmar no WhatsApp:</p>
                    <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase block text-center shadow-lg">ENVIAR WHATSAPP</a>
                    <button onclick="location.reload()" class="w-full py-4 text-zinc-600 text-[10px] font-bold uppercase mt-4">Fazer outro pedido</button>
                </div>`;
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function closeModal() { document.getElementById('item-modal').classList.add('hidden'); }
        function checkPayment() { document.getElementById('troco-val').classList.toggle('hidden', document.getElementById('pay-method').value !== 'Dinheiro'); }

        // Início
        switchCategory('promos');
    </script>
</body>
</html>
