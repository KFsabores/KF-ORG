<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; }
        .neon-text { color: #39FF14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.8), 0 0 20px rgba(57, 255, 20, 0.5); }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        .gold-text { color: #FFD700; text-shadow: 0 0 3px rgba(255, 215, 0, 0.6); }
        .category-btn { border: 1px solid #333; transition: 0.3s; color: #999; text-transform: uppercase; font-size: 10px; font-weight: 900; white-space: nowrap; }
        .category-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        select, input { background: #111 !important; border: 1px solid #333 !important; border-radius: 10px !important; padding: 12px !important; color: white !important; width: 100%; outline: none; margin-bottom: 8px; font-size: 14px; }
        .hidden { display: none; }
        .modal-btn { border: 2px solid #333; padding: 12px; border-radius: 15px; font-size: 12px; font-weight: 900; color: #666; text-transform: uppercase; transition: 0.3s; }
        .modal-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        .success-screen { text-align: center; padding: 20px; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-24">

    <div class="absolute top-4 right-4 z-[60]">
        <button onclick="ativarModoAdmin()" class="bg-zinc-900 border border-zinc-700 text-zinc-500 px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:text-[#39FF14] transition-colors">Admin</button>
    </div>

    <header class="bg-black py-10 flex flex-col items-center border-b-2 border-[#39FF14]">
        <div class="relative p-5 border-2 neon-border rounded-2xl mb-4 text-center bg-black">
             <h1 class="text-6xl font-black italic tracking-tighter gold-text leading-none">KF</h1>
             <p class="text-xl font-medium neon-text tracking-[.6em] uppercase -mt-1 pl-1 text-center">Sabores</p>
        </div>
        <p class="text-[12px] text-zinc-300 font-normal uppercase tracking-widest italic text-center px-6">Pizzas & Tapiocas Gourmet</p>
    </header>

    <nav class="flex overflow-x-auto bg-black p-3 gap-2 sticky top-0 z-50 border-b border-zinc-800">
        <button onclick="switchCategory('promos')" class="category-btn active px-4 py-2 rounded-full shrink-0">🔥 Promos</button>
        <button onclick="switchCategory('tradicional')" class="category-btn px-4 py-2 rounded-full shrink-0">🍕 Tradicional</button>
        <button onclick="switchCategory('especial')" class="category-btn px-4 py-2 rounded-full shrink-0">🌟 Especial</button>
        <button onclick="switchCategory('premium')" class="category-btn px-4 py-2 rounded-full shrink-0">💎 Premium</button>
        <button onclick="switchCategory('doces')" class="category-btn px-4 py-2 rounded-full shrink-0">🍫 Pizzas Doces</button>
        <button onclick="switchCategory('tapioca')" class="category-btn px-4 py-2 rounded-full shrink-0">Tapiocas</button>
        <button onclick="switchCategory('bebidas')" class="category-btn px-4 py-2 rounded-full shrink-0">🥤 Bebidas</button>
    </nav>

    <main id="items-container" class="p-4 space-y-4 max-w-lg mx-auto"></main>

    <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[90]">
        <div id="cart-content" class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto relative">
            
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-2xl font-bold p-2">&times;</button>
            
            <h2 class="text-xl font-black neon-text mb-4 italic uppercase text-center mt-2">Meu Pedido</h2>
            
            <div id="cart-items" class="space-y-2 mb-4"></div>
            
            <div id="form-inputs">
                <input type="text" id="cust-name" placeholder="Seu Nome">
                <label class="text-[10px] gold-text font-black uppercase italic mt-4 block">Como deseja receber?</label>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="mode-delivery" onclick="setModalidade('DELIVERY')" class="modal-btn active">🛵 Entrega</button>
                    <button id="mode-retirada" onclick="setModalidade('RETIRADA')" class="modal-btn">🛍️ Retirada</button>
                </div>
                <div id="area-endereco">
                    <input type="text" id="cust-addr" placeholder="Endereço, Número e Bairro">
                </div>
                <label class="text-[10px] gold-text font-black uppercase italic mt-2 block">Forma de Pagamento</label>
                <select id="pay-method" onchange="checkPayment()">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <input type="text" id="troco-val" class="hidden" placeholder="Troco para quanto?">
                <div class="text-2xl font-black text-right neon-text my-4 border-t border-zinc-800 pt-4">Subtotal: R$ <span id="cart-total">0.00</span></div>
                
                <div id="area-botao-finalizar">
                    <button onclick="finalizeOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Finalizar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-2xl font-black neon-text mb-4 italic uppercase text-center"></h3>
            <div id="modal-options" class="space-y-6"></div>
            <button onclick="addToCartFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black text-sm uppercase mt-6 shadow-lg">ADICIONAR AO PEDIDO</button>
            <button onclick="closeModal()" class="w-full py-3 text-zinc-500 text-[10px] mt-2 uppercase font-bold text-center block">Cancelar</button>
        </div>
    </div>

    <button onclick="toggleCart()" class="fixed bottom-6 right-6 bg-[#39FF14] text-black px-6 py-4 rounded-full shadow-[0_0_20px_#39FF14] z-50 flex items-center gap-3">
        <span class="text-xl">🛒</span><span id="cart-count" class="font-black text-lg">0</span>
    </button>

    <script>
        const WHATSAPP_NUMBER = "5521997437285";
        const URL_PLANILHA = "SUA_URL_AQUI"; 
        const SENHA_ADMIN = "1233";
        let modoAdmin = false;

        // Horários
        const HORARIOS = {
            4: { abrir: 2000, fechar: 2400 },
            5: { abrir: 2000, fechar: 2500 },
            6: { abrir: 2000, fechar: 2500 },
            0: { abrir: 1900, fechar: 2500 }
        };

        function estaAberto() {
            if (modoAdmin) return true;
            const agora = new Date();
            let dia = agora.getDay();
            let horaAtual = (agora.getHours() * 100) + agora.getMinutes();
            if (horaAtual < 500) { horaAtual += 2400; dia = dia === 0 ? 6 : dia - 1; }
            const config = HORARIOS[dia];
            return config ? (horaAtual >= config.abrir && horaAtual <= config.fechar) : false;
        }

        function ativarModoAdmin() {
            const pass = prompt("Senha de Acesso:");
            if (pass === SENHA_ADMIN) {
                modoAdmin = true;
                alert("🛠️ MODO ADMIN ATIVADO! Vendas liberadas.");
            } else {
                alert("❌ Senha incorreta.");
            }
        }

        async function finalizeOrder() {
            if (!estaAberto()) {
                alert("Fora do horário de funcionamento!");
                return;
            }

            const n = document.getElementById('cust-name').value;
            const a = document.getElementById('cust-addr').value;
            const p = document.getElementById('pay-method').value;
            const t = document.getElementById('troco-val').value;
            const total = document.getElementById('cart-total').innerText;

            if(!n || !a || cart.length === 0) return alert("Preencha Nome e Endereço!");
            
            let msg = `*🔥 NOVO PEDIDO KF SABORES*%0A%0A*👤 CLIENTE:* ${n.toUpperCase()}%0A*📍 ENDEREÇO:* ${a.toUpperCase()}%0A%0A*🛒 ITENS:*%0A${cart.map(i => '• ' + i.name.toUpperCase()).join('%0A')}%0A%0A*💰 TOTAL:* R$ ${total}`;

            try {
                fetch(URL_PLANILHA, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nome: n, endereco: a, itens: cart.map(i => i.name).join(' | '), pagamento: p, total: "R$ "+total }) });
            } catch (e) {}

            const cartContent = document.getElementById('cart-content');
            cartContent.innerHTML = `
                <div class="success-screen">
                    <span class="text-6xl mb-4 block">✅</span>
                    <h2 class="text-2xl font-black neon-text italic uppercase mb-2">Pedido Registrado!</h2>
                    <p class="text-zinc-400 text-[10px] mb-8 uppercase font-bold">Clique abaixo para confirmar no WhatsApp:</p>
                    <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase block text-center mb-4">ENVIAR WHATSAPP</a>
                    <button onclick="location.reload()" class="w-full py-2 text-zinc-500 text-[10px] uppercase font-bold">Voltar</button>
                </div>`;
        }

        // Funções de suporte (mesmas das anteriores)
        let cart = [];
        let modalidadeAtual = "DELIVERY";
        function setModalidade(tipo) {
            modalidadeAtual = tipo;
            document.getElementById('mode-delivery').classList.toggle('active', tipo === 'DELIVERY');
            document.getElementById('mode-retirada').classList.toggle('active', tipo === 'RETIRADA');
            document.getElementById('area-endereco').classList.toggle('hidden', tipo === 'RETIRADA');
            if(tipo === 'RETIRADA') document.getElementById('cust-addr').value = "RETIRADA NA LOJA";
        }
        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function checkPayment() { document.getElementById('troco-val').classList.toggle('hidden', document.getElementById('pay-method').value !== 'Dinheiro'); }
        function updateCartUI() {
            const total = cart.reduce((acc, i) => acc + i.price, 0);
            document.getElementById('cart-total').innerText = total.toFixed(2);
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `<div class="flex justify-between items-start bg-black p-3 rounded-xl border border-zinc-800 text-[10px]"><span class="w-3/4 uppercase">${i.name}</span><div class="flex items-center gap-3"><span class="neon-text font-bold">R$ ${i.price.toFixed(2)}</span><button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500 font-bold px-2">✕</button></div></div>`).join('');
        }
        function closeModal() { document.getElementById('item-modal').classList.add('hidden'); }
        function switchCategory(cat) { /* Lógica de carregar itens... */ }
        
        // Inicialização básica
        updateCartUI();
    </script>
</body>
</html>
