<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=places,geometry"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .neon-text { color: #39FF14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.8), 0 0 20px rgba(57, 255, 20, 0.5); }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        .gold-text { color: #FFD700; text-shadow: 0 0 3px rgba(255, 215, 0, 0.5); }
        .category-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        .category-card:hover { transform: translateY(-5px); border-color: #39FF14; background: rgba(57, 255, 20, 0.05); }
        #cart-modal, #item-modal, #tapioca-modal { backdrop-filter: blur(12px); background: rgba(0,0,0,0.85); }
        .btn-order { background: linear-gradient(90deg, #39FF14, #2ecc71); color: #000; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-order:hover { box-shadow: 0 0 25px rgba(57, 255, 20, 0.7); transform: scale(1.02); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .check-custom:checked + label { background: #39FF14; color: #000; border-color: #39FF14; }
    </style>
</head>
<body class="pb-24">

    <div id="admin-back-btn" class="hidden fixed top-4 right-4 z-[100]">
        <a href="./painel.html" class="bg-red-600 text-white px-4 py-2 rounded-full font-bold text-xs shadow-lg hover:bg-red-700 transition-all flex items-center gap-2">
            <span>⬅️ VOLTAR AO PAINEL</span>
        </a>
    </div>

    <header class="p-8 text-center border-b border-zinc-900 bg-black/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="inline-block p-1 px-3 border border-[#39FF14] rounded-full mb-3">
            <span class="text-[9px] font-black text-[#39FF14] tracking-[0.3em] uppercase">Aberto Agora</span>
        </div>
        <h1 class="text-5xl font-black italic tracking-tighter neon-text mb-1">KF SABORES</h1>
        <p class="text-[10px] uppercase tracking-[0.4em] font-bold text-zinc-500">Premium Delivery • Paciência, RJ</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-12 mt-4">
        <section>
            <h2 class="text-xs font-black uppercase tracking-[0.2em] mb-6 text-zinc-400 flex items-center gap-3">
                <span class="flex-1 h-[1px] bg-zinc-800"></span> EXPLORE O MENU <span class="flex-1 h-[1px] bg-zinc-800"></span>
            </h2>
            
            <div class="grid grid-cols-2 gap-3" id="categories-grid">
                </div>
        </section>

        <section id="menu-items" class="space-y-6">
            </section>
    </main>

    <div id="tapioca-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-md rounded-[2.5rem] overflow-hidden border border-zinc-800 shadow-2xl">
            <div class="p-8">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span class="text-[#39FF14] font-black text-[10px] uppercase tracking-widest">Personalizar</span>
                        <h3 class="text-3xl font-black italic leading-none mt-1">SUA TAPIOCA</h3>
                    </div>
                    <button onclick="closeModal()" class="bg-zinc-800 p-2 rounded-full text-zinc-500">✕</button>
                </div>

                <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-2 hide-scrollbar">
                    <div>
                        <p class="text-xs font-bold text-zinc-500 mb-3 uppercase tracking-tighter">Escolha até 2 Sabores (Meio a Meio)</p>
                        <div id="tapioca-flavors-list" class="grid grid-cols-1 gap-2">
                            </div>
                    </div>

                    <div>
                        <p class="text-xs font-bold text-zinc-500 mb-3 uppercase tracking-tighter">Turbine sua experiência (+ R$)</p>
                        <div id="tapioca-extras-list" class="space-y-2">
                            </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-zinc-800">
                    <button id="confirm-tapioca-btn" class="w-full btn-order p-5 rounded-2xl flex justify-between items-center group">
                        <span class="group-hover:translate-x-1 transition-transform">ADICIONAR AO CARRINHO</span>
                        <span id="tapioca-total-preview" class="font-black">R$ 0,00</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-btn" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-50 transition-all duration-500 transform scale-0">
        <button onclick="toggleCart()" class="w-full btn-order p-6 rounded-[2rem] flex justify-between items-center shadow-[0_20px_50px_rgba(57,255,20,0.3)]">
            <div class="flex items-center gap-3">
                <div class="bg-black text-[#39FF14] w-8 h-8 rounded-full flex items-center justify-center font-black text-sm" id="cart-count">0</div>
                <span class="font-black italic">VER CARRINHO</span>
            </div>
            <span id="cart-total-btn" class="text-xl font-black">R$ 0,00</span>
        </button>
    </div>

    <div id="cart-modal" class="fixed inset-0 z-[80] hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-md rounded-t-[3rem] sm:rounded-[3rem] p-8 border-t-8 border-[#39FF14] shadow-2xl max-h-[95vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-3xl font-black italic">CHECKOUT</h3>
                <button onclick="toggleCart()" class="text-zinc-600 font-bold hover:text-white transition-colors">FECHAR</button>
            </div>

            <div id="cart-items-list" class="space-y-4 mb-8">
                </div>

            <div class="bg-black/50 p-6 rounded-[2rem] border border-zinc-800 space-y-4 mb-6">
                <div class="flex p-1 bg-zinc-800 rounded-2xl">
                    <button id="btn-delivery" onclick="setModalidade('DELIVERY')" class="flex-1 py-3 rounded-xl font-black text-xs transition-all bg-[#39FF14] text-black">DELIVERY</button>
                    <button id="btn-retirada" onclick="setModalidade('RETIRADA')" class="flex-1 py-3 rounded-xl font-black text-xs transition-all text-zinc-500">RETIRADA</button>
                </div>

                <div id="area-endereco" class="space-y-3">
                    <input type="text" id="cust-name" placeholder="NOME COMPLETO" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-sm focus:border-[#39FF14] outline-none transition-all">
                    <input type="text" id="cust-phone" placeholder="WHATSAPP (DDD)" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-sm focus:border-[#39FF14] outline-none transition-all">
                    <div class="relative">
                        <input type="text" id="cust-address" placeholder="ENDEREÇO E NÚMERO" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-sm focus:border-[#39FF14] outline-none transition-all">
                        <div id="loading-taxa" class="hidden absolute right-4 top-4 animate-spin text-[#39FF14]">⌛</div>
                    </div>
                </div>

                <select id="pay-method" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-sm font-bold text-zinc-400 outline-none">
                    <option value="PIX">PAGAMENTO: PIX (RÁPIDO)</option>
                    <option value="CARTÃO">CARTÃO (LEVAMOS A MAQUININHA)</option>
                    <option value="DINHEIRO">DINHEIRO</option>
                </select>
            </div>

            <div class="space-y-3 mb-8 px-4">
                <div class="flex justify-between text-zinc-500 font-bold text-xs uppercase tracking-widest">
                    <span>Subtotal</span>
                    <span id="subtotal-val">R$ 0,00</span>
                </div>
                <div id="taxa-row" class="flex justify-between text-zinc-500 font-bold text-xs uppercase tracking-widest">
                    <span>Taxa de Entrega</span>
                    <span id="taxa-val" class="text-[#39FF14]">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-2xl font-black italic text-white pt-4 border-t border-zinc-800">
                    <span>TOTAL</span>
                    <span id="total-final" class="neon-text">R$ 0,00</span>
                </div>
            </div>

            <button onclick="finalizarPedido()" class="w-full btn-order p-6 rounded-2xl text-lg flex justify-center items-center gap-3">
                <span>ENVIAR NO WHATSAPP</span>
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.588-5.946 0-6.556 5.332-11.888 11.888-11.888 3.176 0 6.161 1.237 8.404 3.48s3.481 5.229 3.481 8.406c0 6.555-5.332 11.887-11.888 11.887-2.007 0-3.974-.506-5.717-1.464l-6.267 1.688zm6.066-3.447l.366.218c1.542.92 3.328 1.406 5.163 1.406 5.456 0 9.897-4.442 9.897-9.896 0-2.64-1.029-5.123-2.897-6.991s-4.352-2.897-6.992-2.897c-5.457 0-9.898 4.441-9.898 9.896 0 1.831.482 3.614 1.397 5.148l.24.403-1.044 3.815 3.916-1.054z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO E DADOS ---
        const WHATSAPP_NUMBER = "5521971510619";
        const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbyR67m9099_Uv6-6OonYc2M47-E37Z8vAn6G0m2oVv6X-lX6o7_G-5z7Wp522yv3H56/exec";
        
        let cart = [];
        let modalidadeAtual = 'DELIVERY';
        let taxaEntrega = 0;

        // VERIFICA SE É ADMIN (Para Vercel)
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('admin')) {
                document.getElementById('admin-back-btn').classList.remove('hidden');
            }
            // Aqui você chamaria sua função de carregar produtos da planilha ou objeto fixo
            renderCategories();
        };

        // --- BASE DE DADOS DO CARDÁPIO ---
        const categories = [
            { id: 'tapiocas', name: 'Tapiocas Salgadas', icon: '🌮' },
            { id: 'doces', name: 'Tapiocas Doces', icon: '🍫' },
            { id: 'bebidas', name: 'Bebidas', icon: '🥤' }
        ];

        const items = [
            { id: 1, cat: 'tapiocas', name: 'FRANGO C/ CATUPIRY', price: 18.00, desc: 'Frango desfiado temperado com catupiry original.' },
            { id: 2, cat: 'tapiocas', name: 'CARNE SECA C/ CREAM CHEESE', price: 22.00, desc: 'Carne seca artesanal com cream cheese.' },
            { id: 3, cat: 'tapiocas', name: 'PRESUNTO E QUEIJO', price: 15.00, desc: 'Clássica combinação de presunto e muçarela.' },
            { id: 4, cat: 'doces', name: 'NUTELLA COM MORANGO', price: 20.00, desc: 'Muita Nutella com morangos frescos.' },
            { id: 5, cat: 'bebidas', name: 'COCA-COLA LATA', price: 6.00, desc: '350ml bem gelada.' }
        ];

        const extras = [
            { name: 'QUEIJO EXTRA', price: 4.00 },
            { name: 'BACON', price: 5.00 },
            { name: 'OVO', price: 3.00 }
        ];

        // --- LÓGICA DE RENDERIZAÇÃO ---
        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = categories.map(cat => `
                <div onclick="filterMenu('${cat.id}')" class="category-card bg-zinc-900 p-6 rounded-[2rem] text-center transition-all">
                    <span class="text-3xl mb-2 block">${cat.icon}</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">${cat.name}</span>
                </div>
            `).join('');
            filterMenu('tapiocas'); // Inicia com tapiocas
        }

        function filterMenu(catId) {
            const container = document.getElementById('menu-items');
            const filtered = items.filter(i => i.cat === catId);
            
            container.innerHTML = filtered.map(item => `
                <div onclick="openItemModal(${item.id})" class="bg-zinc-900/50 p-4 rounded-3xl border border-zinc-800 flex justify-between items-center group cursor-pointer hover:border-[#39FF14] transition-all">
                    <div class="flex-1">
                        <h3 class="font-black italic text-lg uppercase">${item.name}</h3>
                        <p class="text-zinc-500 text-xs mt-1 leading-relaxed">${item.desc}</p>
                        <p class="text-[#39FF14] font-black mt-2">R$ ${item.price.toFixed(2)}</p>
                    </div>
                    <div class="w-12 h-12 bg-zinc-800 rounded-2xl flex items-center justify-center group-hover:bg-[#39FF14] group-hover:text-black transition-all">
                        <span class="text-xl font-bold">+</span>
                    </div>
                </div>
            `).join('');
        }

        // Lógica de abertura de modal (Simplificada para o exemplo, você pode expandir)
        function openItemModal(id) {
            const item = items.find(i => i.id === id);
            if(item.cat === 'tapiocas' || item.cat === 'doces') {
                // Abre modal de personalização
                document.getElementById('tapioca-modal').classList.remove('hidden');
                setupTapiocaModal(item);
            } else {
                // Adiciona direto ao carrinho
                addToCart(item.name, item.price);
            }
        }

        function setupTapiocaModal(baseItem) {
            const list = document.getElementById('tapioca-flavors-list');
            // Mostra outros sabores para meio a meio
            list.innerHTML = items.filter(i => i.cat === baseItem.cat).map(i => `
                <div class="flex items-center justify-between p-3 bg-zinc-800 rounded-xl">
                    <label class="text-sm font-bold uppercase">${i.name}</label>
                    <input type="checkbox" class="w-5 h-5 accent-[#39FF14]" value="${i.name}" data-price="${i.price}">
                </div>
            `).join('');
            
            document.getElementById('tapioca-total-preview').innerText = `R$ ${baseItem.price.toFixed(2)}`;
            
            document.getElementById('confirm-tapioca-btn').onclick = () => {
                addToCart(`TAPIOCA: ${baseItem.name}`, baseItem.price);
                closeModal();
            };
        }

        function addToCart(name, price) {
            cart.push({ name, price: parseFloat(price) });
            updateCartUI();
        }

        function setModalidade(tipo) {
            modalidadeAtual = tipo;
            const btnD = document.getElementById('btn-delivery');
            const btnR = document.getElementById('btn-retirada');
            const areaEnd = document.getElementById('area-endereco');

            if(tipo === 'DELIVERY') {
                btnD.className = "flex-1 py-3 rounded-xl font-black text-xs transition-all bg-[#39FF14] text-black";
                btnR.className = "flex-1 py-3 rounded-xl font-black text-xs transition-all text-zinc-500";
                areaEnd.classList.remove('hidden');
            } else {
                btnR.className = "flex-1 py-3 rounded-xl font-black text-xs transition-all bg-[#39FF14] text-black";
                btnD.className = "flex-1 py-3 rounded-xl font-black text-xs transition-all text-zinc-500";
                areaEnd.classList.add('hidden');
                taxaEntrega = 0;
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.length;
            const subtotal = cart.reduce((acc, i) => acc + (parseFloat(i.price) || 0), 0);
            const total = subtotal + taxaEntrega;

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total-btn').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('subtotal-val').innerText = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('taxa-val').innerText = `R$ ${taxaEntrega.toFixed(2)}`;
            document.getElementById('total-final').innerText = `R$ ${total.toFixed(2)}`;
            
            const btn = document.getElementById('cart-btn');
            if(count > 0) { btn.classList.remove('scale-0'); } else { btn.classList.add('scale-0'); }
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function closeModal() { 
            document.getElementById('tapioca-modal').classList.add('hidden'); 
        }

        function finalizarPedido() {
            const n = document.getElementById('cust-name').value;
            const tel = document.getElementById('cust-phone').value;
            const a = modalidadeAtual === 'DELIVERY' ? document.getElementById('cust-address').value : 'RETIRADA';
            const totalStr = (cart.reduce((acc, i) => acc + (parseFloat(i.price) || 0), 0) + taxaEntrega).toFixed(2);

            if(!n || !tel || (modalidadeAtual === 'DELIVERY' && !a)) {
                alert("Preencha todos os dados!"); return;
            }

            let msg = `*🔥 NOVO PEDIDO KF SABORES*%0A%0A`;
            msg += `*👤 CLIENTE:* ${n.toUpperCase()}%0A*📍 END:* ${a.toUpperCase()}%0A*🚚 MOD:* ${modalidadeAtual}%0A*💳 PAGTO:* ${document.getElementById('pay-method').value}%0A%0A*🍕 ITENS:*%0A`;
            cart.forEach(i => msg += `• ${i.name}%0A`);
            msg += `%0A*💰 TOTAL: R$ ${totalStr}*`;

            fetch(URL_PLANILHA, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({
                    nome: n, telefone: tel, endereco: a, total: totalStr, pagamento: document.getElementById('pay-method').value,
                    modalidade: modalidadeAtual, itens: cart.map(i=>i.name).join(" | "), taxa: taxaEntrega.toFixed(2)
                }) 
            });

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`);
            cart = []; updateCartUI(); toggleCart();
        }
    </script>
</body>
</html>
