<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=places"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; }
        .neon-text { color: #39FF14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.8), 0 0 20px rgba(57, 255, 20, 0.5); }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        .gold-text { color: #FFD700; text-shadow: 0 0 3px rgba(255, 215, 0, 0.6); }
        .category-btn { border: 1px solid #333; transition: 0.3s; color: #999; text-transform: uppercase; font-size: 10px; font-weight: 900; white-space: nowrap; }
        .category-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        select, input, textarea { background: #111 !important; border: 1px solid #333 !important; border-radius: 10px !important; padding: 12px !important; color: white !important; width: 100%; outline: none; margin-bottom: 8px; font-size: 14px; }
        textarea { resize: none; height: 70px; }
        .ing-label { grid-column: 1 / -1; background: #1a1a1a; padding: 6px 12px; border-left: 4px solid #39FF14; font-size: 10px; font-weight: 900; color: #FFD700; margin-top: 15px; text-transform: uppercase; }
        .ing-btn { border: 1px solid #333; padding: 10px; border-radius: 12px; font-size: 10px; text-align: left; background: #0a0a0a; transition: 0.2s; }
        .ing-btn.selected { border-color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        .hidden { display: none; }
        .modal-btn { border: 2px solid #333; padding: 12px; border-radius: 15px; font-size: 12px; font-weight: 900; color: #666; text-transform: uppercase; transition: 0.3s; }
        .modal-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        #banner-status { background: rgba(255, 68, 68, 0.15); border: 1px solid #ff4444; color: #ff4444; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-black py-4 flex flex-col items-center border-b border-zinc-800">
        <div class="w-full max-w-lg px-4">
            <img src="https://i.postimg.cc/XYndVmSN/logo2-KF.png" alt="KF Sabores" class="w-full h-auto drop-shadow-[0_0_10px_rgba(57,255,20,0.3)]">
        </div>
    </header>

    <div id="banner-status" class="hidden p-4 mx-4 mt-4 rounded-2xl border text-center">
        <h2 class="font-black uppercase italic text-sm mb-2">🚫 LOJA FECHADA NO MOMENTO!</h2>
        <div id="horarios-lista" class="text-[10px] grid grid-cols-2 gap-x-4 gap-y-1 opacity-80 font-bold uppercase"></div>
    </div>

    <nav class="flex overflow-x-auto bg-black p-3 gap-2 sticky top-0 z-50 border-b border-zinc-800">
        <button onclick="switchCategory('promos')" class="category-btn active px-4 py-2 rounded-full shrink-0">🔥 Promos</button>
        <button onclick="switchCategory('tradicional')" class="category-btn px-4 py-2 rounded-full shrink-0">🍕 Tradicional</button>
        <button onclick="switchCategory('especial')" class="category-btn px-4 py-2 rounded-full shrink-0">🌟 Especial</button>
        <button onclick="switchCategory('premium')" class="category-btn px-4 py-2 rounded-full shrink-0">💎 Premium</button>
        <button onclick="switchCategory('doces')" class="category-btn px-4 py-2 rounded-full shrink-0">🍫 Pizzas Doces</button>
        <button onclick="switchCategory('tapioca')" class="category-btn px-4 py-2 rounded-full shrink-0">Tapiocas</button>
        <button onclick="switchCategory('bebidas')" class="category-btn px-4 py-2 rounded-full shrink-0">🥤 Bebidas</button>
    </nav>

    <main id="items-container" class="p-4 space-y-4 max-w-lg mx-auto"></main>

    <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[90]">
        <div id="cart-content" class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto relative">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-3xl font-light p-2">&times;</button>
            <h2 class="text-xl font-black neon-text mb-4 italic uppercase text-center mt-2">Meu Pedido</h2>
            <div id="cart-items" class="space-y-2 mb-4"></div>
            
            <div id="form-fechamento">
                <input type="text" id="cust-name" placeholder="Seu Nome">
                <input type="tel" id="cust-phone" placeholder="WhatsApp (Ex: 21997437285)">
                
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="mode-delivery" onclick="setModalidade('DELIVERY')" class="modal-btn active">🛵 Entrega</button>
                    <button id="mode-retirada" onclick="setModalidade('RETIRADA')" class="modal-btn">🛍️ Retirada</button>
                </div>
                
                <div id="area-endereco">
                    <input type="text" id="cust-addr" placeholder="Digite endereço e selecione..." onfocus="initAutocomplete()">
                    <p id="distancia-info" class="text-[10px] gold-text mb-2 italic font-bold text-center"></p>
                </div>

                <textarea id="cust-obs" placeholder="Ponto de referência ou observação"></textarea>
                
                <select id="pay-method" onchange="checkPayment()">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <input type="text" id="troco-val" class="hidden" placeholder="Troco para quanto?">
                
                <div class="space-y-1 text-sm border-t border-zinc-800 pt-4 mt-4">
                    <div class="flex justify-between text-zinc-400"><span>Subtotal:</span><span>R$ <span id="cart-subtotal">0.00</span></span></div>
                    <div class="flex justify-between text-zinc-400" id="row-taxa"><span>Taxa de Entrega:</span><span>R$ <span id="taxa-valor">0.00</span></span></div>
                    <div class="flex justify-between text-2xl font-black neon-text pt-2"><span>Total:</span><span>R$ <span id="cart-total">0.00</span></span></div>
                </div>

                <button onclick="finalizeOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase mt-4">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-2xl font-black neon-text mb-4 italic uppercase text-center"></h3>
            <div id="modal-options" class="space-y-6"></div>
            <button onclick="addToCartFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase mt-6">ADICIONAR AO PEDIDO</button>
            <button onclick="closeModal()" class="w-full py-3 text-zinc-500 text-[10px] mt-2 uppercase font-bold text-center block">Cancelar</button>
        </div>
    </div>

    <div id="tapioca-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black neon-text mb-2 italic uppercase">Montar Tapioca</h3>
            <div id="tapioca-options" class="grid grid-cols-2 gap-2"></div>
            <div id="tapioca-extras" class="grid grid-cols-2 gap-2 mt-6"></div>
            <button onclick="addTapiocaFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase mt-8">ADICIONAR TAPIOCA</button>
            <button onclick="closeModal()" class="w-full py-4 text-zinc-500 text-[10px] uppercase font-bold text-center block">Voltar</button>
        </div>
    </div>

    <button onclick="toggleCart()" class="fixed bottom-6 right-6 bg-[#39FF14] text-black px-6 py-4 rounded-full shadow-[0_0_20px_#39FF14] z-50 flex items-center gap-3">
        <span class="text-xl">🛒</span><span id="cart-count" class="font-black text-lg">0</span>
    </button>

    <script>
        const WHATSAPP_NUMBER = "5521997437285";
        const ENDERECO_TRAILER = "R. das Pitombeiras, 507-575 - Paciência, Rio de Janeiro - RJ, 23585-245";
        const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbzhbU6KsTKfKb58jhjTOVki860Z5kYQgJ_ESjOjwh4kJzGmIDaOKu2EXIDQrV44TY-oEQ/exec";
        
        let estoqueAtual = {}; 
        let modoAdmin = false;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') { modoAdmin = true; }
        
        const HORARIOS = {
            4: { abrir: 2000, fechar: 2400 },
            5: { abrir: 2000, fechar: 2500 },
            6: { abrir: 2000, fechar: 2500 },
            0: { abrir: 1900, fechar: 2500 }
        };

        const menuData = {
            promos: [
                { name: "2 Pizzas 25cm + Refri 1L", price: 55.00, pizzas: 2, refri: "1L", desc: "Sabores Tradicionais + Refri 1L" },
                { name: "1 Pizza 35cm + Refri 2L", price: 46.00, pizzas: 1, refri: "2L", desc: "Sabores Tradicionais + Refri 2L" },
                { name: "2 Pizzas 35cm + Refri 2L", price: 85.00, pizzas: 2, refri: "2L", desc: "Sabores Tradicionais + Refri 2L" }
            ],
            tradicional: [
                { name: "Mussarela", p25: 24, p35: 39, desc: "Molho de pizza e mussarela" },
                { name: "Presunto", p25: 24, p35: 39, desc: "Mussarela, presunto e azeitona" },
                { name: "Calabresa", p25: 24, p35: 39, desc: "Mussarela, calabresa e cebola" },
                { name: "3 Queijos", p25: 24, p35: 39, desc: "Mussarela, catupiry e queijo minas" },
                { name: "Marguerita", p25: 24, p35: 39, desc: "Mussarela, tomate e manjericão" },
                { name: "Alho", p25: 24, p35: 39, desc: "Mussarela coberta com alho torrado" }
            ],
            especial: [
                { name: "Frango c/ Catupiry", p25: 29, p35: 43 },
                { name: "Frango c/ Cheddar", p25: 29, p35: 43 },
                { name: "Portuguesa", p25: 29, p35: 43 },
                { name: "Peito de Peru", p25: 29, p35: 43 },
                { name: "Lombo Canadense", p25: 29, p35: 43 }
            ],
            premium: [
                { name: "Camarão c/ Catupiry", p25: 32, p35: 58 },
                { name: "Camarão c/ Cheddar", p25: 32, p35: 58 },
                { name: "Camarão c/ Alho", p25: 32, p35: 58 },
                { name: "Bacon com Ovos", p25: 32, p35: 58 }
            ],
            doces: [
                { name: "Banana c/ Canela", p25: 30, p35: 45 },
                { name: "Prestígio", p25: 30, p35: 45 },
                { name: "M&M", p25: 30, p35: 45 },
                { name: "Paçoca", p25: 30, p35: 45 },
                { name: "Romeu e Julieta", p25: 30, p35: 45 },
                { name: "Caribe", p25: 30, p35: 45 },
                { name: "Sensação", p25: 30, p35: 45 },
                { name: "Banana Nevada", p25: 30, p35: 45 }
            ],
            tapioca_cats: [
                { cat: "Proteínas", items: [{ n: "Lombo Canadense", p: 10 }, { n: "Peito de Peru", p: 13 }, { n: "Calabresa", p: 10 }, { n: "Presunto", p: 10 }, { n: "Frango", p: 13 }] },
                { cat: "Queijos", items: [{ n: "Minas", p: 10 }, { n: "Mussarela", p: 10 }, { n: "Requeijão", p: 10 }, { n: "Catupiry", p: 10 }, { n: "Cheddar", p: 10 }] },
                { cat: "Frutas", items: [{ n: "Coco", p: 10 }, { n: "Morango", p: 14 }, { n: "Abacaxi", p: 10 }, { n: "Banana", p: 10 }] },
                { cat: "Doces", items: [{ n: "Nutella", p: 16 }, { n: "Chocolate Branco", p: 14 }, { n: "Chocolate Preto", p: 14 }, { n: "M&M", p: 10 }, { n: "Doce de Leite", p: 10 }, { n: "Goiabada", p: 10 }, { n: "Paçoca", p: 10 }] }
            ],
            tapioca_extras: ["Leite Condensado", "Açúcar c/ Canela", "Granulado", "Orégano", "Cebola", "Tomate", "Azeitona", "Manteiga", "Alho Torrado", "Molho de Alho", "Molho de Pizza", "Nenhum"],
            bebidas: [
                { name: "Água", price: 2.50 }, { name: "Água c/ Gás", price: 3.50 }, { name: "Guaracamp", price: 2.50 }, { name: "Coca Lata", price: 6.00 },
                { name: "Coca Lata Zero", price: 6.00 }, { name: "Guaraná 1L", price: 10.00 }, { name: "Pepsi 1.5L", price: 12.00 }, { name: "Guaraná 1.5L", price: 12.00 },
                { name: "Sukita Uva 2L", price: 12.00 }, { name: "Sukita Laranja 2L", price: 12.00 }
            ]
        };

        const SABORES_PIZZA = [...menuData.tradicional, ...menuData.especial, ...menuData.premium, ...menuData.doces].map(s => s.name);
        const SABORES_PROMO = ["Calabresa", "Mussarela", "Presunto", "3 Queijos"];
        let cart = []; let currentItem = null; let selectedSize = 35; let tapRecheios = []; let tapExtra = "Nenhum"; 
        let modalidadeAtual = "DELIVERY"; let taxaEntrega = 0; let distanciaTexto = "";

        // GOOGLE MAPS FUNCTIONS
        function initAutocomplete() {
            const input = document.getElementById('cust-addr');
            const autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (!place.geometry) return;
                calcularDistancia(place.formatted_address);
            });
        }

        function calcularDistancia(enderecoCliente) {
            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: [ENDERECO_TRAILER],
                destinations: [enderecoCliente],
                travelMode: 'DRIVING',
            }, (response, status) => {
                if (status === 'OK') {
                    const dados = response.rows[0].elements[0];
                    const km = dados.distance.value / 1000;
                    distanciaTexto = dados.distance.text;

                    // Lógica de Taxas do seu Mapa
                    if (km <= 2.5) taxaEntrega = 4.00;
                    else if (km <= 4.0) taxaEntrega = 6.00;
                    else if (km <= 5.5) taxaEntrega = 8.00;
                    else if (km <= 7.0) taxaEntrega = 9.00;
                    else if (km <= 9.0) taxaEntrega = 10.00;
                    else taxaEntrega = 12.00;

                    document.getElementById('distancia-info').innerText = `🛵 Distância: ${distanciaTexto} | Taxa: R$ ${taxaEntrega.toFixed(2)}`;
                    updateCartUI();
                }
            });
        }

        async function carregarEstoqueUmaVez() {
            try {
                const res = await fetch(`${URL_PLANILHA}?action=getEstoque`);
                estoqueAtual = await res.json();
                switchCategory('promos');
            } catch (e) { console.error("Erro estoque", e); switchCategory('promos'); }
        }

        function estaAberto() {
            if (modoAdmin) return true;
            const agora = new Date();
            let dia = agora.getDay();
            let horaAtual = (agora.getHours() * 100) + agora.getMinutes();
            if (horaAtual < 500) { horaAtual += 2400; dia = dia === 0 ? 6 : dia - 1; }
            const config = HORARIOS[dia];
            return config ? (horaAtual >= config.abrir && horaAtual <= config.fechar) : false;
        }

        function verificarStatusLoja() {
            const banner = document.getElementById('banner-status');
            const listaH = document.getElementById('horarios-lista');
            const diasSemana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
            if (!estaAberto()) {
                banner.classList.remove('hidden');
                let html = "";
                [4, 5, 6, 0].forEach(dia => {
                    const h = HORARIOS[dia];
                    const abr = (h.abrir / 100).toFixed(2).replace('.', ':');
                    const fec = h.fechar >= 2400 ? (h.fechar === 2400 ? "00:00" : (h.fechar === 2500 ? "01:00" : "02:00")) : (h.fechar/100).toFixed(2).replace('.',':');
                    html += `<span>${diasSemana[dia]}</span> <span class="text-white">${abr} às ${fec}</span>`;
                });
                listaH.innerHTML = html;
            } else { banner.classList.add('hidden'); }
        }

        function setModalidade(tipo) {
            modalidadeAtual = tipo;
            document.getElementById('mode-delivery').classList.toggle('active', tipo === 'DELIVERY');
            document.getElementById('mode-retirada').classList.toggle('active', tipo === 'RETIRADA');
            document.getElementById('area-endereco').classList.toggle('hidden', tipo === 'RETIRADA');
            document.getElementById('row-taxa').classList.toggle('hidden', tipo === 'RETIRADA');
            if(tipo === 'RETIRADA') document.getElementById('cust-addr').value = "RETIRADA NA LOJA";
            else if(document.getElementById('cust-addr').value === "RETIRADA NA LOJA") document.getElementById('cust-addr').value = "";
            updateCartUI();
        }

        function switchCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(cat.substring(0,3))));
            const container = document.getElementById('items-container');
            
            if(cat === 'tapioca') {
                container.innerHTML = `<div class="bg-zinc-900 p-8 rounded-3xl border-2 border-[#39FF14] text-center"><h4 class="font-black neon-text text-xl mb-2 italic">TAPIOCAS</h4><button onclick="openTapiocaModal()" class="w-full bg-[#39FF14] text-black font-black py-4 rounded-2xl text-xs mt-4 uppercase">Montar Minha Tapioca</button></div>`;
                return;
            }

            container.innerHTML = (menuData[cat] || []).map((item, index) => {
                const isPausado = estoqueAtual[item.name] === 'PAUSADO';
                const cardStyle = isPausado ? 'opacity: 0.6; filter: grayscale(0.8);' : '';
                const btnAcao = isPausado ? '' : `onclick='openItemModal("${cat}", ${index})'`;

                return `
                    <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center gap-3" style="${cardStyle}">
                        <div class="flex-1">
                            <h4 class="font-black text-white uppercase italic text-lg leading-tight">${item.name}</h4>
                            <p class="text-[10px] gold-text font-bold mt-2">${item.price ? 'R$ '+item.price.toFixed(2) : 'A partir de R$ '+item.p25.toFixed(2)}</p>
                            ${isPausado ? '<span class="text-[9px] text-red-500 font-black uppercase italic tracking-tighter">Indisponível hoje</span>' : ''}
                        </div>
                        <button ${btnAcao} class="bg-zinc-800 ${isPausado ? 'text-zinc-600 cursor-not-allowed' : 'text-white'} px-4 py-2 rounded-xl text-[10px] font-black uppercase">
                            ${isPausado ? 'ESGOTADO' : 'Escolher'}
                        </button>
                    </div>`;
            }).join('');
        }

        function openItemModal(cat, index) {
            currentItem = menuData[cat][index];
            if(cat === 'bebidas') { cart.push({ name: currentItem.name, price: currentItem.price }); updateCartUI(); return; }
            document.getElementById('modal-title').innerText = currentItem.name;
            const container = document.getElementById('modal-options');
            let list = (cat === 'promos') ? SABORES_PROMO : SABORES_PIZZA;
            let html = createPizzaSelect(1, (cat !== 'promos'), currentItem.name, list);
            if(currentItem.pizzas === 2) html += createPizzaSelect(2, false, list[1], list);
            if(currentItem.p35) {
                html += `<div class="flex gap-2 mt-4"><button onclick="selectSize(25)" id="btn-25" class="flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700">25CM</button><button onclick="selectSize(35)" id="btn-35" class="flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14]">35CM</button></div>`;
            }
            container.innerHTML = html;
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function createPizzaSelect(num, isFixed, def, list) {
            const valDef = list.includes(def) ? def : list[0];
            return `<div class="space-y-2"><label class="text-[10px] gold-text font-black uppercase italic">Sabor Pizza ${num}</label><div class="grid grid-cols-2 gap-2"><select class="flavor-a" ${isFixed?'disabled':''}>${list.map(f=>`<option value="${f}" ${f===valDef?'selected':''}>${f}</option>`).join('')}</select><select class="flavor-b"><option value="">(INTEIRA)</option>${list.map(f=>`<option value="${f}">½ ${f}</option>`).join('')}</select></div></div>`;
        }

        function selectSize(s) { selectedSize = s; document.getElementById('btn-25').className = s===25?'flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14]':'flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700'; document.getElementById('btn-35').className = s===35?'flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14]':'flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700'; }

        function addToCartFinal() {
            const flavAs = document.querySelectorAll('.flavor-a'); const flavBs = document.querySelectorAll('.flavor-b');
            let price = currentItem.price || (selectedSize === 25 ? currentItem.p25 : currentItem.p35);
            let desc = []; flavAs.forEach((f, i) => { let sA = f.value; let sB = flavBs[i].value; desc.push(sB && sB !== sA ? `½ ${sA} / ½ ${sB}` : sA + ' (Inteira)'); });
            cart.push({ name: `${currentItem.p35?selectedSize+'CM ':''}${currentItem.name} (${desc.join(" | ")})`, price });
            updateCartUI(); closeModal();
        }

        function openTapiocaModal() {
            tapRecheios = []; let html = "";
            menuData.tapioca_cats.forEach(group => {
                html += `<div class="ing-label">${group.cat}</div>`;
                group.items.forEach(r => { 
                    const isPausado = estoqueAtual[r.n] === 'PAUSADO';
                    const estilo = isPausado ? 'opacity: 0.4; border-color: #333; pointer-events: none;' : '';
                    html += `<button onclick="toggleTapRecheio('${r.n}', ${r.p}, this)" style="${estilo}" class="ing-btn flex flex-col">
                                <span class="text-white font-bold uppercase">${r.n}</span>
                                <span class="${isPausado ? 'text-red-500' : 'gold-text'}">${isPausado ? 'ESGOTADO' : 'R$ '+r.p.toFixed(2)}</span>
                             </button>`; 
                });
            });
            document.getElementById('tapioca-options').innerHTML = html;
            document.getElementById('tapioca-extras').innerHTML = menuData.tapioca_extras.map(e => `<button onclick="tapExtra='${e}';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')" class="ing-btn text-center text-zinc-400 font-bold uppercase extra-btn">${e}</button>`).join('');
            document.getElementById('tapioca-modal').classList.remove('hidden');
        }

        function toggleTapRecheio(n, p, b) { 
            if(estoqueAtual[n] === 'PAUSADO') return;
            const idx = tapRecheios.findIndex(x=>x.name===n); 
            if(idx>-1){tapRecheios.splice(idx,1);b.classList.remove('selected')}else if(tapRecheios.length<2){tapRecheios.push({name:n,price:p});b.classList.add('selected')} 
        }

        function addTapiocaFinal() { if(tapRecheios.length===0)return; const price=Math.max(...tapRecheios.map(r=>r.price)); cart.push({name:`TAPIOCA: ${tapRecheios.map(r=>r.name).join(' + ')} [Extra: ${tapExtra}]`, price}); updateCartUI(); closeModal(); }

        function updateCartUI() {
            const subtotal = cart.reduce((acc, i) => acc + i.price, 0);
            const taxa = modalidadeAtual === 'DELIVERY' ? taxaEntrega : 0;
            const total = subtotal + taxa;

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('taxa-valor').innerText = taxa.toFixed(2);
            document.getElementById('cart-total').innerText = total.toFixed(2);
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `<div class="flex justify-between bg-black p-3 rounded-xl border border-zinc-800 text-[10px] mb-2"><span class="uppercase">${i.name}</span><button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500 font-bold">✕</button></div>`).join('');
        }

        async function finalizeOrder() {
            if (!estaAberto()) { alert("LOJA FECHADA NO MOMENTO!"); return; }
            
            const n = document.getElementById('cust-name').value;
            const tel = document.getElementById('cust-phone').value;
            const a = document.getElementById('cust-addr').value;
            const obs = document.getElementById('cust-obs').value;
            const pagto = document.getElementById('pay-method').value;
            const troco = document.getElementById('troco-val').value;
            const total = document.getElementById('cart-total').innerText;
            const sub = document.getElementById('cart-subtotal').innerText;
            
            if(!n || !tel || (modalidadeAtual==='DELIVERY' && !a) || cart.length === 0) { alert("Preencha Nome, Telefone e Endereço!"); return; }
            
            let msg = `*🔥 NOVO PEDIDO KF SABORES*%0A%0A`;
            msg += `*👤 CLIENTE:* ${n.toUpperCase()}%0A`;
            msg += `*📞 TELEFONE:* ${tel}%0A`;
            msg += `*📍 ENDEREÇO:* ${a.toUpperCase()}%0A`;
            msg += `*🚚 MODALIDADE:* ${modalidadeAtual}%0A`;
            if(modalidadeAtual === 'DELIVERY') msg += `*📏 DISTÂNCIA:* ${distanciaTexto}%0A`;
            msg += `*💳 PAGTO:* ${pagto}${troco ? ' (Troco p/ ' + troco + ')' : ''}%0A`;
            if(obs) msg += `*📝 OBS:* ${obs}%0A`;
            msg += `%0A*🍕 ITENS:*%0A`;
            
            cart.forEach(i => msg += `• ${i.name.toUpperCase()} (R$ ${i.price.toFixed(2)})%0A`);
            
            msg += `%0A--------------------------%0A`;
            msg += `*Subtotal:* R$ ${sub}%0A`;
            if(modalidadeAtual === 'DELIVERY') msg += `*Taxa Entrega:* R$ ${taxaEntrega.toFixed(2)}%0A`;
            msg += `*💰 TOTAL: R$ ${total}*`;
            
            fetch(URL_PLANILHA, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({
                    nome: n, 
                    telefone: tel,
                    endereco: a, 
                    total: total, 
                    pagamento: pagto,
                    modalidade: modalidadeAtual,
                    itens: cart.map(i=>i.name).join(" | ")
                }) 
            });

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`);
            cart = []; taxaEntrega = 0; distanciaTexto = "";
            document.getElementById('distancia-info').innerText = "";
            updateCartUI(); toggleCart();
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function closeModal() { document.getElementById('item-modal').classList.add('hidden'); document.getElementById('tapioca-modal').classList.add('hidden'); }
        function checkPayment() { document.getElementById('troco-val').classList.toggle('hidden', document.getElementById('pay-method').value !== 'Dinheiro'); }

        verificarStatusLoja();
        carregarEstoqueUmaVez();
    </script>
</body>
</html>
