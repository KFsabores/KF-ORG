<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=places,geometry"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; }
        .neon-text { color: #39FF14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.8), 0 0 20px rgba(57, 255, 20, 0.5); }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        .gold-text { color: #FFD700; text-shadow: 0 0 3px rgba(255, 215, 0, 0.6); }
        .category-btn { border: 1px solid #333; transition: 0.3s; color: #999; text-transform: uppercase; font-size: 9px; font-weight: 900; white-space: normal; text-align: center; line-height: 1.15; }
        .category-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        select, input, textarea { background: #111 !important; border: 1px solid #333 !important; border-radius: 10px !important; padding: 12px !important; color: white !important; width: 100%; outline: none; margin-bottom: 8px; font-size: 14px; }
        textarea { resize: none; height: 70px; }
        .ing-label { grid-column: 1 / -1; background: #1a1a1a; padding: 6px 12px; border-left: 4px solid #39FF14; font-size: 10px; font-weight: 900; color: #FFD700; margin-top: 15px; text-transform: uppercase; }
        .ing-btn { border: 1px solid #333; padding: 10px; border-radius: 12px; font-size: 10px; text-align: left; background: #0a0a0a; transition: 0.2s; }
        .ing-btn.selected { border-color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        .hidden { display: none; }
        .modal-btn { border: 2px solid #333; padding: 12px; border-radius: 15px; font-size: 12px; font-weight: 900; color: #666; text-transform: uppercase; transition: 0.3s; }
        .modal-btn.active { border-color: #39FF14; color: #39FF14; background: rgba(57, 255, 20, 0.1); }
        #banner-status { background: rgba(255, 68, 68, 0.15); border: 1px solid #ff4444; color: #ff4444; }
        @keyframes cart-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: cart-pop 0.3s ease-out; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-black py-4 flex flex-col items-center border-b border-zinc-800">
        <div class="w-full max-w-lg px-4">
            <img src="https://i.postimg.cc/BbRBN8Hh/logo-novo-KF.jpg" alt="KF Sabores" class="w-full h-auto drop-shadow-[0_0_10px_rgba(57,255,20,0.3)]">
        </div>
    </header>

    <div id="banner-status" class="hidden p-4 mx-4 mt-4 rounded-2xl border text-center">
        <h2 class="font-black uppercase italic text-sm mb-2">🚫 LOJA FECHADA NO MOMENTO!</h2>
        <div id="horarios-lista" class="text-[10px] grid grid-cols-2 gap-x-4 gap-y-1 opacity-80 font-bold uppercase"></div>
    </div>

    <nav class="grid grid-cols-4 gap-2 bg-black p-3 sticky top-0 z-50 border-b border-zinc-800 max-w-lg mx-auto w-full">
        <button type="button" data-cat="promos" onclick="switchCategory('promos')" class="category-btn active px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">🔥<br>PROMOÇÕES</button>
        <button type="button" data-cat="tradicional" onclick="switchCategory('tradicional')" class="category-btn px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">🍕<br>PIZZAS TRADICIONAIS</button>
        <button type="button" data-cat="especial" onclick="switchCategory('especial')" class="category-btn px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">🌟<br>PIZZAS ESPECIAIS</button>
        <button type="button" data-cat="premium" onclick="switchCategory('premium')" class="category-btn px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">💎<br>PIZZAS PREMIUM</button>
        <button type="button" data-cat="doces" onclick="switchCategory('doces')" class="category-btn px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">🍫<br>PIZZAS DOCES</button>
        <button type="button" data-cat="tapioca" onclick="switchCategory('tapioca')" class="category-btn px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">TAPIOCAS</button>
        <button type="button" data-cat="bebidas" onclick="switchCategory('bebidas')" class="category-btn px-2 py-2.5 rounded-xl min-h-[3rem] flex items-center justify-center">🥤<br>BEBIDAS</button>
    </nav>

    <main id="items-container" class="p-4 space-y-4 max-w-lg mx-auto"></main>

    <div id="tapioca-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black neon-text italic uppercase">Montar Tapioca</h3>
            <p class="text-[10px] font-black text-zinc-400 uppercase mt-1 italic">Escolha 2 ingredientes e 1 acompanhamento</p>
            <h4 class="text-xs font-black gold-text uppercase mt-4 mb-2 border-b border-zinc-800 pb-1">Ingredientes!</h4>
            
            <div id="tapioca-options" class="grid grid-cols-2 gap-2"></div>
            
            <div class="mt-8 mb-2 border-t border-zinc-800 pt-4">
                <p class="text-sm font-black neon-text uppercase italic">Acompanhamentos</p>
            </div>
            <div id="tapioca-extras" class="grid grid-cols-2 gap-2"></div>

            <button onclick="addTapiocaFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase mt-8">ADICIONAR TAPIOCA</button>
            <button onclick="closeModal()" class="w-full py-4 text-zinc-500 text-[10px] uppercase font-bold text-center block">Voltar</button>
        </div>
    </div>

    <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[90]">
        <div id="cart-content" class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto relative">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-3xl font-light p-2">&times;</button>
            <h2 class="text-xl font-black neon-text mb-4 italic uppercase text-center mt-2">Meu Pedido</h2>
            <div id="cart-items" class="space-y-2 mb-4"></div>
            <div id="form-fechamento">
                <input type="text" id="cust-name" placeholder="Seu Nome">
                <input type="tel" id="cust-phone" placeholder="WhatsApp (Ex: 21997437285)">
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="mode-delivery" onclick="setModalidade('DELIVERY')" class="modal-btn active">🛵 Entrega</button>
                    <button id="mode-retirada" onclick="setModalidade('RETIRADA')" class="modal-btn">🛍️ Retirada</button>
                </div>
                <div id="area-endereco">
                    <input type="text" id="cust-addr" placeholder="Digite endereço e selecione..." onfocus="initAutocomplete()">
                    <p id="distancia-info" class="text-[10px] gold-text mb-2 italic font-bold text-center"></p>
                </div>
                <textarea id="cust-obs" placeholder="Ponto de referência ou observação"></textarea>
                <select id="pay-method" onchange="checkPayment()">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <input type="text" id="troco-val" class="hidden" placeholder="Troco para quanto?">
                <div class="space-y-1 text-sm border-t border-zinc-800 pt-4 mt-4">
                    <div class="flex justify-between text-zinc-400"><span>Subtotal:</span><span>R$ <span id="cart-subtotal">0.00</span></span></div>
                    <div class="flex justify-between text-zinc-400" id="row-taxa"><span>Taxa de Entrega:</span><span>R$ <span id="taxa-valor">0.00</span></span></div>
                    <div class="flex justify-between text-2xl font-black neon-text pt-2"><span>Total:</span><span>R$ <span id="cart-total">0.00</span></span></div>
                </div>
                <button onclick="finalizeOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase mt-4">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-700 max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-2xl font-black neon-text mb-4 italic uppercase text-center"></h3>
            <div id="modal-options" class="space-y-6"></div>
            <button onclick="addToCartFinal()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase mt-6">ADICIONAR AO PEDIDO</button>
            <button onclick="closeModal()" class="w-full py-3 text-zinc-500 text-[10px] mt-2 uppercase font-bold text-center block">Cancelar</button>
        </div>
    </div>

    <button onclick="toggleCart()" class="fixed bottom-6 right-6 bg-[#39FF14] text-black px-6 py-4 rounded-full shadow-[0_0_20px_#39FF14] z-50 flex items-center gap-3">
        <span class="text-xl">🛒</span><span id="cart-count" class="font-black text-lg">0</span>
    </button>

    <script>
        const WHATSAPP_NUMBER = "5521997437285";
        const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbx6XgE6wBcZPPjmtpAoyy6MseNXuS0eQ6VoA4TXfUwLoT0eG_AsJvAU3o6mlRxWISRcfQ/exec";
        
        let estoquePausado = []; 
        let zonasEntrega = [];
        let modoAdmin = false;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') { modoAdmin = true; }
        
        const HORARIOS = {
            4: { abrir: 2000, fechar: 2400 },
            5: { abrir: 2000, fechar: 2500 },
            6: { abrir: 2000, fechar: 2500 },
            0: { abrir: 1900, fechar: 2500 }
        };

        const menuData = {
            promos: [
                { name: "2 Pizzas 25cm + Refri 1L", price: 55.00, pizzas: 2, refri: "1L" },
                { name: "1 Pizza 35cm + Refri 2L", price: 46.00, pizzas: 1, refri: "2L" },
                { name: "2 Pizzas 35cm + Refri 2L", price: 85.00, pizzas: 2, refri: "2L" }
            ],
            tradicional: [
                { name: "Mussarela", p25: 24, p35: 39 }, { name: "Presunto", p25: 24, p35: 39 },
                { name: "Calabresa", p25: 24, p35: 39 }, { name: "3 Queijos", p25: 24, p35: 39 },
                { name: "Marguerita", p25: 24, p35: 39 }, { name: "Alho", p25: 24, p35: 39 }
            ],
            especial: [
                { name: "Frango c/ Catupiry", p25: 29, p35: 43 }, { name: "Frango c/ Cheddar", p25: 29, p35: 43 },
                { name: "Portuguesa", p25: 29, p35: 43 }, { name: "Peito de Peru", p25: 29, p35: 43 },
                { name: "Lombo Canadense", p25: 29, p35: 43 }
            ],
            premium: [
                { name: "Camarão c/ Catupiry", p25: 32, p35: 58 }, { name: "Camarão c/ Cheddar", p25: 32, p35: 58 },
                { name: "Camarão c/ Alho", p25: 32, p35: 58 }, { name: "Bacon com Ovos", p25: 32, p35: 58 }
            ],
            doces: [
                { name: "Banana c/ Canela", p25: 30, p35: 45 }, { name: "Prestígio", p25: 30, p35: 45 },
                { name: "M&M", p25: 30, p35: 45 }, { name: "Paçoca", p25: 30, p35: 45 },
                { name: "Romeu e Julieta", p25: 30, p35: 45 }, { name: "Caribe", p25: 30, p35: 45 },
                { name: "Sensação", p25: 30, p35: 45 }, { name: "Banana Nevada", p25: 30, p35: 45 }
            ],
            tapioca_cats: [
                { cat: "Proteínas", items: [{ n: "Lombo Canadense", p: 10 }, { n: "Peito de Peru", p: 13 }, { n: "Calabresa", p: 10 }, { n: "Presunto", p: 10 }, { n: "Frango", p: 13 }] },
                { cat: "Queijos", items: [{ n: "Minas", p: 10 }, { n: "Mussarela", p: 10 }, { n: "Requeijão", p: 10 }, { n: "Catupiry", p: 10 }, { n: "Cheddar", p: 10 }] },
                { cat: "Frutas", items: [{ n: "Coco", p: 10 }, { n: "Morango", p: 14 }, { n: "Abacaxi", p: 10 }, { n: "Banana", p: 10 }] },
                { cat: "Doces", items: [{ n: "Nutella", p: 16 }, { n: "Chocolate Branco", p: 14 }, { n: "Chocolate Preto", p: 14 }, { n: "M&M", p: 10 }, { n: "Doce de Leite", p: 10 }, { n: "Goiabada", p: 10 }, { n: "Paçoca", p: 10 }] }
            ],
            tapioca_extras: ["Leite Condensado", "Açúcar c/ Canela", "Granulado", "Orégano", "Cebola", "Tomate", "Azeitona", "Manteiga", "Alho Torrado", "Molho de Alho", "Molho de Pizza", "Nenhum"],
            bebidas: [
                { name: "Água", price: 2.50 }, { name: "Água c/ Gás", price: 3.50 }, { name: "Guaracamp", price: 2.50 }, { name: "Coca Lata", price: 6.00 },
                { name: "Coca Lata Zero", price: 6.00 }, { name: "Guaraná 1L", price: 10.00 }, { name: "Pepsi 1.5L", price: 12.00 }, { name: "Guaraná 1.5L", price: 12.00 },
                { name: "Guaraná ZERO 1.5L", price: 12.00 }, { name: "Sukita Uva 2L", price: 12.00 }, { name: "Sukita Laranja 2L", price: 12.00 }, { name: "Sukita Limão 2L", price: 12.00 }
            ]
        };

        const SABORES_PIZZA = [...menuData.tradicional, ...menuData.especial, ...menuData.premium, ...menuData.doces].map(s => s.name);
        const SABORES_PROMO = ["Calabresa", "Mussarela", "Presunto", "3 Queijos"];
        
        let cart = []; let currentItem = null; let selectedSize = 35; let tapRecheios = []; let tapExtra = "Nenhum"; 
        let modalidadeAtual = "DELIVERY"; let taxaEntrega = 0;
        let localizacaoPedido = null;
        let lastCartSize = 0;
        const CACHE_ESTOQUE_KEY = "kf_cache_estoque_pausado";
        const CACHE_MAPA_KEY = "kf_cache_mapa_zonas";

        function carregarCacheInicial() {
            try {
                const cacheEstoque = JSON.parse(localStorage.getItem(CACHE_ESTOQUE_KEY) || "[]");
                if (Array.isArray(cacheEstoque)) estoquePausado = cacheEstoque;
            } catch (e) {}
            try {
                const cacheMapa = JSON.parse(localStorage.getItem(CACHE_MAPA_KEY) || "[]");
                if (Array.isArray(cacheMapa)) zonasEntrega = cacheMapa;
            } catch (e) {}
        }

        function salvarCaches() {
            try { localStorage.setItem(CACHE_ESTOQUE_KEY, JSON.stringify(estoquePausado)); } catch (e) {}
            try { localStorage.setItem(CACHE_MAPA_KEY, JSON.stringify(zonasEntrega)); } catch (e) {}
        }

        async function init() {
            verificarStatusLoja();
            carregarCacheInicial();
            // Renderiza imediato com cache/local para eliminar atraso visual inicial.
            switchCategory('promos');
            try {
                const [estoque, mapa] = await Promise.all([
                    fetch(`${URL_PLANILHA}?action=getEstoque`).then(res => res.json()),
                    fetch(`${URL_PLANILHA}?action=getMapa`).then(res => res.json())
                ]);
                estoquePausado = estoque.filter(item => item.status === "PAUSADO").map(item => item.nome);
                zonasEntrega = mapa;
                salvarCaches();
                // Re-renderiza com dados atualizados de rede.
                switchCategory('promos');
            } catch (e) {}
        }

        // --- GOOGLE AUTOCOMPLETE & GEOCODING ---
        function initAutocomplete() {
            const input = document.getElementById('cust-addr');
            const autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.addListener('place_changed', async () => {
                const place = autocomplete.getPlace();
                if (place.geometry) await verificarLocalizacao(place.geometry.location);
            });
            // Tenta geocodificar se o usuário apenas digitar e sair do campo ou der enter
            input.addEventListener('blur', () => { setTimeout(() => { geocodificarEndereco(input.value); }, 400); });
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); geocodificarEndereco(input.value); } });
        }

        async function geocodificarEndereco(endereco) {
            if (!endereco || endereco.length < 5 || endereco === "RETIRADA NA LOJA") return;
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: endereco }, (results, status) => {
                if (status === "OK" && results[0].geometry) { verificarLocalizacao(results[0].geometry.location); }
            });
        }

        async function verificarLocalizacao(loc) {
            const infoDistancia = document.getElementById('distancia-info');
            infoDistancia.innerText = "⌛ CALCULANDO TAXA...";
            infoDistancia.style.color = "#FFD700";
            try {
                if (loc && typeof loc.lat === 'function' && typeof loc.lng === 'function') {
                    localizacaoPedido = { lat: loc.lat(), lng: loc.lng(), fonte: "maps_autocomplete" };
                } else if (loc && typeof loc.lat === 'number' && typeof loc.lng === 'number') {
                    localizacaoPedido = { lat: loc.lat, lng: loc.lng, fonte: "maps_geocode" };
                }
                let dadosTratados = zonasEntrega;
                if (typeof zonasEntrega === 'string') { dadosTratados = JSON.parse(zonasEntrega); }
                let zonaAchada = null;
                for (const zona of dadosTratados) {
                    if (zona.pontos) {
                        const caminhos = zona.pontos.map(p => ({ lat: parseFloat(String(p.lat).replace(',','.')), lng: parseFloat(String(p.lng).replace(',','.')) }));
                        const poly = new google.maps.Polygon({ paths: caminhos });
                        if (google.maps.geometry.poly.containsLocation(loc, poly)) { zonaAchada = zona; break; }
                    }
                }
                if (zonaAchada) {
                    taxaEntrega = parseFloat(String(zonaAchada.preco).replace(',','.'));
                    infoDistancia.innerText = `🛵 ENTREGA: ${zonaAchada.nome.toUpperCase()} | R$ ${taxaEntrega.toFixed(2)}`;
                    infoDistancia.style.color = "#39FF14";
                } else {
                    taxaEntrega = 0;
                    infoDistancia.innerText = `⚠️ FORA DA ÁREA PADRÃO (A COMBINAR)`;
                    infoDistancia.style.color = "#ff4444";
                }
            } catch(e) { infoDistancia.innerText = "⚠️ VALOR A CONFIRMAR"; }
            updateCartUI();
        }

        function capturarLocalizacaoAtual() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        fonte: "gps_usuario"
                    }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 9000, maximumAge: 120000 }
                );
            });
        }

        function updateCartUI() {
            const subtotal = cart.reduce((acc, i) => acc + i.price, 0);
            const taxa = modalidadeAtual === 'DELIVERY' ? taxaEntrega : 0;
            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('taxa-valor').innerText = taxa.toFixed(2);
            document.getElementById('cart-total').innerText = (subtotal + taxa).toFixed(2);
            
            const cartCountEl = document.getElementById('cart-count');
            cartCountEl.innerText = cart.length;
            
            // Animação se o carrinho aumentou
            if (cart.length > lastCartSize) {
                const cartBtn = cartCountEl.parentElement;
                cartBtn.classList.remove('animate-pop');
                void cartBtn.offsetWidth; // Trigger reflow
                cartBtn.classList.add('animate-pop');
            }
            lastCartSize = cart.length;

            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `
                <div class="flex justify-between items-center bg-black p-3 rounded-xl border border-zinc-800 text-[10px] mb-2 gap-2">
                    <div class="flex flex-col flex-1">
                        <span class="uppercase font-bold text-white">${i.name}</span>
                        <span class="gold-text font-black mt-1">R$ ${i.price.toFixed(2)}</span>
                    </div>
                    <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500 hover:text-red-400 transition-colors p-2 text-lg">
                        🗑️
                    </button>
                </div>`).join('');
        }

        function estaAberto() {
            if (modoAdmin) return true;
            const agora = new Date();
            let dia = agora.getDay();
            let horaAtual = (agora.getHours() * 100) + agora.getMinutes();
            if (horaAtual < 500) { horaAtual += 2400; dia = dia === 0 ? 6 : dia - 1; }
            const config = HORARIOS[dia];
            return config ? (horaAtual >= config.abrir && horaAtual <= config.fechar) : false;
        }

        function verificarStatusLoja() {
    const banner = document.getElementById('banner-status');
    
    if (!estaAberto()) {
        banner.classList.remove('hidden');
        
        // Texto fixo informativo, sem loops ou cálculos complexos
        const html = `
            <span>QUINTA</span> <span class="text-white">20:00 às 00:00</span>
            <span>SEXTA</span> <span class="text-white">20:00 às 01:00</span>
            <span>SÁBADO</span> <span class="text-white">20:00 às 01:00</span>
            <span>DOMINGO</span> <span class="text-white">19:00 às 01:00</span>
        `;
        
        document.getElementById('horarios-lista').innerHTML = html;
    } else { 
        banner.classList.add('hidden'); 
    }
}

        function setModalidade(tipo) {
            modalidadeAtual = tipo;
            document.getElementById('mode-delivery').classList.toggle('active', tipo === 'DELIVERY');
            document.getElementById('mode-retirada').classList.toggle('active', tipo === 'RETIRADA');
            document.getElementById('area-endereco').classList.toggle('hidden', tipo === 'RETIRADA');
            document.getElementById('row-taxa').classList.toggle('hidden', tipo === 'RETIRADA');
            if(tipo === 'RETIRADA') { taxaEntrega = 0; document.getElementById('cust-addr').value = "RETIRADA NA LOJA"; }
            updateCartUI();
        }

        function switchCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-cat') === cat));
            const container = document.getElementById('items-container');
            if(cat === 'tapioca') {
                container.innerHTML = `<div class="bg-zinc-900 p-8 rounded-3xl border-2 border-[#39FF14] text-center"><h4 class="font-black neon-text text-xl mb-2 italic">TAPIOCAS</h4><button onclick="openTapiocaModal()" class="w-full bg-[#39FF14] text-black font-black py-4 rounded-2xl text-xs mt-4 uppercase">Montar Minha Tapioca</button></div>`;
                return;
            }
            container.innerHTML = (menuData[cat] || []).map((item, index) => {
                const isPausado = estoquePausado.includes(item.name.trim());
                let precoTexto = item.price ? 'R$ '+item.price.toFixed(2) : 'A partir de R$ '+item.p25.toFixed(2);
                return `<div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center gap-3" style="${isPausado ? 'opacity: 0.5; pointer-events: none;' : ''}">
                    <div class="flex-1"><h4 class="font-black text-white uppercase italic text-lg leading-tight">${item.name}</h4><p class="text-[10px] gold-text font-bold mt-2">${isPausado ? '🚫 INDISPONÍVEL' : precoTexto}</p></div>
                    <button ${isPausado ? 'disabled' : `onclick='openItemModal("${cat}", ${index})'`} class="bg-zinc-800 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">${isPausado ? 'ESGOTADO' : 'Escolher'}</button>
                </div>`;
            }).join('');
        }

        // --- TAPIOCA MODAL ---
        function openTapiocaModal() {
            tapRecheios = []; 
            let optionsHtml = "";
            menuData.tapioca_cats.forEach(group => {
                optionsHtml += `<div class="ing-label">${group.cat}</div>`;
                group.items.forEach(r => { 
                    const isPausado = estoquePausado.includes(r.n.trim());
                    optionsHtml += `<button onclick="toggleTapRecheio('${r.n}', ${r.p}, this)" style="${isPausado ? 'opacity:0.4; pointer-events:none' : ''}" class="ing-btn flex flex-col"><span class="text-white font-bold uppercase">${r.n}</span><span class="gold-text">R$ ${r.p.toFixed(2)}</span></button>`; 
                });
            });
            document.getElementById('tapioca-options').innerHTML = optionsHtml;
            document.getElementById('tapioca-extras').innerHTML = menuData.tapioca_extras.map(e => `<button onclick="tapExtra='${e}';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')" class="ing-btn text-center text-zinc-400 font-bold uppercase extra-btn ${e==='Nenhum'?'selected':''}">${e}</button>`).join('');
            document.getElementById('tapioca-modal').classList.remove('hidden');
        }

        function toggleTapRecheio(n, p, b) { 
            const idx = tapRecheios.findIndex(x=>x.name===n); 
            if(idx>-1){tapRecheios.splice(idx,1);b.classList.remove('selected')}
            else if(tapRecheios.length<2){tapRecheios.push({name:n,price:p});b.classList.add('selected')} 
        }

        function addTapiocaFinal() { 
            if(tapRecheios.length===0)return; 
            const price = Math.max(...tapRecheios.map(r=>r.price)); 
            cart.push({name:`TAPIOCA: ${tapRecheios.map(r=>r.name).join(' + ')} [ACOMP: ${tapExtra.toUpperCase()}]`, price}); 
            updateCartUI(); closeModal(); 
        }

        // --- PIZZA MODAL ---
        function openItemModal(cat, index) {
            currentItem = menuData[cat][index];
            if(cat === 'bebidas') { cart.push({ name: currentItem.name, price: currentItem.price }); updateCartUI(); return; }
            document.getElementById('modal-title').innerText = currentItem.name;
            const container = document.getElementById('modal-options');
            let list = (cat === 'promos') ? SABORES_PROMO : SABORES_PIZZA;
            let html = createPizzaSelect(1, (cat !== 'promos'), currentItem.name, list);
            if(currentItem.pizzas === 2) html += createPizzaSelect(2, false, list[1], list);
            if(cat === 'promos' && currentItem.refri) {
                let bebidasF = menuData.bebidas.filter(b => b.name.includes(currentItem.refri) || b.name.includes("1.5L") || b.name.includes("2L"));
                html += `<div class="mt-4"><label class="text-[10px] gold-text font-black uppercase italic">Escolha o Refrigerante</label><select id="promo-refri-select">${bebidasF.map(b => `<option value="${b.name}">${b.name}</option>`).join('')}</select></div>`;
            }
            if(currentItem.p35) {
                html += `<div class="flex gap-2 mt-4">
                    <button onclick="selectSize(25)" id="btn-25" class="flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700 flex flex-col items-center">
                        <span>25CM</span>
                        <span class="text-[10px] opacity-70 mt-1">R$ ${currentItem.p25.toFixed(2)}</span>
                    </button>
                    <button onclick="selectSize(35)" id="btn-35" class="flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14] flex flex-col items-center">
                        <span>35CM</span>
                        <span class="text-[10px] opacity-70 mt-1">R$ ${currentItem.p35.toFixed(2)}</span>
                    </button>
                </div>`;
            }
            container.innerHTML = html;
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function createPizzaSelect(num, isFixed, def, list) {
            const valDef = list.includes(def) ? def : list[0];
            return `<div class="space-y-2"><label class="text-[10px] gold-text font-black uppercase italic">Sabor Pizza ${num}</label><div class="grid grid-cols-2 gap-2"><select class="flavor-a" ${isFixed?'disabled':''}>${list.map(f=>`<option value="${f}" ${f===valDef?'selected':''}>${f}</option>`).join('')}</select><select class="flavor-b"><option value="">(INTEIRA)</option>${list.map(f=>`<option value="${f}">½ ${f}</option>`).join('')}</select></div></div>`;
        }

        function selectSize(s) { 
            selectedSize = s; 
            document.getElementById('btn-25').className = s===25?'flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14] flex flex-col items-center':'flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700 flex flex-col items-center'; 
            document.getElementById('btn-35').className = s===35?'flex-1 p-3 border-2 rounded-xl text-xs font-bold neon-border text-[#39FF14] flex flex-col items-center':'flex-1 p-3 border-2 rounded-xl text-xs font-bold border-zinc-700 flex flex-col items-center'; 
        }

        function addToCartFinal() {
    const flavAs = document.querySelectorAll('.flavor-a'); 
    const flavBs = document.querySelectorAll('.flavor-b');
    const refriSelect = document.getElementById('promo-refri-select');
    
    // Pegamos o preço base do item clicado (importante para Promos)
    let precoFinalItem = currentItem.price || 0;
    let desc = []; 

    // Função auxiliar para buscar o preço de um sabor específico no menuData
    const buscarPrecoSabor = (nomeSabor, tamanho) => {
        const categorias = ['tradicional', 'especial', 'premium', 'doces'];
        for (let cat of categorias) {
            let achado = menuData[cat].find(s => s.name === nomeSabor);
            if (achado) {
                return tamanho === 25 ? achado.p25 : achado.p35;
            }
        }
        return 0;
    };

    flavAs.forEach((f, i) => { 
        let sA = f.value; 
        let sB = flavBs[i].value; // Se for inteira, sB vem vazio "" ou "(INTEIRA)"
        
        if (sB && sB !== "" && sB.includes('½')) {
            // É MEIO A MEIO
            let nomeSaborB = sB.replace('½ ', '').trim();
            
            let pA = buscarPrecoSabor(sA, selectedSize);
            let pB = buscarPrecoSabor(nomeSaborB, selectedSize);
            
            // Pega o maior entre os dois sabores
            let maiorValorMetade = Math.max(pA, pB);
            
            // Se o maior valor da pizza escolhida for maior que o preço atual (ou se for zero/promo)
            if (maiorValorMetade > precoFinalItem) {
                precoFinalItem = maiorValorMetade;
            }
            
            desc.push(`½ ${sA} / ${sB}`);
        } else {
            // É INTEIRA
            let precoInteira = buscarPrecoSabor(sA, selectedSize);
            if (precoInteira > precoFinalItem) {
                precoFinalItem = precoInteira;
            }
            desc.push(sA + ' (Inteira)');
        }
    });

    // Se for uma PROMOÇÃO com preço fixo e o preço calculado for 0 (porque sabores de promo não têm p25/p35 individuais no seu objeto)
    // mantemos o preço da promoção original.
    if (currentItem.price && precoFinalItem === 0) {
        precoFinalItem = currentItem.price;
    }

    let finalName = `${currentItem.p35 ? selectedSize+'CM ' : ''}${currentItem.name} (${desc.join(" | ")})`;
    if(refriSelect) finalName += ` + BEBIDA: ${refriSelect.value}`;
    
    cart.push({ name: finalName.toUpperCase(), price: precoFinalItem });
    updateCartUI(); 
    closeModal();
}

        }

        // --- FINALIZAÇÃO ---
        async function finalizeOrder() {
            if (!estaAberto()) { alert("LOJA FECHADA!"); return; }
            const n = document.getElementById('cust-name').value;
            const tel = document.getElementById('cust-phone').value;
            const a = document.getElementById('cust-addr').value;
            const totalStr = document.getElementById('cart-total').innerText;
            const pagto = document.getElementById('pay-method').value;
            const obs = document.getElementById('cust-obs').value;
            const troco = document.getElementById('troco-val').value;
            
            if(!n || !tel || (modalidadeAtual==='DELIVERY' && !a) || cart.length === 0) { alert("Preencha todos os campos!"); return; }

            let geoFinal = localizacaoPedido;
            if (!geoFinal) {
                geoFinal = await capturarLocalizacaoAtual();
            }
            const geoLink = geoFinal ? `https://www.google.com/maps?q=${geoFinal.lat},${geoFinal.lng}` : "";
            
            let msg = `*🔥 NOVO PEDIDO KF SABORES*%0A%0A*👤 CLIENTE:* ${n.toUpperCase()}%0A*📍 END:* ${a.toUpperCase()}%0A*🚚 MOD:* ${modalidadeAtual}%0A*💳 PAGTO:* ${pagto}${pagto==='Dinheiro'?' (Troco p/ '+troco+')':''}%0A%0A*🍕 ITENS:*%0A`;
            cart.forEach(i => msg += `• ${i.name}%0A`);
            if(obs) msg += `%0A*📝 OBS:* ${obs.toUpperCase()}%0A`;
            if(geoLink) msg += `%0A*📌 LOCALIZAÇÃO:* ${encodeURIComponent(geoLink)}%0A`;
            msg += `%0A*💰 TOTAL: R$ ${totalStr}*`;
            
            fetch(URL_PLANILHA, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nome: n, telefone: tel, endereco: a, total: totalStr, pagamento: pagto, modalidade: modalidadeAtual, itens: cart.map(i=>i.name).join(" | ") + (obs ? " [OBS: "+obs+"]" : ""), taxa: taxaEntrega.toFixed(2), troco: troco, latitude: geoFinal ? geoFinal.lat : "", longitude: geoFinal ? geoFinal.lng : "", localizacao_link: geoLink, localizacao_fonte: geoFinal ? geoFinal.fonte : "nao_informada" }) });
            
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`);
            cart = []; updateCartUI(); toggleCart();
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function closeModal() { document.getElementById('item-modal').classList.add('hidden'); document.getElementById('tapioca-modal').classList.add('hidden'); }
        function checkPayment() { document.getElementById('troco-val').classList.toggle('hidden', document.getElementById('pay-method').value !== 'Dinheiro'); }

        init();
    </script>
</body>
