<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Importador de Pedidos - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjvO26MEbyQMiaTj43aUg7PwiKQmH0g34",
            authDomain: "kf-sabores-delivery.firebaseapp.com",
            projectId: "kf-sabores-delivery",
            storageBucket: "kf-sabores-delivery.firebasestorage.app",
            messagingSenderId: "926954054172",
            appId: "1:926954054172:web:fdde663c1f315ec9e9f5d9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-zinc-950 p-8 text-white font-sans">
    <div class="max-w-2xl mx-auto bg-zinc-900 p-8 rounded-3xl border border-zinc-800 shadow-2xl text-center">
        <h1 class="text-3xl font-black text-[#39FF14] italic uppercase mb-4">MIGRAÇÃO DE DADOS</h1>
        <p class="text-zinc-400 mb-8">Esta ferramenta vai puxar todos os pedidos antigos da sua Planilha do Google e salvar no novo banco de dados (Firebase).</p>
        
        <button id="btn-import" onclick="iniciarImportacao()" class="bg-[#39FF14] text-black px-8 py-4 rounded-xl font-black uppercase text-sm hover:scale-105 transition-all shadow-lg w-full">
            🚀 IMPORTAR PEDIDOS DA PLANILHA AGORA
        </button>

        <div id="status" class="mt-8 text-xl font-bold text-zinc-300"></div>
        <div id="progress" class="mt-2 text-sm text-zinc-500"></div>
    </div>

    <script>
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        function parseDataBR(stringData) {
            if (!stringData) return new Date();
            try {
                const partes = stringData.split(' ');
                const dataP = partes[0].split('/');
                const horaP = partes[1] ? partes[1].split(':') : ["00", "00"];
                return new Date(dataP[2], dataP[1] - 1, dataP[0], horaP[0], horaP[1]);
            } catch (e) { return new Date(); }
        }

        async function iniciarImportacao() {
            const btn = document.getElementById('btn-import');
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ Baixando dados da planilha...";

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
                const response = await fetch(url);
                const csvData = await response.text();
                
                const rows = csvData.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                    .map(row => 
                        row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                           .map(cell => cell.replace(/"/g, '').trim())
                    )
                    .filter(row => row.length >= 6 && row[0] !== "" && row[0] !== "DATA");

                status.innerText = `📦 ${rows.length} pedidos encontrados. Iniciando cópia para o Firebase...`;

                const batch = db.batch();
                let counter = 0;

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    
                    const payload = {
                        dataFull: row[0] || "",
                        objData: parseDataBR(row[0]).getTime(),
                        nome: row[1] || "Sem Nome",
                        endereco: row[2] || "Sem Endereço",
                        itens: row[3] || "",
                        pagamento: row[4] || "N/A", // corrigido para pagamento para casar com index.html
                        total: row[5] || "R$ 0,00",
                        totalNum: parseFloat((row[5] || "0").replace("R$", "").replace(/\s/g, "").replace(",", ".")) || 0,
                        status: (row[6] || 'PENDENTE').toUpperCase(),
                        modalidade: (row[7] || "DELIVERY").toUpperCase(),
                        telefone: row[8] || "",
                        taxa: row[9] || "0,00",
                        troco: row[10] || "NÃO",
                        latitude: row[11] || "",
                        longitude: row[12] || "",
                        localizacaoLink: row[13] || "",
                        localizacaoFonte: row[14] || ""
                    };

                    const newRef = db.collection("pedidos").doc();
                    batch.set(newRef, payload);
                    counter++;

                    // Firebase batch limite é 500, então comitamos a cada 400
                    if (counter >= 400) {
                        await batch.commit();
                        progress.innerText = `Salvando lote... (${i+1} de ${rows.length})`;
                        counter = 0;
                    }
                }

                if (counter > 0) {
                    await batch.commit();
                }

                status.innerText = "✅ SUCESSO! Todos os pedidos foram importados.";
                progress.innerText = "Você já pode fechar esta página e abrir o seu Painel.";
                
            } catch (e) {
                console.error(e);
                status.innerText = "❌ ERRO: " + e.message;
            }
        }
    </script>
</body>
</html>
