<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Importador de Pedidos - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjvO26MEbyQMiaTj43aUg7PwiKQmH0g34",
            authDomain: "kf-sabores-delivery.firebaseapp.com",
            projectId: "kf-sabores-delivery",
            storageBucket: "kf-sabores-delivery.firebasestorage.app",
            messagingSenderId: "926954054172",
            appId: "1:926954054172:web:fdde663c1f315ec9e9f5d9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-zinc-950 p-8 text-white font-sans">
    <div class="max-w-2xl mx-auto bg-zinc-900 p-8 rounded-3xl border border-zinc-800 shadow-2xl text-center">
        <h1 class="text-3xl font-black text-[#39FF14] italic uppercase mb-4">MIGRAÇÃO DE DADOS</h1>
        <p class="text-zinc-400 mb-8">Esta ferramenta vai puxar todos os pedidos antigos da sua Planilha do Google e salvar no novo banco de dados (Firebase).</p>
        
        <button id="btn-import" onclick="iniciarImportacao()" class="bg-[#39FF14] text-black px-8 py-4 rounded-xl font-black uppercase text-sm hover:scale-105 transition-all shadow-lg w-full mb-4">
            🚀 1. IMPORTAR PEDIDOS DA PLANILHA
        </button>

        <button id="btn-estoque" onclick="popularEstoque()" class="bg-orange-500 text-black px-8 py-4 rounded-xl font-black uppercase text-sm hover:scale-105 transition-all shadow-lg w-full mb-4">
            📦 2. CRIAR ESTOQUE INICIAL NO BANCO
        </button>

        <button id="btn-mapa" onclick="popularMapa()" class="bg-blue-500 text-white px-8 py-4 rounded-xl font-black uppercase text-sm hover:scale-105 transition-all shadow-lg w-full">
            🗺️ 3. IMPORTAR MAPA DA PLANILHA
        </button>

        <div id="status" class="mt-8 text-xl font-bold text-zinc-300"></div>
        <div id="progress" class="mt-2 text-sm text-zinc-500"></div>
    </div>

    <script>
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        function parseDataBR(stringData) {
            if (!stringData) return new Date();
            try {
                const partes = stringData.split(' ');
                const dataP = partes[0].split('/');
                const horaP = partes[1] ? partes[1].split(':') : ["00", "00"];
                return new Date(dataP[2], dataP[1] - 1, dataP[0], horaP[0], horaP[1]);
            } catch (e) { return new Date(); }
        }

        async function iniciarImportacao() {
            const btn = document.getElementById('btn-import');
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ Baixando dados da planilha...";

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
                const response = await fetch(url);
                const csvData = await response.text();
                
                const rows = csvData.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                    .map(row => 
                        row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                           .map(cell => cell.replace(/"/g, '').trim())
                    )
                    .filter(row => row.length >= 6 && row[0] !== "" && row[0] !== "DATA");

                status.innerText = `📦 ${rows.length} pedidos encontrados. Iniciando cópia para o Firebase...`;

                const batch = db.batch();
                let counter = 0;

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    
                    const payload = {
                        dataFull: row[0] || "",
                        objData: parseDataBR(row[0]).getTime(),
                        nome: row[1] || "Sem Nome",
                        endereco: row[2] || "Sem Endereço",
                        itens: row[3] || "",
                        pagamento: row[4] || "N/A", // corrigido para pagamento para casar com index.html
                        total: row[5] || "R$ 0,00",
                        totalNum: parseFloat((row[5] || "0").replace("R$", "").replace(/\s/g, "").replace(",", ".")) || 0,
                        status: (row[6] || 'PENDENTE').toUpperCase(),
                        modalidade: (row[7] || "DELIVERY").toUpperCase(),
                        telefone: row[8] || "",
                        taxa: row[9] || "0,00",
                        troco: row[10] || "NÃO",
                        latitude: row[11] || "",
                        longitude: row[12] || "",
                        localizacaoLink: row[13] || "",
                        localizacaoFonte: row[14] || ""
                    };

                    const newRef = db.collection("pedidos").doc();
                    batch.set(newRef, payload);
                    counter++;

                    // Firebase batch limite é 500, então comitamos a cada 400
                    if (counter >= 400) {
                        await batch.commit();
                        progress.innerText = `Salvando lote... (${i+1} de ${rows.length})`;
                        counter = 0;
                    }
                }

                if (counter > 0) {
                    await batch.commit();
                }

                status.innerText = "✅ SUCESSO! Todos os pedidos foram importados.";
                progress.innerText = "Você já pode fechar esta página e abrir o seu Painel.";
                
            } catch (e) {
                console.error(e);
                status.innerText = "❌ ERRO: " + e.message;
            }
        }

        async function popularEstoque() {
            const btn = document.getElementById('btn-estoque');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ Criando itens do estoque no Firebase...";

            const itensPizza = [
                "Calabresa", "Mussarela", "Presunto", "Margarida", "Napolitana", "Bacon", "Milho", "Alho", "3 Queijos", "Mista",
                "Peperone", "Frango c/ Catupiry", "Calabresa c/ Catupiry", "Bacon c/ Milho", "Margherita", "Lombo Canadense", "4 Queijos", "Portuguesa",
                "Baiana", "Frango c/ Bacon", "Palmito", "Camarão", "Carne Seca", "Coração",
                "Chocolate", "Chocolate c/ Morango", "Chocolate Branco", "Chocolate Branco c/ Morango", "Banana c/ Canela", "Banana c/ Chocolate", "Romeu e Julieta", "Confete"
            ];
            
            const itensTapioca = [
                "Frango c/ Catupiry", "Carne Seca", "Camarão", "Pizza", "Queijo",
                "Banana com Canela", "Brigadeiro", "Romeu e Julieta", "Doce de Leite"
            ];

            const itensBebida = [
                "Água", "Água c/ Gás", "Guaracamp", "Coca Lata", "Coca Lata Zero", "Guaraná 1L", "Guaraná 1.5L", "Pepsi 1.5L",
                "Guaraná ZERO 1.5L", "Sukita Uva 2L", "Sukita Laranja 2L", "Sukita Limão 2L"
            ];

            try {
                const batch = db.batch();
                
                itensPizza.forEach(nome => {
                    const ref = db.collection("estoque").doc(nome);
                    batch.set(ref, { categoria: "PIZZA", status: "DISPONÍVEL" });
                });
                
                itensTapioca.forEach(nome => {
                    const ref = db.collection("estoque").doc(nome);
                    batch.set(ref, { categoria: "TAPIOCA", status: "DISPONÍVEL" });
                });
                
                itensBebida.forEach(nome => {
                    const ref = db.collection("estoque").doc(nome);
                    batch.set(ref, { categoria: "BEBIDA", status: "DISPONÍVEL" });
                });

                await batch.commit();

                status.innerText = "✅ ESTOQUE CRIADO COM SUCESSO!";
                btn.innerText = "📦 ESTOQUE CRIADO!";
            } catch (e) {
                console.error(e);
                status.innerText = "❌ ERRO AO CRIAR ESTOQUE: " + e.message;
            }
        }

        async function popularMapa() {
            const btn = document.getElementById('btn-mapa');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ Baixando mapa antigo da planilha...";

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=CONFIG_TAXAS&t=${new Date().getTime()}`;
                const response = await fetch(url);
                const csvData = await response.text();
                
                const rows = csvData.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                    .map(row => 
                        row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                           .map(cell => cell.replace(/^"|"$/g, '').trim()) // remove aspas externas da celula csv
                    )
                    .filter(row => row.length >= 3 && row[0] !== "" && row[0] !== "PREÇO");

                if(rows.length === 0) {
                    status.innerText = "⚠️ Nenhum polígono encontrado na planilha.";
                    return;
                }

                const batch = db.batch();
                
                rows.forEach(row => {
                    let pontosFormatados = [];
                    try {
                        let jsonString = row[2].replace(/""/g, '"'); // reverte escape de aspas do csv
                        pontosFormatados = JSON.parse(jsonString);
                    } catch(e) {
                        console.warn("Erro ao fazer parse dos pontos da área:", row[0]);
                    }

                    const payload = {
                        preco: row[0],
                        cor: row[1],
                        pontos: pontosFormatados
                    };

                    const newRef = db.collection("config_taxas").doc();
                    batch.set(newRef, payload);
                });

                await batch.commit();

                status.innerText = `✅ SUCESSO! ${rows.length} áreas importadas para o mapa.`;
                btn.innerText = "🗺️ MAPA IMPORTADO!";
            } catch (e) {
                console.error(e);
                status.innerText = "❌ ERRO AO IMPORTAR MAPA: " + e.message;
            }
        }
    </script>
</body>
</html>
