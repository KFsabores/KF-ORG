<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor de Áreas - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 600px; width: 100%; border-radius: 20px; }
        .gm-style-iw { color: black !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjvO26MEbyQMiaTj43aUg7PwiKQmH0g34",
            authDomain: "kf-sabores-delivery.firebaseapp.com",
            projectId: "kf-sabores-delivery",
            storageBucket: "kf-sabores-delivery.firebasestorage.app",
            messagingSenderId: "926954054172",
            appId: "1:926954054172:web:fdde663c1f315ec9e9f5d9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- GOOGLE MAPS - síncrono para garantir que esteja pronto ao usar -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=drawing,geometry,places"></script>
</head>
<body class="bg-zinc-950 p-4 md:p-8 text-white">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black uppercase italic text-[#39FF14]">Editor de Geofencing</h1>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest font-bold">Paciência, RJ - Gestão de Taxas</p>
            </div>
            <div class="flex flex-1 max-w-md w-full relative">
                <input type="text" id="input-endereco" placeholder="Buscar endereço (Ex: Rua A, 123)..." 
                    class="bg-zinc-900 border border-zinc-700 rounded-l-xl w-full py-2 px-4 text-xs text-white outline-none focus:border-[#39FF14]">
                <button onclick="buscarEAdicionarEndereco()" class="bg-[#39FF14] text-black px-4 py-2 rounded-r-xl font-bold text-xs uppercase hover:bg-green-500 transition-colors">
                    Incluir
                </button>
            </div>
            <div id="status-save" class="hidden text-[10px] bg-green-500/20 text-green-500 px-3 py-1 rounded-full border border-green-500/50 animate-pulse">
                Salvo no Firebase ✅
            </div>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 relative">
                <div id="map" class="border border-zinc-800 shadow-2xl"></div>
            </div>

            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 flex flex-col h-[600px]">
                <h2 class="font-bold mb-4 uppercase text-xs text-zinc-400">📍 Áreas Configuradas</h2>
                
                <div id="lista-areas" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                    <div id="placeholder-msg" class="text-center py-6 text-zinc-600 text-sm italic">
                        <div id="msg-texto">⌛ Carregando áreas...</div>
                        <button id="btn-recarregar" onclick="carregarDadosSalvos()" class="hidden mt-4 bg-zinc-700 hover:bg-zinc-600 text-white text-[10px] font-black uppercase px-4 py-2 rounded-xl transition-colors">
                            🔄 Tentar Novamente
                        </button>
                    </div>
                </div>

                <div class="pt-4 mt-4 border-t border-zinc-800">
                    <button onclick="salvarConfiguracoes()" id="btn-salvar" class="w-full bg-[#39FF14] hover:bg-[#32e612] text-black font-black py-4 rounded-xl uppercase text-xs transition-all shadow-lg active:scale-95">
                        Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let drawingManager;
        let poligonos = [];
        let carregandoTimeout = null;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -22.9235, lng: -43.6364 },
                zoom: 15,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingControl: true,
                drawingControlOptions: { position: google.maps.ControlPosition.TOP_CENTER, drawingModes: ['polygon'] },
                polygonOptions: { editable: true, draggable: true, fillOpacity: 0.45, strokeWeight: 2 }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
                adicionarPoligonoArray(polygon, 0);
                atualizarListaSidebar();
            });

            carregarDadosSalvos();
        }

        async function buscarEAdicionarEndereco() {
            const endereco = document.getElementById('input-endereco').value;
            if(!endereco) return alert("Digite um endereço primeiro!");

            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: endereco }, (results, status) => {
                if (status === "OK" && results[0].geometry) {
                    const loc = results[0].geometry.location;
                    map.setCenter(loc);
                    map.setZoom(18);

                    const offset = 0.0005;
                    const path = [
                        { lat: loc.lat() + offset, lng: loc.lng() - offset },
                        { lat: loc.lat() + offset, lng: loc.lng() + offset },
                        { lat: loc.lat() - offset, lng: loc.lng() + offset },
                        { lat: loc.lat() - offset, lng: loc.lng() - offset }
                    ];

                    const polygon = new google.maps.Polygon({
                        path: path,
                        editable: true,
                        draggable: true,
                        fillOpacity: 0.8,
                        strokeWeight: 3,
                        map: map
                    });

                    adicionarPoligonoArray(polygon, 0);
                    atualizarListaSidebar();
                    document.getElementById('input-endereco').value = "";
                } else {
                    alert("Não foi possível encontrar esse endereço no mapa.");
                }
            });
        }

        function adicionarPoligonoArray(polygon, preco, corExistente = null, nomeExistente = null) {
            const cor = corExistente || '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            polygon.setOptions({ fillColor: cor, strokeColor: cor });
            const id = Date.now() + Math.random();
            poligonos.push({ id: id, obj: polygon, preco: preco, nome: nomeExistente || `Área ${poligonos.length + 1}` });
            document.getElementById('placeholder-msg').style.display = 'none';
        }

        function setMsgPlaceholder(texto, mostrarBotao = false) {
            document.getElementById('msg-texto').innerText = texto;
            document.getElementById('placeholder-msg').style.display = 'block';
            const btn = document.getElementById('btn-recarregar');
            if (mostrarBotao) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }

        async function carregarDadosSalvos() {
            // Remove polígonos antigos do mapa se for um reload
            poligonos.forEach(p => p.obj.setMap(null));
            poligonos = [];

            setMsgPlaceholder("⌛ Conectando ao Firebase...");
            if (carregandoTimeout) clearTimeout(carregandoTimeout);

            // Timeout de 10 segundos para detectar travamento
            carregandoTimeout = setTimeout(() => {
                setMsgPlaceholder("⚠️ Tempo esgotado. Verifique a conexão.", true);
            }, 10000);

            try {
                const snapshot = await db.collection("config_taxas").get();
                clearTimeout(carregandoTimeout);

                if (!snapshot.empty) {
                    snapshot.forEach(doc => {
                        const area = doc.data();
                        if (!area.pontos || !Array.isArray(area.pontos) || area.pontos.length < 3) return;

                        const pontosFormatados = area.pontos.map(p => ({
                            lat: parseFloat(String(p.lat).replace(',','.')),
                            lng: parseFloat(String(p.lng).replace(',','.'))
                        })).filter(p => !isNaN(p.lat) && !isNaN(p.lng));

                        if (pontosFormatados.length < 3) return;

                        const polygon = new google.maps.Polygon({
                            path: pontosFormatados,
                            editable: true,
                            draggable: true,
                            fillOpacity: 0.45,
                            strokeWeight: 2,
                            map: map
                        });
                        adicionarPoligonoArray(polygon, area.preco, area.cor, area.nome);
                    });

                    if (poligonos.length > 0) {
                        atualizarListaSidebar();
                    } else {
                        setMsgPlaceholder("Nenhuma área válida encontrada. Comece a desenhar!", false);
                    }
                } else {
                    setMsgPlaceholder("Nenhuma área salva. Comece a desenhar no mapa!", false);
                }
            } catch (e) {
                clearTimeout(carregandoTimeout);
                console.error("Erro ao carregar:", e);
                setMsgPlaceholder("❌ Erro: " + (e.message || "Falha na conexão."), true);
            }
        }

        function atualizarListaSidebar() {
            const container = document.getElementById('lista-areas');
            container.innerHTML = poligonos.map(p => `
                <div class="p-4 bg-zinc-800/50 rounded-xl border-l-4" style="border-color: ${p.obj.fillColor}">
                    <div class="flex justify-between items-center mb-2">
                        <input type="text" value="${(p.nome || '').replace(/"/g,"'")}" placeholder="Nome da Área"
                            onchange="atualizarNome(${p.id}, this.value)"
                            class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-white font-bold text-[10px] w-2/3 outline-none focus:border-[#39FF14] uppercase">
                        <button onclick="removerArea(${p.id})" class="text-red-500 text-[10px] font-black uppercase hover:text-red-400">✕ Remover</button>
                    </div>
                    <div class="relative mt-2">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#39FF14] font-bold text-sm">R$</span>
                        <input type="number" step="0.50" min="0" value="${parseFloat(p.preco || 0).toFixed(2)}"
                            onchange="atualizarPreco(${p.id}, this.value)"
                            class="bg-zinc-950 border border-zinc-700 rounded-lg w-full py-2 pl-10 text-white font-black outline-none focus:border-[#39FF14]">
                    </div>
                </div>
            `).join('');
        }

        function atualizarPreco(id, valor) {
            const p = poligonos.find(x => x.id === id);
            if(p) p.preco = parseFloat(valor) || 0;
        }

        function atualizarNome(id, valor) {
            const p = poligonos.find(x => x.id === id);
            if(p) p.nome = valor;
        }

        function removerArea(id) {
            const index = poligonos.findIndex(x => x.id === id);
            if (index > -1) {
                poligonos[index].obj.setMap(null);
                poligonos.splice(index, 1);
                if(poligonos.length === 0) {
                    setMsgPlaceholder("Nenhuma área. Comece a desenhar no mapa!", false);
                } else {
                    atualizarListaSidebar();
                }
            }
        }

        async function salvarConfiguracoes() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            const dadosParaSalvar = poligonos.map(p => {
                const path = p.obj.getPath().getArray().map(latLng => ({ lat: latLng.lat(), lng: latLng.lng() }));
                return { preco: parseFloat(p.preco) || 0, cor: p.obj.fillColor, pontos: path, nome: p.nome || "" };
            });

            try {
                const snapshot = await db.collection("config_taxas").get();
                const batch = db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                
                dadosParaSalvar.forEach(d => {
                    const newRef = db.collection("config_taxas").doc();
                    batch.set(newRef, d);
                });
                await batch.commit();

                const statusEl = document.getElementById('status-save');
                statusEl.classList.remove('hidden');
                setTimeout(() => statusEl.classList.add('hidden'), 3000);
                alert("Mapa salvo com sucesso no Firebase! ✅");
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
            } finally {
                btn.innerText = "Salvar Alterações";
                btn.disabled = false;
            }
        }

        // Inicializa o mapa quando o DOM estiver pronto
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
