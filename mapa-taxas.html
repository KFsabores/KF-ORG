<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor de Áreas - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=drawing,geometry"></script>
    <style>
        #map { height: 600px; width: 100%; border-radius: 20px; }
        .gm-style-iw { color: black !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
</head>
<body class="bg-zinc-950 p-4 md:p-8 text-white">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black uppercase italic text-[#39FF14]">Editor de Geofencing</h1>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest font-bold">Paciência, RJ - Gestão de Taxas</p>
            </div>
            <div id="status-save" class="hidden text-[10px] bg-green-500/20 text-green-500 px-3 py-1 rounded-full border border-green-500/50 animate-pulse">
                Sincronizado com a Planilha
            </div>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 relative">
                <div id="map" class="border border-zinc-800 shadow-2xl"></div>
            </div>

            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 flex flex-col h-[600px]">
                <h2 class="font-bold mb-4 uppercase text-xs text-zinc-400">📍 Áreas Configuradas</h2>
                
                <div id="lista-areas" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                    <div id="placeholder-msg" class="text-center py-10 text-zinc-600 text-sm italic">
                        Carregando áreas salvas...
                    </div>
                </div>

                <div class="pt-4 mt-4 border-t border-zinc-800">
                    <button onclick="salvarConfiguracoes()" id="btn-salvar" class="w-full bg-[#39FF14] hover:bg-[#32e612] text-black font-black py-4 rounded-xl uppercase text-xs transition-all shadow-lg active:scale-95">
                        Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let drawingManager;
        let poligonos = [];
        const webAppUrl = "https://script.google.com/macros/s/AKfycbwSQIhMjYQGIfgIO9iKqrCAGU6kfJbWEM4peat1u2IIWcGtpb2RjUS0ZAoe0m0BI4Fhjw/exec";

        async function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -22.9235, lng: -43.6364 }, // Paciência, RJ
                zoom: 15,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingControl: true,
                drawingControlOptions: { position: google.maps.ControlPosition.TOP_CENTER, drawingModes: ['polygon'] },
                polygonOptions: { editable: true, draggable: true, fillOpacity: 0.45, strokeWeight: 2 }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
                adicionarPoligonoArray(polygon, 0);
                atualizarListaSidebar();
            });

            // CARREGAR DADOS EXISTENTES AO ABRIR
            carregarDadosSalvos();
        }

        function adicionarPoligonoArray(polygon, preco, corExistente = null) {
            const cor = corExistente || '#' + Math.floor(Math.random()*16777215).toString(16);
            polygon.setOptions({ fillColor: cor, strokeColor: cor });
            const id = Date.now() + Math.random();
            poligonos.push({ id: id, obj: polygon, preco: preco });
            document.getElementById('placeholder-msg').style.display = 'none';
        }

        async function carregarDadosSalvos() {
            try {
                const response = await fetch(`${webAppUrl}?action=getMapa`);
                const dados = await response.json();
                
                if (dados && dados.length > 0) {
                    dados.forEach(area => {
                        const polygon = new google.maps.Polygon({
                            path: area.pontos,
                            editable: true,
                            draggable: true,
                            fillOpacity: 0.45,
                            strokeWeight: 2,
                            map: map
                        });
                        adicionarPoligonoArray(polygon, area.preco, area.cor);
                    });
                    atualizarListaSidebar();
                } else {
                    document.getElementById('placeholder-msg').innerText = "Nenhuma área salva. Comece a desenhar!";
                }
            } catch (e) {
                console.error("Erro ao carregar:", e);
                document.getElementById('placeholder-msg').innerText = "Erro ao carregar dados.";
            }
        }

        function atualizarListaSidebar() {
            const container = document.getElementById('lista-areas');
            container.innerHTML = poligonos.map(p => `
                <div class="p-4 bg-zinc-800/50 rounded-xl border-l-4" style="border-color: ${p.obj.fillColor}">
                    <div class="flex justify-between items-center mb-2 text-[10px] font-bold uppercase text-zinc-400">
                        <span>Taxa de Entrega:</span>
                        <button onclick="removerArea(${p.id})" class="text-red-500">Remover</button>
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-[#39FF14] font-bold text-sm">R$</span>
                        <input type="number" step="0.50" value="${p.preco}" onchange="atualizarPreco(${p.id}, this.value)" 
                            class="bg-zinc-950 border border-zinc-700 rounded-lg w-full py-2 pl-10 text-white font-black outline-none">
                    </div>
                </div>
            `).join('');
        }

        function atualizarPreco(id, valor) {
            const p = poligonos.find(x => x.id === id);
            if(p) p.preco = parseFloat(valor);
        }

        function removerArea(id) {
            const index = poligonos.findIndex(x => x.id === id);
            if (index > -1) {
                poligonos[index].obj.setMap(null);
                poligonos.splice(index, 1);
                if(poligonos.length === 0) document.getElementById('placeholder-msg').style.display = 'block';
                atualizarListaSidebar();
            }
        }

        async function salvarConfiguracoes() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            const dadosParaSalvar = poligonos.map(p => {
                const path = p.obj.getPath().getArray().map(latLng => ({ lat: latLng.lat(), lng: latLng.lng() }));
                return { preco: p.preco, cor: p.obj.fillColor, pontos: path };
            });

            try {
                await fetch(webAppUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "salvarMapa", dados: JSON.stringify(dadosParaSalvar) })
                });
                alert("Mapa salvo com sucesso em CONFIG_TAXAS!");
                document.getElementById('status-save').classList.remove('hidden');
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
            } finally {
                btn.innerText = "SALVAR ALTERAÇÕES";
                btn.disabled = false;
            }
        }

        google.maps.event.addDomListener(window, 'load', initMap);
    </script>
</body>
</html>
