<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor de Áreas - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=drawing,geometry,places"></script>
    <style>
        #map { height: 600px; width: 100%; border-radius: 20px; }
        .gm-style-iw { color: black !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjvO26MEbyQMiaTj43aUg7PwiKQmH0g34",
            authDomain: "kf-sabores-delivery.firebaseapp.com",
            projectId: "kf-sabores-delivery",
            storageBucket: "kf-sabores-delivery.firebasestorage.app",
            messagingSenderId: "926954054172",
            appId: "1:926954054172:web:fdde663c1f315ec9e9f5d9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-zinc-950 p-4 md:p-8 text-white">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black uppercase italic text-[#39FF14]">Editor de Geofencing</h1>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest font-bold">Paciência, RJ - Gestão de Taxas</p>
            </div>
            <div class="flex flex-1 max-w-md w-full relative">
                <input type="text" id="input-endereco" placeholder="Buscar endereço (Ex: Rua A, 123)..." 
                    class="bg-zinc-900 border border-zinc-700 rounded-l-xl w-full py-2 px-4 text-xs text-white outline-none focus:border-[#39FF14]">
                <button onclick="buscarEAdicionarEndereco()" class="bg-[#39FF14] text-black px-4 py-2 rounded-r-xl font-bold text-xs uppercase hover:bg-green-500 transition-colors">
                    Incluir
                </button>
            </div>
            <div id="status-save" class="hidden text-[10px] bg-green-500/20 text-green-500 px-3 py-1 rounded-full border border-green-500/50 animate-pulse">
                Sincronizado com a Planilha
            </div>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 relative">
                <div id="map" class="border border-zinc-800 shadow-2xl"></div>
            </div>

            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 flex flex-col h-[600px]">
                <h2 class="font-bold mb-4 uppercase text-xs text-zinc-400">📍 Áreas Configuradas</h2>
                
                <div id="lista-areas" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                    <div id="placeholder-msg" class="text-center py-10 text-zinc-600 text-sm italic">
                        Carregando áreas salvas...
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-zinc-800">
                    <h3 class="text-[10px] font-bold text-[#39FF14] mb-2 uppercase tracking-wider">Importar Coordenadas</h3>
                    <textarea id="txt-coordenadas-import" rows="3" class="w-full bg-zinc-950 text-[10px] text-zinc-300 p-2 rounded-lg border border-zinc-700 font-mono focus:outline-none focus:border-[#39FF14]" placeholder="Cole o seu array aqui..."></textarea>
                    <button onclick="importarCoordenadasManualmente()" class="w-full mt-2 bg-zinc-800 hover:bg-zinc-700 text-[#39FF14] font-bold py-2 rounded-lg text-[10px] uppercase transition-colors border border-[#39FF14]/20">
                        Gerar Polígono
                    </button>
                </div>

                <div class="pt-4 mt-4 border-t border-zinc-800">
                    <button onclick="salvarConfiguracoes()" id="btn-salvar" class="w-full bg-[#39FF14] hover:bg-[#32e612] text-black font-black py-4 rounded-xl uppercase text-xs transition-all shadow-lg active:scale-95">
                        Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let drawingManager;
        let poligonos = [];

        async function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -22.9235, lng: -43.6364 }, // Paciência, RJ
                zoom: 14,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingControl: true,
                drawingControlOptions: { 
                    position: google.maps.ControlPosition.TOP_CENTER, 
                    drawingModes: [google.maps.drawing.OverlayType.POLYGON] 
                },
                polygonOptions: { 
                    editable: true, 
                    draggable: true, 
                    fillOpacity: 0.45, 
                    strokeWeight: 2 
                }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
                adicionarPoligonoArray(polygon, 0);
                atualizarListaSidebar();
            });

            // CORREÇÃO AQUI: Aguarda os blocos visuais do mapa carregarem totalmente antes de puxar os dados
            google.maps.event.addListenerOnce(map, 'tilesloaded', function() {
                carregarDadosSalvos();
            });
        }

        async function buscarEAdicionarEndereco() {
            const endereco = document.getElementById('input-endereco').value;
            if(!endereco) return alert("Digite um endereço primeiro!");

            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: endereco }, (results, status) => {
                if (status === "OK" && results[0].geometry) {
                    const loc = results[0].geometry.location;
                    map.setCenter(loc);
                    map.setZoom(16);

                    const offset = 0.0005;
                    const path = [
                        { lat: loc.lat() + offset, lng: loc.lng() - offset },
                        { lat: loc.lat() + offset, lng: loc.lng() + offset },
                        { lat: loc.lat() - offset, lng: loc.lng() + offset },
                        { lat: loc.lat() - offset, lng: loc.lng() - offset }
                    ];

                    const polygon = new google.maps.Polygon({
                        path: path,
                        editable: true,
                        draggable: true,
                        fillOpacity: 0.45,
                        strokeWeight: 2,
                        map: map
                    });

                    adicionarPoligonoArray(polygon, 0);
                    atualizarListaSidebar();
                    document.getElementById('input-endereco').value = "";
                } else {
                    alert("Não foi possível encontrar esse endereço no mapa.");
                }
            });
        }

        function adicionarPoligonoArray(polygon, preco, corExistente = null) {
            const cor = corExistente || '#' + Math.floor(Math.random()*16777215).toString(16);
            polygon.setOptions({ fillColor: cor, strokeColor: cor });
            const id = Date.now() + Math.random();
            poligonos.push({ id: id, obj: polygon, preco: preco });
            document.getElementById('placeholder-msg').style.display = 'none';
        }

        async function carregarDadosSalvos() {
    try {
        // Limpa o array local para evitar duplicações
        poligonos = [];
        const msgPlaceholder = document.getElementById('placeholder-msg');
        
        const snapshot = await db.collection("config_taxas").get();
        if (!snapshot.empty) {
            snapshot.forEach(doc => {
                const area = doc.data();
                
                // CORREÇÃO CRÍTICA: Trata e valida as coordenadas explicitamente para o formato do Google
                if (!area.pontos || !Array.isArray(area.pontos)) return;
                
                const pontosFormatados = area.pontos.map(p => {
                    // Garante que estamos pegando lat/lng independentemente de como foi salvo
                    const lat = parseFloat(p.lat);
                    const lng = parseFloat(p.lng);
                    return new google.maps.LatLng(lat, lng);
                });
                
                // Cria o polígono com os pontos tratados
                const polygon = new google.maps.Polygon({
                    path: pontosFormatados,
                    editable: true,
                    draggable: true,
                    fillOpacity: 0.45,
                    strokeWeight: 2,
                    map: map // Vincula diretamente ao mapa atual
                });
                
                // Adiciona o polígono ao array global e à lista visual da barra lateral
                adicionarPoligonoArray(polygon, area.preco, area.cor);
            });
            
            atualizarListaSidebar();
        } else {
            msgPlaceholder.innerText = "Nenhuma área salva no Firebase. Comece a desenhar!";
            msgPlaceholder.style.display = 'block';
        }
    } catch (e) {
        console.error("Erro ao carregar dados do Firebase:", e);
        document.getElementById('placeholder-msg').innerText = "Erro ao carregar dados.";
    }
}

        function importarCoordenadasManualmente() {
            const textarea = document.getElementById('txt-coordenadas-import');
            const texto = textarea.value.trim();

            if (!texto) {
                alert("Por favor, cole as coordenadas no campo de texto.");
                return;
            }

            const linhas = texto.split('\n');
            let poligonosCriados = 0;

            linhas.forEach((linha) => {
                let linhaLimpa = Math.floor ? linha.trim() : linha;
                linhaLimpa = linhaLimpa.trim();
                if (!linhaLimpa) return;

                if (linhaLimpa.endsWith(',')) {
                    linhaLimpa = linhaLimpa.slice(0, -1);
                }

                try {
                    const pontos = JSON.parse(linhaLimpa);

                    if (!Array.isArray(pontos) || pontos.length < 3) {
                        console.warn("Linha ignorada por pontos insuficientes:", linhaLimpa);
                        return;
                    }

                    const polygon = new google.maps.Polygon({
                        path: pontos,
                        editable: true,
                        draggable: true,
                        fillOpacity: 0.45,
                        strokeWeight: 2,
                        map: map
                    });

                    adicionarPoligonoArray(polygon, 0);
                    poligonosCriados++;

                } catch (e) {
                    console.error("Erro ao processar linha de coordenadas:", e);
                }
            });

            if (poligonosCriados > 0) {
                atualizarListaSidebar();
                
                if (poligonos.length > 0) {
                    const ultimoPoligono = poligonos[poligonos.length - 1].obj;
                    const primeiroPonto = ultimoPoligono.getPath().getAt(0);
                    map.setCenter(primeiroPonto);
                }

                textarea.value = "";
                alert(`${poligonosCriados} polígono(s) gerado(s) com sucesso! Defina os valores na barra lateral.`);
            } else {
                alert("Não foi possível gerar nenhum polígono. Verifique o formato do texto.");
            }
        }

        function atualizarListaSidebar() {
            const container = document.getElementById('lista-areas');
            container.innerHTML = poligonos.map(p => `
                <div class="p-4 bg-zinc-800/50 rounded-xl border-l-4" style="border-color: ${p.obj.fillColor}">
                    <div class="flex justify-between items-center mb-2 text-[10px] font-bold uppercase text-zinc-400">
                        <span>Taxa de Entrega:</span>
                        <button onclick="removerArea(${p.id})" class="text-red-500">Remover</button>
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-[#39FF14] font-bold text-sm">R$</span>
                        <input type="number" step="0.50" value="${p.preco}" onchange="atualizarPreco(${p.id}, this.value)" 
                            class="bg-zinc-950 border border-zinc-700 rounded-lg w-full py-2 pl-10 text-white font-black outline-none">
                    </div>
                </div>
            `).join('');
        }

        function atualizarPreco(id, valor) {
            const p = poligonos.find(x => x.id === id);
            if(p) p.preco = parseFloat(valor);
        }

        function removerArea(id) {
            const index = poligonos.findIndex(x => x.id === id);
            if (index > -1) {
                poligonos[index].obj.setMap(null);
                poligonos.splice(index, 1);
                if(poligonos.length === 0) document.getElementById('placeholder-msg').style.display = 'block';
                atualizarListaSidebar();
            }
        }

        async function salvarConfiguracoes() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            const dadosParaSalvar = poligonos.map(p => {
                const path = p.obj.getPath().getArray().map(latLng => ({ lat: latLng.lat(), lng: latLng.lng() }));
                return { preco: p.preco, cor: p.obj.fillColor, pontos: path };
            });

            try {
                const snapshot = await db.collection("config_taxas").get();
                const batch = db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                
                dadosParaSalvar.forEach(d => {
                    const newRef = db.collection("config_taxas").doc();
                    batch.set(newRef, d);
                });
                await batch.commit();

                alert("Mapa salvo com sucesso no Firebase!");
                document.getElementById('status-save').classList.remove('hidden');
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
            } finally {
                btn.innerText = "SALVAR ALTERAÇÕES";
                btn.disabled = false;
            }
        }

        google.maps.event.addDomListener(window, 'load', initMap);
    </script>
</body>
</html>
