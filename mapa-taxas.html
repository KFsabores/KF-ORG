<script>
    let map;
    let drawingManager;
    let poligonos = [];
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwh9yv04Db69lZ50bslcRqidmjP0Eu8NTPeEUf4EI4I0VtwzUEKbaknsAGRoYy0Oxqxeg/exec";

    async function initMap() {
        map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: -22.9235, lng: -43.6364 }, 
            zoom: 15,
            styles: [
                { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
            ]
        });

        drawingManager = new google.maps.drawing.DrawingManager({
            drawingControl: true,
            drawingControlOptions: { position: google.maps.ControlPosition.TOP_CENTER, drawingModes: ['polygon'] },
            polygonOptions: { editable: true, draggable: true, fillOpacity: 0.45, strokeWeight: 2 }
        });
        drawingManager.setMap(map);

        google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
            adicionarPoligonoArray(polygon, 0);
            atualizarListaSidebar();
        });

        // Pequeno atraso para garantir que o mapa carregou as bibliotecas
        setTimeout(carregarDadosSalvos, 1000);
    }

    function adicionarPoligonoArray(polygon, preco, corExistente = null) {
        const cor = corExistente || '#' + Math.floor(Math.random()*16777215).toString(16);
        polygon.setOptions({ fillColor: cor, strokeColor: cor });
        const id = Date.now() + Math.random();
        poligonos.push({ id: id, obj: polygon, preco: preco });
        
        const placeholder = document.getElementById('placeholder-msg');
        if(placeholder) placeholder.style.display = 'none';
    }

    async function carregarDadosSalvos() {
        try {
            const response = await fetch(`${webAppUrl}?action=getMapa`);
            const dados = await response.json();
            
            if (dados && dados.length > 0) {
                dados.forEach(area => {
                    // GARANTIA: Se os pontos vierem como String, converte para Objeto
                    const pontosFormatados = typeof area.pontos === 'string' ? JSON.parse(area.pontos) : area.pontos;

                    const polygon = new google.maps.Polygon({
                        path: pontosFormatados,
                        editable: true,
                        draggable: true,
                        fillOpacity: 0.45,
                        strokeWeight: 2,
                        map: map
                    });
                    adicionarPoligonoArray(polygon, area.preco, area.cor);
                });
                atualizarListaSidebar();
            } else {
                document.getElementById('placeholder-msg').innerText = "Nenhuma área salva no banco de dados.";
            }
        } catch (e) {
            console.error("Erro ao carregar:", e);
            document.getElementById('placeholder-msg').innerText = "Erro na conexão com a planilha.";
        }
    }

    // ... (Mantenha as funções atualizarListaSidebar, atualizarPreco, removerArea e salvarConfiguracoes como estavam)

    // Altere a última linha para esta forma mais segura:
    window.onload = initMap;
</script>
