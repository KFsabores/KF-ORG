        async function initMap() {
            // Centralizado na Zona Oeste do Rio de Janeiro (Campo Grande/Santa Cruz)
            const centroInicial = { lat: -22.9190, lng: -43.6250 };

            map = new google.maps.Map(document.getElementById("map"), {
                center: centroInicial,
                zoom: 12,
                styles: [
                    { "elementType": "geometry", "stylers": [{ "color": "#212121" }] },
                    { "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                    { "elementType": "labels.text.stroke", "stylers": [{ "color": "#212121" }] },
                    { "featureType": "administrative", "elementType": "geometry", "stylers": [{ "color": "#757575" }] },
                    { "featureType": "poi", "elementType": "geometry", "stylers": [{ "color": "#18181b" }] },
                    { "featureType": "poi", "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                    { "featureType": "road", "elementType": "geometry.fill", "stylers": [{ "color": "#2c2c2c" }] },
                    { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#8a8a8a" }] },
                    { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#000000" }] }
                ],
                disableDefaultUI: false
            });

            const input = document.getElementById("pac-input");
            const autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);

            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) return;

                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(15);
                }
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: null,
                drawingControl: true,
                drawingControlOptions: {
                    position: google.maps.ControlPosition.TOP_CENTER,
                    drawingModes: [google.maps.drawing.OverlayType.POLYGON]
                },
                polygonOptions: {
                    fillColor: "#39FF14",
                    fillOpacity: 0.3,
                    strokeWeight: 2,
                    strokeColor: "#39FF14",
                    editable: true,
                    draggable: true
                }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'polygoncomplete', function (polygon) {
                adicionarPoligonoLista(polygon, 0, "#39FF14", "Nova Região");
            });

            // Força o carregamento do Firebase ou do Backup de segurança
            await carregarConfiguracoes();
        }

        function adicionarPoligonoLista(polygon, preco = 0, cor = "#39FF14", nome = "") {
            document.getElementById('placeholder-msg').style.display = 'none';

            // Garante que a cor inserida seja aplicada visualmente no mapa
            polygon.setOptions({ fillColor: cor, strokeColor: cor });

            const item = { 
                obj: polygon, 
                preco: parseFloat(preco) || 0, 
                nome: nome || "Nova Região" 
            };
            
            poligonos.push(item);
            atualizarListaSidebar();

            const infoWindow = new google.maps.InfoWindow();
            google.maps.event.addListener(polygon, 'click', function (event) {
                infoWindow.setContent(`
                    <div style="padding: 5px; font-family: sans-serif; color: black !important;">
                        <b>${item.nome}</b><br>
                        <span>Taxa: R$ ${parseFloat(item.preco).toFixed(2)}</span>
                    </div>
                `);
                infoWindow.setPosition(event.latLng);
                infoWindow.open(map);
            });
        }

        function atualizarListaSidebar() {
            const container = document.getElementById("lista-regioes");
            container.innerHTML = "";

            poligonos.forEach((p, idx) => {
                const div = document.createElement("div");
                div.className = "bg-zinc-950 border border-zinc-800 rounded-xl p-4 space-y-3 relative";
                div.innerHTML = `
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Nome da Região</label>
                        <input type="text" value="${p.nome}" oninput="atualizarDados(${idx}, 'nome', this.value)" 
                               placeholder="Ex: Campo Grande, Centro..."
                               class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#39FF14]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Taxa (R$)</label>
                            <input type="number" step="0.50" value="${p.preco}" oninput="atualizarDados(${idx}, 'preco', this.value)" 
                                   class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#39FF14]">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Cor</label>
                            <input type="color" value="${p.obj.fillColor}" onchange="atualizarDados(${idx}, 'cor', this.value)" 
                                   class="w-full h-8 bg-zinc-900 border border-zinc-800 rounded-lg p-1 cursor-pointer">
                        </div>
                    </div>
                    <button onclick="removerPoligono(${idx})" class="text-xs text-red-500 font-bold hover:text-red-400 flex items-center gap-1 pt-1">
                        🗑️ Remover Área
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function atualizarDados(index, campo, valor) {
            if (campo === 'preco') {
                poligonos[index].preco = parseFloat(valor) || 0;
            } else if (campo === 'nome') {
                poligonos[index].nome = valor;
            } else if (campo === 'cor') {
                poligonos[index].obj.setOptions({ fillColor: valor, strokeColor: valor });
            }
        }

        function removerPoligono(index) {
            poligonos[index].obj.setMap(null);
            poligonos.splice(index, 1);
            if (poligonos.length === 0) document.getElementById('placeholder-msg').style.display = 'block';
            atualizarListaSidebar();
        }

        // CARREGA DO BANCO OU ATIVA AS 7 ÁREAS DE BACKUP AUTOMATICAMENTE
        async function carregarConfiguracoes() {
            try {
                console.log("Conectando ao Firestore...");
                const docSnap = await db.collection("config_taxas").doc("dados_globais").get();
                
                let regioesParaRenderizar = [];

                if (docSnap.exists && docSnap.data().regioes && docSnap.data().regioes.length > 0) {
                    console.log("Dados unificados encontrados no Firebase Firestore!");
                    regioesParaRenderizar = docSnap.data().regioes;
                } else {
                    console.warn("Nenhum dado unificado está ativo no Firebase. Carregando as 7 áreas originais de segurança...");
                    regioesParaRenderizar = coordenadasBackup;
                }
                
                // Limpa polígonos atuais se houver algum vestígio
                poligonos.forEach(p => p.obj.setMap(null));
                poligonos = [];

                // Desenha cada região em cima do mapa
                regioesParaRenderizar.forEach(regiao => {
                    const polygon = new google.maps.Polygon({
                        paths: regiao.pontos,
                        fillColor: regiao.cor || "#39FF14",
                        fillOpacity: 0.35,
                        strokeWeight: 2,
                        strokeColor: regiao.cor || "#39FF14",
                        editable: true,
                        draggable: true
                    });
                    polygon.setMap(map);
                    adicionarPoligonoLista(polygon, regiao.preco, regiao.cor, regiao.nome);
                });

            } catch (e) {
                console.error("Erro ao ler do Firebase. Carregando modo de segurança off-line...", e);
                coordenadasBackup.forEach(regiao => {
                    const polygon = new google.maps.Polygon({
                        paths: regiao.pontos,
                        fillColor: regiao.cor,
                        fillOpacity: 0.35,
                        strokeWeight: 2,
                        strokeColor: regiao.cor,
                        editable: true,
                        draggable: true
                    });
                    polygon.setMap(map);
                    adicionarPoligonoLista(polygon, regiao.preco, regiao.cor, regiao.nome);
                });
            }
        }

        // GRAVAÇÃO COMPACTA NO NOVO PADRÃO SEM DELETAR COLEÇÕES
        async function salvarConfiguracoes() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            const dadosParaSalvar = poligonos.map(p => {
                const path = p.obj.getPath().getArray().map(latLng => ({ 
                    lat: latLng.lat(), 
                    lng: latLng.lng() 
                }));
                return { 
                    preco: parseFloat(p.preco) || 0, 
                    cor: p.obj.fillColor, 
                    pontos: path, 
                    nome: p.nome || "" 
                };
            });

            try {
                // Sobrescreve e limpa de forma atômica no banco de dados novo
                await db.collection("config_taxas").doc("dados_globais").set({
                    regioes: dadosParaSalvar,
                    ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Mapa e taxas salvos com sucesso no Firebase!");
                const statusEl = document.getElementById('status-save');
                statusEl.classList.remove('hidden');
                setTimeout(() => statusEl.classList.add('hidden'), 3000);
            } catch (e) {
                alert("Erro ao salvar mapa: " + e.message);
                console.error(e);
            } finally {
                btn.innerText = "SALVAR ALTERAÇÕES";
                btn.disabled = false;
            }
        }

        google.maps.event.addDomListener(window, 'load', initMap);
    </script>
</body>
