<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor de Áreas - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=drawing,geometry"></script>
    <style>
        #map { height: 600px; width: 100%; border-radius: 20px; }
        .gm-style-iw { color: black !important; } /* Cor do texto dentro de balões do mapa */
    </style>
</head>
<body class="bg-zinc-950 p-4 md:p-8 text-white">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black uppercase italic text-[#39FF14]">Editor de Geofencing (Taxas por Área)</h1>
            <span class="text-[10px] bg-zinc-800 px-3 py-1 rounded-full text-zinc-400">KF SABORES - GESTÃO DE LOGÍSTICA</span>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 relative">
                <div id="map" class="border border-zinc-800 shadow-2xl"></div>
                <div class="absolute bottom-4 left-4 bg-zinc-900/80 p-2 rounded text-[10px] text-zinc-400">
                    Use o ícone de polígono no topo para desenhar
                </div>
            </div>

            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 flex flex-col h-[600px]">
                <h2 class="font-bold mb-4 uppercase text-xs text-zinc-400 flex items-center gap-2">
                    <span class="w-2 h-2 bg-[#39FF14] rounded-full animate-pulse"></span>
                    Áreas de Entrega
                </h2>
                
                <div id="lista-areas" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                    <div id="placeholder-msg" class="text-center py-10 text-zinc-600 text-sm italic">
                        Nenhuma área desenhada. <br> Comece pelo mapa acima.
                    </div>
                </div>

                <div class="pt-4 mt-4 border-t border-zinc-800">
                    <button onclick="salvarConfiguracoes()" class="w-full bg-[#39FF14] hover:bg-[#32e612] text-black font-black py-4 rounded-xl uppercase text-xs transition-all shadow-lg shadow-[#39ff14]/10">
                        Confirmar e Salvar
                    </button>
                    <p class="text-[9px] text-center text-zinc-500 mt-3 uppercase">Os valores serão aplicados instantaneamente no site do cliente.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let drawingManager;
        let poligonos = [];

        function initMap() {
            // Centralizado no RJ por padrão - Ajuste se necessário
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -22.9068, lng: -43.1729 }, 
                zoom: 13,
                disableDefaultUI: false,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                    { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
                    { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
                    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: null,
                drawingControl: true,
                drawingControlOptions: {
                    position: google.maps.ControlPosition.TOP_CENTER,
                    drawingModes: ['polygon']
                },
                polygonOptions: {
                    editable: true,
                    draggable: true,
                    fillOpacity: 0.45,
                    strokeWeight: 2
                }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
                const corAleatoria = '#' + Math.floor(Math.random()*16777215).toString(16);
                polygon.setOptions({ fillColor: corAleatoria, strokeColor: corAleatoria });
                
                const id = Date.now();
                poligonos.push({ id: id, obj: polygon, preco: 0 });
                
                document.getElementById('placeholder-msg').style.display = 'none';
                atualizarListaSidebar();
            });
        }

        function atualizarListaSidebar() {
            const container = document.getElementById('lista-areas');
            container.innerHTML = poligonos.map(p => `
                <div class="p-4 bg-zinc-800/50 rounded-xl border-l-4 shadow-inner" style="border-color: ${p.obj.fillColor}">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold uppercase text-zinc-400">Valor da Entrega:</span>
                        <button onclick="removerArea(${p.id})" class="text-red-500 hover:text-red-400 transition-colors">
                           <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                        </button>
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-zinc-500 font-bold">R$</span>
                        <input type="number" step="0.50" value="${p.preco}" onchange="atualizarPreco(${p.id}, this.value)" 
                            class="bg-zinc-900 border border-zinc-700 rounded-lg w-full py-2 pl-10 pr-3 text-white font-black outline-none focus:border-[#39FF14] transition-all">
                    </div>
                </div>
            `).join('');
        }

        function atualizarPreco(id, valor) {
            const p = poligonos.find(x => x.id === id);
            if(p) p.preco = parseFloat(valor);
        }

        function removerArea(id) {
            const index = poligonos.findIndex(x => x.id === id);
            if (index > -1) {
                poligonos[index].obj.setMap(null); // Remove do mapa
                poligonos.splice(index, 1); // Remove do array
                if(poligonos.length === 0) document.getElementById('placeholder-msg').style.display = 'block';
                atualizarListaSidebar();
            }
        }

        async function salvarConfiguracoes() {
            if(poligonos.length === 0) {
                alert("Desenhe pelo menos uma área antes de salvar!");
                return;
            }

            const dadosParaSalvar = poligonos.map(p => {
                const path = p.obj.getPath().getArray().map(latLng => ({
                    lat: latLng.lat(),
                    lng: latLng.lng()
                }));
                return { preco: p.preco, cor: p.obj.fillColor, pontos: path };
            });

            console.log("JSON para sua Planilha:", JSON.stringify(dadosParaSalvar));
            
            // AQUI ENTRA O FETCH PARA O SEU GOOGLE SCRIPT
            alert("Sucesso! As coordenadas e preços foram gerados. \n\nPróximo passo: Conectar com o Google Apps Script.");
        }

        google.maps.event.addDomListener(window, 'load', initMap);
    </script>
</body>
</html>
