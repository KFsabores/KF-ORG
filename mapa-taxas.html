<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor de Áreas - KF Sabores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuRZ6dXoe3EWdUAfztvgQNkgSbzzfuXPY&libraries=drawing,geometry,places"></script>
    <style>
        #map { height: 600px; width: 100%; border-radius: 20px; }
        .gm-style-iw { color: black !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjvO26MEbyQMiaTj43aUg7PwiKQmH0g34",
            authDomain: "kf-sabores-delivery.firebaseapp.com",
            projectId: "kf-sabores-delivery",
            storageBucket: "kf-sabores-delivery.appspot.com",
            messagingSenderId: "1090158226066",
            appId: "1:1090158226066:web:65db1f99c08e50b18f0293"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-zinc-950 text-white min-h-screen font-[Montserrat]">

    <div class="flex h-screen overflow-hidden">
        <div class="w-96 bg-zinc-900 border-r border-zinc-800 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-6">
                    <span class="text-2xl">🗺️</span>
                    <h1 class="text-xl font-black tracking-wider text-white">MAPA DE TAXAS</h1>
                </div>
                
                <p class="text-xs text-zinc-400 mb-4 leading-relaxed">
                    Clique no ícone de polígono (pentágono) que aparecerá no topo do mapa para desenhar.
                </p>

                <div class="mb-6">
                    <label class="block text-xs font-bold text-zinc-400 mb-2 uppercase">Testar ou Buscar Endereço</label>
                    <input id="pac-input" type="text" placeholder="Digite uma rua, bairro..." 
                           class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-[#39FF14] transition">
                </div>

                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 max-h-[280px]">
                    <div id="placeholder-msg" class="text-center py-8 text-zinc-500 text-sm">
                        Nenhuma região carregada ou desenhada ainda.
                    </div>
                    <div id="lista-regioes" class="space-y-3"></div>
                </div>
            </div>

            <div class="pt-4 border-t border-zinc-800 space-y-3">
                <button id="btn-salvar" onclick="salvarConfiguracoes()" 
                        class="w-full bg-[#39FF14] text-black font-black py-4 rounded-xl text-sm tracking-wider hover:bg-[#2ecc12] transition duration-200 disabled:opacity-50">
                    SALVAR ALTERAÇÕES
                </button>
                <p id="status-save" class="text-center text-xs text-[#39FF14] mt-2 font-bold hidden">
                    ✅ Configurações salvas no Firebase!
                </p>
            </div>
        </div>

        <div class="flex-1 p-6 relative">
            <div id="map" class="w-full h-full border border-zinc-800 shadow-2xl"></div>
        </div>
    </div>

    <script>
        let map;
        let drawingManager;
        let poligonos = [];

        async function initMap() {
            // Focado na Zona Oeste (Campo Grande / Santa Cruz)
            const centroInicial = { lat: -22.9035, lng: -43.5593 };

            map = new google.maps.Map(document.getElementById("map"), {
                center: centroInicial,
                zoom: 12,
                styles: [
                    { "elementType": "geometry", "stylers": [{ "color": "#212121" }] },
                    { "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                    { "elementType": "labels.text.stroke", "stylers": [{ "color": "#212121" }] },
                    { "featureType": "administrative", "elementType": "geometry", "stylers": [{ "color": "#757575" }] },
                    { "featureType": "poi", "elementType": "geometry", "stylers": [{ "color": "#18181b" }] },
                    { "featureType": "poi", "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                    { "featureType": "road", "elementType": "geometry.fill", "stylers": [{ "color": "#2c2c2c" }] },
                    { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#8a8a8a" }] },
                    { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#000000" }] }
                ],
                disableDefaultUI: false
            });

            // Inicialização segura da busca de endereço
            if (google.maps.places && google.maps.places.Autocomplete) {
                const input = document.getElementById("pac-input");
                const autocomplete = new google.maps.places.Autocomplete(input);
                autocomplete.bindTo("bounds", map);

                autocomplete.addListener("place_changed", () => {
                    const place = autocomplete.getPlace();
                    if (!place.geometry || !place.geometry.location) return;

                    if (place.geometry.viewport) {
                        map.fitBounds(place.geometry.viewport);
                    } else {
                        map.setCenter(place.geometry.location);
                        map.setZoom(15);
                    }
                });
            }

            // VOLTOU O MODELO ORIGINAL: Barra cinza nativa direto no topo central do mapa
            if (google.maps.drawing && google.maps.drawing.DrawingManager) {
                drawingManager = new google.maps.drawing.DrawingManager({
                    drawingMode: null,
                    drawingControl: true,
                    drawingControlOptions: {
                        position: google.maps.ControlPosition.TOP_CENTER,
                        drawingModes: [google.maps.drawing.OverlayType.POLYGON]
                    },
                    polygonOptions: {
                        fillColor: "#39FF14",
                        fillOpacity: 0.3,
                        strokeWeight: 2,
                        strokeColor: "#39FF14",
                        editable: true,
                        draggable: true
                    }
                });
                drawingManager.setMap(map);

                google.maps.event.addListener(drawingManager, 'polygoncomplete', function (polygon) {
                    adicionarPoligonoLista(polygon, 0, "#39FF14", "Nova Região");
                });
            }

            await carregarConfiguracoes();
        }

        function adicionarPoligonoLista(polygon, preco = 0, cor = "#39FF14", nome = "") {
            document.getElementById('placeholder-msg').style.display = 'none';

            const id = Date.now() + Math.random().toString(36).substr(2, 5);
            polygon.setOptions({ fillColor: cor, strokeColor: cor });

            const item = { id: id, obj: polygon, preco: preco, nome: nome };
            poligonos.push(item);

            atualizarListaSidebar();

            const infoWindow = new google.maps.InfoWindow();
            google.maps.event.addListener(polygon, 'click', function (event) {
                infoWindow.setContent(`
                    <div style="padding: 5px; font-family: sans-serif;">
                        <b style="color:#000;">${item.nome || 'Sem nome'}</b><br>
                        <span style="color:#333;">Taxa: R$ ${parseFloat(item.preco).toFixed(2)}</span>
                    </div>
                `);
                infoWindow.setPosition(event.latLng);
                infoWindow.open(map);
            });
        }

        function atualizarListaSidebar() {
            const container = document.getElementById("lista-regioes");
            container.innerHTML = "";

            poligonos.forEach((p, idx) => {
                const div = document.createElement("div");
                div.className = "bg-zinc-950 border border-zinc-800 rounded-xl p-4 space-y-3 relative";
                div.innerHTML = `
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Nome da Região</label>
                        <input type="text" value="${p.nome}" onchange="atualizarDados(${idx}, 'nome', this.value)" 
                               placeholder="Ex: Setor 1, Centro..."
                               class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#39FF14]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Taxa (R$)</label>
                            <input type="number" step="0.50" value="${p.preco}" onchange="atualizarDados(${idx}, 'preco', this.value)" 
                                   class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#39FF14]">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Cor</label>
                            <input type="color" value="${p.obj.fillColor}" onchange="atualizarDados(${idx}, 'cor', this.value)" 
                                   class="w-full h-8 bg-zinc-900 border border-zinc-800 rounded-lg p-1 cursor-pointer">
                        </div>
                    </div>
                    <button onclick="removerPoligono(${idx})" class="text-xs text-red-500 font-bold hover:text-red-400 flex items-center gap-1 pt-1">
                        🗑️ Remover Área
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function atualizarDados(index, campo, valor) {
            if (campo === 'preco') {
                poligonos[index].preco = parseFloat(valor) || 0;
            } else if (campo === 'nome') {
                poligonos[index].nome = valor;
            } else if (campo === 'cor') {
                poligonos[index].obj.setOptions({ fillColor: valor, strokeColor: valor });
            }
        }

        function removerPoligono(index) {
            poligonos[index].obj.setMap(null);
            poligonos.splice(index, 1);
            if (poligonos.length === 0) document.getElementById('placeholder-msg').style.display = 'block';
            atualizarListaSidebar();
        }

        async function carregarConfiguracoes() {
            try {
                const snapshot = await db.collection("config_taxas").get();
                let bounds = new google.maps.LatLngBounds();
                let temPontos = false;

                snapshot.forEach(doc => {
                    if(doc.id !== "dados_globais") {
                        const data = doc.data();
                        // Ignora dados corrompidos ou em branco das tentativas anteriores
                        if (data.pontos && Array.isArray(data.pontos) && data.pontos.length > 0 && data.pontos[0].lat) {
                            const polygon = new google.maps.Polygon({
                                paths: data.pontos,
                                fillColor: data.cor || "#39FF14",
                                fillOpacity: 0.3,
                                strokeWeight: 2,
                                strokeColor: data.cor || "#39FF14",
                                editable: true,
                                draggable: true
                            });
                            polygon.setMap(map);
                            adicionarPoligonoLista(polygon, data.preco, data.cor, data.nome);
                            
                            data.pontos.forEach(pt => {
                                bounds.extend(new google.maps.LatLng(pt.lat, pt.lng));
                                temPontos = true;
                            });
                        }
                    }
                });

                if (temPontos) {
                    map.fitBounds(bounds);
                }
            } catch (e) {
                console.error("Erro ao carregar dados do mapa: ", e);
            }
        }

        async function salvarConfiguracoes() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            const dadosParaSalvar = poligonos.map(p => {
                const path = p.obj.getPath().getArray().map(latLng => ({ lat: latLng.lat(), lng: latLng.lng() }));
                return { preco: parseFloat(p.preco) || 0, cor: p.obj.fillColor, pontos: path, nome: p.nome || "" };
            });

            try {
                const snapshot = await db.collection("config_taxas").get();
                const batch = db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                
                dadosParaSalvar.forEach(d => {
                    const newRef = db.collection("config_taxas").doc();
                    batch.set(newRef, d);
                });
                await batch.commit();

                alert("Mapa salvo com sucesso no Firebase!");
                const statusEl = document.getElementById('status-save');
                if (statusEl) {
                    statusEl.classList.remove('hidden');
                    setTimeout(() => statusEl.classList.add('hidden'), 3000);
                }
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
                console.error(e);
            } finally {
                btn.innerText = "SALVAR ALTERAÇÕES";
                btn.disabled = false;
            }
        }

        google.maps.event.addDomListener(window, 'load', initMap);
    </script>
</body>
</html>
