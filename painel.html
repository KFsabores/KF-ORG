<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; display: block !important; } #print-area { position: absolute; left: 0; top: 0; width: 48mm; } }
        body { background-color: #09090b; color: white; font-family: 'Inter', sans-serif; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .cat-title { color: #39FF14; font-weight: 900; text-transform: uppercase; font-size: 14px; margin-bottom: 1rem; italic; display: flex; align-items: center; gap: 8px; }
        .map-link { color: #60a5fa; text-decoration: underline; font-weight: bold; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .btn-status { transition: all 0.2s; }
        .btn-status:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl gap-4">
            <div>
                <h1 class="text-4xl font-black text-[#39FF14] italic uppercase tracking-tighter leading-none">KF SABORES</h1>
                <p class="text-zinc-500 text-[10px] font-bold uppercase mt-2">🕒 MONITORAMENTO EM TEMPO REAL</p>
            </div>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="gerarRelatorio()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg hover:bg-blue-500 btn-status">📊 Relatório</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg hover:bg-orange-500 btn-status">📦 Estoque</button>
                <button onclick="carregarPedidos()" class="bg-zinc-800 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase border border-zinc-700 hover:bg-zinc-700 btn-status">🔄 Sincronizar</button>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border border-orange-500/30 shadow-2xl">
            <h2 class="text-2xl font-black text-orange-500 uppercase italic mb-8 text-center tracking-widest">Controle de Disponibilidade</h2>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] bg-black/95 p-4 backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-10 text-center shadow-2xl">
            <h2 class="text-3xl font-black text-[#39FF14] italic uppercase mb-2">CAIXA ATUAL</h2>
            <p class="text-zinc-500 text-[10px] mb-8 font-bold uppercase tracking-widest">Baseado em pedidos concluídos</p>
            <div id="rel-content" class="mb-8"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-zinc-700 transition-colors">Fechar Painel</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        // URL DO SEU SCRIPT ATUALIZADA
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxWxHsDmWlQ84MywvMoVjoVsWoQKln4QOytg1-UrG5W0QajsFEHSObZKPeLszImydXrXA/exec'; 
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';
        
        let pedidosLocais = [];

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const res = await fetch(url);
                const csv = await res.text();
                const rows = csv.split('\n').map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
                
                pedidosLocais = rows.slice(1).filter(r => r[1]).map((row, idx) => ({
                    linha: idx + 2,
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    valorTxt: row[5],
                    status: (row[6] || '').toUpperCase(),
                    modalidade: (row[7] || 'DELIVERY').toUpperCase()
                }));
                renderizarPedidos();
            } catch (e) { console.error("Erro ao carregar pedidos da planilha"); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            [...pedidosLocais].reverse().forEach(p => {
                const isConcluido = p.status.includes('CONCLU');
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}`;
                
                container.innerHTML += `
                    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl border-t-8 ${isConcluido ? 'border-t-zinc-700 opacity-40' : (p.modalidade.includes('RETIRADA') ? 'border-t-orange-600' : 'border-t-green-600')} shadow-xl transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[9px] font-black bg-zinc-800 px-2 py-1 rounded text-zinc-400 uppercase tracking-tighter">${p.modalidade}</span>
                            <span class="text-[9px] font-black ${isConcluido ? 'text-zinc-500' : 'text-[#39FF14]'} uppercase tracking-widest">${isConcluido ? '✓ Finalizado' : '● Ativo'}</span>
                        </div>
                        <h3 class="text-2xl font-black uppercase text-white mb-1 leading-none tracking-tight">${p.nome}</h3>
                        <p class="text-[11px] mb-4 italic text-zinc-400">📍 <a href="${mapsUrl}" target="_blank" class="map-link">${p.endereco}</a></p>
                        <div class="bg-black/40 p-4 rounded-2xl mb-6 text-[12px] font-bold uppercase border border-zinc-800/50 text-zinc-300 leading-relaxed">
                            ${p.itens.split('|').join('<br><span class="text-zinc-600">•</span> ')}
                        </div>
                        <div class="flex justify-between items-center pt-2">
                            <span class="text-2xl font-black text-[#39FF14] italic tracking-tighter">${p.valorTxt}</span>
                            ${!isConcluido ? `
                                <button onclick="alterarStatus(${p.linha}, 'CONCLUIDO')" class="bg-[#39FF14] text-black px-6 py-2.5 rounded-xl font-black text-[10px] uppercase hover:bg-white transition-all shadow-lg shadow-[#39FF14]/10">Finalizar</button>
                            ` : ''}
                        </div>
                    </div>`;
            });
        }

        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<div class='text-center animate-pulse text-orange-500 font-black py-10 uppercase tracking-widest'>Sincronizando Categorias da Coluna C...</div>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoqueArr = await res.json();
                
                const grupos = {};
                estoqueArr.forEach(i => {
                    const cat = (i.categoria || "OUTROS").toUpperCase();
                    if (!grupos[cat]) grupos[cat] = [];
                    grupos[cat].push(i);
                });

                let html = "";
                Object.keys(grupos).sort().forEach(cat => {
                    const icon = cat.includes('PIZZA') ? '🍕' : (cat.includes('TAPIOCA') ? '🌮' : '📦');
                    html += `<div class="cat-card">
                        <h3 class="cat-title">${icon} ${cat}</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">`;
                    grupos[cat].forEach(i => {
                        const isPausado = i.status === 'PAUSADO';
                        html += `
                            <div class="bg-black/40 p-4 rounded-2xl border ${isPausado ? 'border-red-600/40 opacity-60' : 'border-zinc-800'} transition-all">
                                <p class="text-[10px] font-black uppercase mb-4 text-zinc-300 h-8 overflow-hidden leading-tight">${i.nome}</p>
                                <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                    class="w-full py-2.5 rounded-xl text-[9px] font-black uppercase tracking-tighter transition-colors ${isPausado ? 'bg-green-600 hover:bg-green-500' : 'bg-red-600 hover:bg-red-500'}">
                                    ${isPausado ? 'Ativar' : 'Pausar'}
                                </button>
                            </div>`;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "<div class='text-red-500 font-bold p-4 text-center'>Erro ao carregar Coluna C. Verifique a URL do Script.</div>"; }
        }

        function gerarRelatorio() {
            const concluidos = pedidosLocais.filter(p => p.status.includes('CONCLU'));
            let soma = 0;
            concluidos.forEach(p => {
                // Remove R$, remove ponto de milhar, troca vírgula decimal por ponto
                let v = p.valorTxt.toString().replace("R$", "").replace(/\./g, "").replace(",", ".");
                soma += parseFloat(v) || 0;
            });

            document.getElementById('rel-content').innerHTML = `
                <div class="text-5xl font-black text-[#39FF14] mb-4 tracking-tighter italic">R$ ${soma.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                <div class="bg-black/30 p-4 rounded-2xl border border-zinc-800 inline-block px-8">
                    <p class="text-zinc-500 text-[9px] font-black uppercase mb-1">Volume de Vendas</p>
                    <p class="text-white font-black text-xl uppercase tracking-tighter">${concluidos.length} Pedidos</p>
                </div>
            `;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        async function mudarStatusEstoque(item, status, btn) {
            const textOrig = btn.innerText;
            btn.innerText = "⏳";
            btn.disabled = true;
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) });
                setTimeout(carregarEstoque, 1000);
            } catch (e) { 
                alert("Erro ao atualizar estoque."); 
                btn.innerText = textOrig;
                btn.disabled = false;
            }
        }

        async function alterarStatus(row, status) {
            try {
                await fetch(`${WEB_APP_URL}?row=${row}&status=${status}`);
                carregarPedidos();
            } catch (e) { alert("Erro ao atualizar status do pedido."); }
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        // Inicialização
        carregarPedidos();
        setInterval(carregarPedidos, 30000);
    </script>
</body>
</html>
