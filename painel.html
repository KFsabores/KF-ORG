<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 12px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .item-separador { margin-bottom: 4px; display: block; }
        .linha { border-bottom: 2px dashed #000; margin: 5px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
        body { background-color: #09090b; color: white; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 2px 8px; border-radius: 99px; font-family: monospace; font-size: 11px; }
        .link-maps { color: #60a5fa; text-decoration: underline; }
        .link-maps:hover { color: #93c5fd; }
        #map { height: 400px; width: 100%; border-radius: 1rem; margin-top: 1rem; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="gerarRelatorio('dia')" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500">📊 Hoje</button>
                <button onclick="gerarRelatorio('semana')" class="bg-purple-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-purple-500">📅 Semana</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500">📦 Estoque</button>
                <button onclick="toggleMapa()" class="bg-green-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-green-500">🗺️ Zonas</button>
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-zinc-700 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-600">⚙️ SITE ADM</a>
            </div>
        </div>

        <div id="painel-mapa" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border border-green-500/30">
            <h2 class="text-2xl font-black text-[#39FF14] uppercase italic mb-4 text-center">Configurar Áreas de Entrega</h2>
            <div id="map"></div>
            <p class="text-center text-zinc-500 text-[10px] mt-4 uppercase font-bold tracking-widest">Desenhe polígonos para definir preços. Áreas sem desenho serão "A Combinar".</p>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border border-orange-500/30">
            <h2 class="text-2xl font-black text-orange-500 uppercase italic mb-8 text-center">Disponibilidade de Itens</h2>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] p-4 bg-black/90">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 text-center">
            <h2 id="rel-titulo" class="text-2xl font-black text-[#39FF14] italic uppercase mb-6 border-b border-zinc-800 pb-2">Relatório</h2>
            <div id="rel-content" class="space-y-4 text-left"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-8 bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase text-xs">Fechar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSy...uXPY&libraries=drawing,geometry&callback=initMap"></script>

    <script>
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyUAwFYfg4ZiqQnFumpBYk8XDf8r7mYRJuhl1Ivhu5IPlQhkhxa-UgWZcx1nbueJUYyaw/exec'; 

        let todosOsPedidos = []; 
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');
        let map, drawingManager;
        let zonasDeEntrega = [];

        function initMap() {
            const centro = { lat: -22.9064, lng: -43.6253 };
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13,
                center: centro,
                styles: [{ "stylers": [{ "invert_lightness": true }, { "saturation": -100 }] }]
            });

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: google.maps.drawing.OverlayType.POLYGON,
                drawingControl: true,
                drawingControlOptions: { position: google.maps.ControlPosition.TOP_CENTER, drawingModes: ['polygon'] },
                polygonOptions: { fillColor: '#39FF14', fillOpacity: 0.3, strokeWeight: 2, clickable: true, editable: true }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
                const valor = prompt("Valor da entrega para esta área (Ex: 10.00):");
                if (valor) {
                    zonasDeEntrega.push({ polygon, valor: parseFloat(valor) });
                }
            });
        }

        function toggleMapa() { document.getElementById('painel-mapa').classList.toggle('hidden'); }
        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date(0);
            const partes = stringData.split(' ');
            const dataP = partes[0].split('/');
            const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
            return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
        }

        function limparValor(valorStr) {
            if (!valorStr) return 0;
            let apenasNumeros = valorStr.replace(/[^\d,.]/g, '');
            if (apenasNumeros.includes(',')) {
                apenasNumeros = apenasNumeros.replace(/\./g, '').replace(',', '.');
            }
            let num = parseFloat(apenasNumeros);
            return isNaN(num) ? 0 : num;
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora-pedido]').forEach(el => {
                const status = el.getAttribute('data-status');
                if (status.includes('CONCLU')) return;
                const dataPedido = new Date(el.getAttribute('data-hora-pedido'));
                const diff = Math.floor((agora - dataPedido) / 1000);
                if (diff < 0) { el.innerText = "00:00"; return; }
                const m = Math.floor((diff % 3600) / 60);
                const s = diff % 60;
                el.innerText = String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
            });
        }
        setInterval(atualizarCronometros, 1000);

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );
                const pedidosRaw = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                todosOsPedidos = pedidosRaw.map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: limparValor(row[5]),
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || (row[2].toUpperCase().includes("RETIRADA") ? "RETIRADA" : "DELIVERY")).toUpperCase(),
                    telefone: row[8] || "",
                    taxaEntrega: row[9] || "0,00"
                }));

                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    ringtone.play().catch(e => {});
                }
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            let pedidosParaExibir = [...todosOsPedidos].sort((a, b) => b.objData - a.objData);

            pedidosParaExibir.forEach(p => {
                let isRetirada = p.modalidade.includes('RETIRADA');
                let cardBorder = p.status.includes("PREPARANDO") ? "border-blue-500" : (p.status.includes("CONCLUIDO") ? "border-zinc-800 opacity-50" : "border-yellow-500");
                const dadosParaImprimir = encodeURIComponent(JSON.stringify(p));
                const telLimpo = p.telefone.toString().replace(/\D/g, '');
                const linkZap = telLimpo ? `https://wa.me/55${telLimpo}` : '#';

                // CORREÇÃO DA LÓGICA DE EXIBIÇÃO DO FRETE
                let valorTaxa = limparValor(p.taxaEntrega);
                let taxaTexto = (valorTaxa > 0) ? `R$ ${valorTaxa.toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : "A COMBINAR";
                if (isRetirada) taxaTexto = "RETIRADA";

                container.innerHTML += `
                    <div class="bg-zinc-900 border-2 ${cardBorder} p-6 rounded-3xl flex flex-col h-full border-t-8 ${isRetirada ? 'border-t-orange-600' : 'border-t-green-600'} shadow-xl">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-zinc-500 font-bold text-[10px]">${p.dataFull}</span>
                            <div class="flex gap-2">
                                <span class="timer-badge" data-hora-pedido="${p.objData.toISOString()}" data-status="${p.status}">...</span>
                                <span class="status-badge ${p.status.includes("PREPARANDO") ? 'bg-blue-600' : (p.status.includes("CONCLUIDO") ? 'bg-zinc-700' : 'bg-yellow-600')} text-white">${p.status}</span>
                            </div>
                        </div>
                        <h3 class="text-2xl font-black italic mb-1 uppercase leading-none">${p.nome}</h3>
                        
                        <div class="mb-3">
                            <a href="${linkZap}" target="_blank" class="inline-flex items-center gap-2 bg-green-600/20 text-green-500 px-3 py-1.5 rounded-lg text-[10px] font-black border border-green-600/30 hover:bg-green-600 hover:text-white transition-all">
                                📞 ${p.telefone || 'N/A'}
                            </a>
                        </div>

                        <p class="text-xs font-bold text-zinc-400 mb-4 italic block uppercase">📍 ${p.endereco}</p>
                        <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-zinc-800/50 flex-grow text-sm font-bold uppercase">
                            ${p.itens.split('|').map(i => `<div class="mb-1 text-zinc-200">• ${i.trim()}</div>`).join('')}
                        </div>
                        
                        <div class="flex justify-between text-[11px] font-black uppercase mb-4 px-1 border-b border-zinc-800 pb-2">
                            <span class="text-zinc-500">TAXA DE ENTREGA:</span>
                            <span class="${taxaTexto.includes('COMBINAR') ? 'text-orange-500' : 'text-[#39FF14]'}">${taxaTexto}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 text-white text-[10px] font-black py-3 rounded-xl uppercase">👨‍🍳 Cozinha</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-green-600 text-white text-[10px] font-black py-3 rounded-xl uppercase">✅ Concluir</button>
                        </div>
                        <div class="flex justify-between items-center pt-2">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal}, this)" class="bg-red-900/40 text-red-500 border border-red-500 font-black px-3 py-3 rounded-xl text-[10px] uppercase">🗑️</button>
                                <button onclick="imprimir('${dadosParaImprimir}')" class="bg-white text-black font-black px-4 py-3 rounded-xl text-[10px] uppercase">🖨️ Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            const lista = p.itens.split('|').map(i => `<span class="item-separador">• ${i.trim().toUpperCase()}</span>`).join('');
            
            let vTaxa = limparValor(p.taxaEntrega);
            let fretePrint = (vTaxa > 0) ? `R$ ${vTaxa.toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : "A COMBINAR";
            if (p.modalidade.includes('RETIRADA')) fretePrint = "RETIRADA";

            area.innerHTML = `<div class="cupom-termico"><center><strong style="font-size: 14px;">KF SABORES</strong><br>${p.modalidade}<br>${p.dataFull}</center><div class="linha"></div>CLIENTE: ${p.nome.toUpperCase()}<br>END: ${p.endereco.toUpperCase()}<br><div class="linha"></div>ITENS:<br>${lista}<div class="linha"></div>TAXA ENTREGA: ${fretePrint}<br>PAGTO: ${p.pagto.toUpperCase()}<br><strong style="font-size: 14px;">TOTAL: ${p.total}</strong><div class="linha"></div><center>BOM APETITE!</center></div>`;
            setTimeout(() => { window.print(); }, 300);
        }

        async function cancelarPedido(linha, btn) { if (confirm("Deseja cancelar?")) { btn.innerText = "⏳"; await fetch(`${WEB_APP_URL}?action=deleteRow&row=${linha}`, { mode: 'no-cors' }); setTimeout(carregarPedidos, 1500); } }
        async function alterarStatus(linha, status, btn) { btn.innerText = "⏳"; await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' }); setTimeout(carregarPedidos, 1500); }
        function toggleEstoque() { const p = document.getElementById('painel-estoque'); p.classList.toggle('hidden'); if(!p.classList.contains('hidden')) carregarEstoque(); }
        async function carregarEstoque() { 
            const container = document.getElementById('lista-estoque-categorias');
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoqueArr = await res.json();
                const grupos = {};
                estoqueArr.forEach(i => { const cat = (i.categoria || "OUTROS").toUpperCase(); if (!grupos[cat]) grupos[cat] = []; grupos[cat].push(i); });
                let html = "";
                Object.keys(grupos).forEach(cat => {
                    html += `<div class="cat-card"><h3 class="text-[#39FF14] font-black uppercase text-xs mb-4 italic">● ${cat}</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                    grupos[cat].forEach(i => {
                        const isPausado = i.status === 'PAUSADO';
                        html += `<div class="bg-black/40 p-4 rounded-2xl border ${isPausado ? 'border-red-600/40 opacity-50' : 'border-zinc-800'}">
                            <p class="text-[10px] font-black uppercase mb-3 text-zinc-300 leading-tight">${i.nome}</p>
                            <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" class="w-full py-2 rounded-xl text-[9px] font-black ${isPausado ? 'bg-green-600' : 'bg-red-600'} uppercase">${isPausado ? 'Ativar' : 'Pausar'}</button>
                        </div>`;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (e) { console.error("Erro estoque"); }
        }
        async function mudarStatusEstoque(item, status, btn) { btn.innerText = "⏳"; await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) }); setTimeout(carregarEstoque, 1000); }
        function gerarRelatorio(tipo) { /* original */ }
        
        document.body.addEventListener('click', () => { pararSom(); document.getElementById('status-conexao').innerText = "📞 MONITORANDO TURNOS"; }, { once: true });
        carregarPedidos();
        setInterval(carregarPedidos, 15000);
    </script>
</body>
</html>
