<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 75mm; }
        }
        .cupom { font-family: 'Courier New', Courier, monospace; width: 70mm; font-size: 13px; line-height: 1.3; color: #000; padding: 10px; background: #fff; }
        .item-row { border-bottom: 1px dashed #000; padding: 4px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 font-sans">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter">KF SABORES</h1>
                <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest">Painel de Comandos</p>
            </div>
            <button onclick="carregarPedidos()" class="bg-[#39FF14] text-black hover:bg-green-400 px-8 py-3 rounded-2xl font-black transition-all flex items-center gap-2 shadow-[0_0_20px_rgba(57,255,20,0.2)]">
                🔄 ATUALIZAR PEDIDOS
            </button>
        </div>

        <div id="lista-pedidos" class="grid-custom">
            <div class="col-span-full text-center py-20 italic text-zinc-600 font-bold uppercase animate-pulse">
                Buscando pedidos...
            </div>
        </div>
    </div>

    <div id="print-area" class="hidden"></div>

    <script>
        // CONFIGURAÇÕES
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';
        const SHEET_NAME = 'PEDIDOSKF'; 

        async function carregarPedidos() {
            // Mudamos para o formato /pub?output=csv que o navegador aceita abrir direto do PC
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/pub?output=csv&sheet=${SHEET_NAME}`;
            
            try {
                const response = await fetch(url);
                const data = await response.text();
                
                // Converte o CSV recebido em uma lista (Array)
                const rows = data.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '')));

                const container = document.getElementById('lista-pedidos');
                container.innerHTML = "";

                // Começamos da linha 1 para pular o cabeçalho
                // Usamos reverse para o mais novo aparecer primeiro
                const pedidos = rows.slice(1).reverse();

                if (pedidos.length === 0 || pedidos[0][0] === "") {
                    container.innerHTML = "<div class='col-span-full text-center text-zinc-500'>Nenhum pedido na planilha.</div>";
                    return;
                }

                pedidos.forEach((row) => {
                    if(!row[1]) return; // Pula linha vazia

                    const p = {
                        data: row[0],
                        nome: row[1].toUpperCase(),
                        endereco: row[2].toUpperCase(),
                        itens: row[3],
                        pagamento: row[4].toUpperCase(),
                        total: row[5],
                        status: row[6] || 'PENDENTE'
                    };

                    container.innerHTML += `
                        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl shadow-lg flex flex-col h-full">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[10px] font-bold text-zinc-600">${p.data}</span>
                                <span class="text-[9px] font-black px-2 py-1 rounded-md bg-zinc-800 text-yellow-500 border border-yellow-500/30">${p.status}</span>
                            </div>
                            <h3 class="text-xl font-black mb-1 text-white italic tracking-tighter">${p.nome}</h3>
                            <p class="text-[11px] text-zinc-500 mb-4 font-bold leading-tight">${p.endereco}</p>
                            <div class="bg-black/40 p-4 rounded-2xl mb-6 border border-zinc-800/50 flex-grow">
                                <p class="text-[12px] text-zinc-300 font-medium tracking-wide">• ${p.itens.split('|').join('<br>• ')}</p>
                            </div>
                            <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                                <div><p class="text-[9px] text-zinc-500 font-black uppercase">Total</p><span class="text-xl font-black text-[#39FF14]">${p.total}</span></div>
                                <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="bg-zinc-100 text-black font-black px-5 py-3 rounded-xl text-xs uppercase hover:bg-white active:scale-95 transition-all shadow-lg">🖨️ IMPRIMIR</button>
                            </div>
                        </div>`;
                });
            } catch (e) {
                container.innerHTML = "<div class='col-span-full text-center text-red-500'>Erro ao carregar dados. Tente atualizar a página.</div>";
            }
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            const lista = p.itens.split('|').map(item => `<div class="item-row">• ${item.trim()}</div>`).join('');
            area.innerHTML = `<div class="cupom"><center><strong style="font-size:18px">KF SABORES</strong><br>--- PEDIDO ---<br>${p.data}<br>-----------------</center><br><strong>CLIENTE:</strong> ${p.nome}<br><strong>ENDEREÇO:</strong><br>${p.endereco}<br>-----------------<br><strong>ITENS:</strong><br>${lista}<br><strong>PAGAMENTO:</strong> ${p.pagamento}<br>-----------------<br><strong style="font-size:16px">TOTAL: ${p.total}</strong><br><br><center>OBRIGADO!</center></div>`;
            window.print();
        }

        carregarPedidos();
        setInterval(carregarPedidos, 30000);
    </script>
</body>
</html>
