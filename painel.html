<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .item-separador { margin-bottom: 4px; display: block; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        .linha { border-bottom: 2px dashed #000; margin: 5px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="gerarRelatorio('dia')" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg">📊 Hoje</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg">📦 Estoque</button>
                <a href="mapa-taxas.html" class="bg-zinc-800 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-700 transition-all border border-zinc-700">🗺️ Taxas</a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-[0_0_30px_rgba(249,115,22,0.1)]">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Disponibilidade de Itens</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs">Fechar ✕</button>
            </div>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 id="rel-titulo" class="text-2xl font-black text-[#39FF14] italic uppercase mb-6 border-b border-zinc-800 pb-2">Relatório</h2>
            <div id="rel-content" class="space-y-4 text-left"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-8 bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Fechar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwX-nxGEJpw86qXQpywPL8kzbXJ6PG_DolE3_XWai6Spd-fVHWA4HWMzCmoue6Gl8hAkA/exec';

        let todosOsPedidos = []; 
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date();
            try {
                const partes = stringData.split(' ');
                const dataP = partes[0].split('/');
                const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
                return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
            } catch(e) { return new Date(); }
        }

        function limparValor(valorStr) {
            if (!valorStr) return 0;
            let val = valorStr.toString().replace("R$", "").replace(/\s/g, "").replace(",", ".");
            return isNaN(parseFloat(val)) ? 0 : parseFloat(val);
        }

        async function carregarPedidos() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getPedidos&t=${new Date().getTime()}`);
                const dados = await response.json();

                todosOsPedidos = dados.map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: limparValor(row[5]),
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || "DELIVERY").toUpperCase(),
                    telefone: row[8] || "",
                    taxaEntrega: row[9] || "0"
                }));

                // Alerta sonoro para novos pedidos pendentes
                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    const temNovoPendente = todosOsPedidos.some(p => p.status.includes('PENDENTE'));
                    if(temNovoPendente) ringtone.play().catch(e => console.log("Interação necessária para som"));
                }
                
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
                document.getElementById('status-conexao').innerText = "✅ MONITORAMENTO ATIVO";
            } catch (e) { 
                console.error("Erro:", e);
                document.getElementById('status-conexao').innerText = "❌ ERRO NA CONEXÃO";
            }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            // Ordenar: Pendentes e Preparando primeiro, depois por data
            let ordenados = [...todosOsPedidos].sort((a, b) => {
                const prioridade = (s) => (s.includes("PENDENTE") || s.includes("PREPARANDO")) ? 0 : 1;
                if (prioridade(a.status) !== prioridade(b.status)) return prioridade(a.status) - prioridade(b.status);
                return b.objData - a.objData;
            });

            ordenados.forEach(p => {
                const isConcluido = p.status.includes("CONCLU");
                const isPreparando = p.status.includes("PREPARANDO");
                const isPendente = p.status.includes("PENDENTE");

                let corBorda = "border-zinc-700";
                if (isPendente) corBorda = "border-yellow-500 shadow-yellow-500/10";
                if (isPreparando) corBorda = "border-blue-500 shadow-blue-500/10";

                container.innerHTML += `
                    <div class="bg-zinc-900 border-2 ${corBorda} p-6 rounded-3xl flex flex-col h-full border-t-[10px] ${isConcluido ? 'opacity-60' : ''}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-zinc-500 font-bold text-[10px] block uppercase">${p.dataFull}</span>
                                <span class="status-badge mt-2 inline-block ${isPreparando ? 'bg-blue-600' : (isConcluido ? 'bg-green-700' : 'bg-yellow-600')} text-white">${p.status}</span>
                            </div>
                            <span class="timer-badge" data-hora="${p.objData.toISOString()}" data-status="${p.status}">...</span>
                        </div>

                        <h3 class="text-2xl font-black italic mb-1 uppercase">${p.nome}</h3>
                        <p class="text-[11px] font-bold text-zinc-400 mb-4 italic">📍 ${p.endereco}</p>

                        <div class="bg-black/40 p-4 rounded-2xl mb-4 flex-grow text-sm font-bold uppercase">
                            ${p.itens.split('|').map(i => `<div class="mb-1 border-b border-zinc-800/50 pb-1">• ${i.trim()}</div>`).join('')}
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="pararSom(); mudarStatus(${p.linhaOriginal}, 'PREPARANDO')" class="bg-blue-600 text-white text-[10px] font-black py-3 rounded-xl uppercase">Cozinha</button>
                            <button onclick="mudarStatus(${p.linhaOriginal}, 'CONCLUIDO')" class="bg-green-600 text-white text-[10px] font-black py-3 rounded-xl uppercase">Concluir</button>
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14]">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal})" class="bg-red-900/20 text-red-500 border border-red-500/30 px-3 py-2 rounded-xl text-lg">🗑️</button>
                                <button onclick="imprimirCupom('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black font-black px-4 py-2 rounded-xl text-[10px] uppercase">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarTimers();
        }

        async function mudarStatus(linha, status) {
            await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' });
            setTimeout(carregarPedidos, 1000);
        }

        async function cancelarPedido(linha) {
            if (confirm("Apagar permanentemente este pedido?")) {
                await fetch(`${WEB_APP_URL}?action=deleteRow&row=${linha}`, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1000);
            }
        }

        function atualizarTimers() {
            const agora = new Date();
            document.querySelectorAll('[data-hora]').forEach(el => {
                const status = el.getAttribute('data-status');
                if (status.includes('CONCLU')) { el.innerText = "OK"; return; }
                
                const diff = Math.floor((agora - new Date(el.getAttribute('data-hora'))) / 60000);
                el.innerText = diff + "m";
                if (diff >= 40) el.className = "timer-badge bg-red-600 animate-pulse";
                else if (diff >= 20) el.className = "timer-badge bg-yellow-600";
            });
        }

        function imprimirCupom(dadosEnc) {
            const p = JSON.parse(decodeURIComponent(dadosEnc));
            const area = document.getElementById('print-area');
            const lista = p.itens.split('|').map(i => `<span class="item-separador">• ${i.trim().toUpperCase()}</span>`).join('');
            
            area.innerHTML = `
                <div class="cupom-termico">
                    <center><strong>KF SABORES</strong><br>${p.modalidade}<br>${p.dataFull}</center>
                    <div class="linha"></div>
                    CLIENTE: ${p.nome.toUpperCase()}<br>
                    TEL: ${p.telefone}<br>
                    END: ${p.endereco.toUpperCase()}<br>
                    <div class="linha"></div>
                    ITENS:<br>${lista}
                    <div class="linha"></div>
                    PAGTO: ${p.pagto.toUpperCase()}<br>
                    TAXA: R$ ${limparValor(p.taxaEntrega).toFixed(2)}<br>
                    <strong>TOTAL: ${p.total}</strong>
                </div>`;
            window.print();
        }

        async function carregarEstoque() {
            const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
            const itens = await res.json();
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "";
            
            const grupos = itens.reduce((acc, item) => {
                (acc[item.categoria] = acc[item.categoria] || []).push(item);
                return acc;
            }, {});

            for (let cat in grupos) {
                let html = `<div class="cat-card"><h3 class="text-[#39FF14] font-black uppercase text-xs mb-4 italic">${cat}</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                grupos[cat].forEach(i => {
                    const isPausado = i.status === 'PAUSADO';
                    html += `
                        <div class="bg-black/40 p-4 rounded-2xl border ${isPausado ? 'border-red-600/40 opacity-60' : 'border-zinc-800'}">
                            <p class="text-[10px] font-black uppercase mb-3 truncate">${i.nome}</p>
                            <button onclick="mudarEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}')" class="w-full py-2 rounded-xl text-[9px] font-black uppercase ${isPausado ? 'bg-green-600' : 'bg-red-600'}">
                                ${isPausado ? 'Ativar' : 'Pausar'}
                            </button>
                        </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        async function mudarEstoque(item, status) {
            await fetch(WEB_APP_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStock', item, status }) 
            });
            setTimeout(carregarEstoque, 1000);
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        function gerarRelatorio() {
            let total = 0, qtd = 0;
            todosOsPedidos.forEach(p => {
                if (p.status.includes('CONCLU')) {
                    total += p.totalNum;
                    qtd++;
                }
            });
            document.getElementById('rel-content').innerHTML = `
                <div class="bg-zinc-800 p-6 rounded-3xl text-center">
                    <p class="text-zinc-500 text-[10px] font-black uppercase">Pedidos Concluídos: ${qtd}</p>
                    <p class="text-4xl font-black text-[#39FF14] italic mt-2">R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                </div>`;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        document.body.addEventListener('click', () => pararSom(), { once: true });
        setInterval(carregarPedidos, 15000);
        setInterval(atualizarTimers, 10000);
        carregarPedidos();
    </script>
</body>
</html>
