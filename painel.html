<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro V10.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; overflow-x: hidden; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }

        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 12px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; transition: all 0.3s; }
        .excluindo { transform: scale(0.8); opacity: 0; transition: all 0.5s ease; pointer-events: none; }
        
        .header-pizza { color: #ef4444; border-bottom: 2px solid #ef4444; }
        .header-tapioca { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
        .header-bebida { color: #3b82f6; border-bottom: 2px solid #3b82f6; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }

        .btn-whats { background-color: #25D366; color: white; }
        .btn-mapa { background-color: #4285F4; color: white; }
        .btn-motoboy { background-color: #a855f7; color: white; }
        .btn-entrega { background-color: #F29339; color: white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="assets/sounds/telefone.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="abrirModalRelatorio()" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg flex items-center gap-2">📊 RELATÓRIOS</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg flex items-center gap-2">📦 ESTOQUE</button>
                <a href="https://kfsabores.github.io/KF-ORG/mapa-taxas.html" target="_blank" class="bg-zinc-700 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-600 transition-all shadow-lg flex items-center gap-2">📍 MAPA TAXAS</a>
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 transition-all shadow-lg">🌐 SITE</a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Controle de Disponibilidade</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs hover:text-white">Fechar ✕</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <h3 class="header-pizza font-black mb-4 pb-2 text-center uppercase tracking-widest">🍕 Pizzas</h3>
                    <div id="lista-pizza" class="space-y-2"></div>
                </div>
                <div>
                    <h3 class="header-tapioca font-black mb-4 pb-2 text-center uppercase tracking-widest">🌮 Tapiocas</h3>
                    <div id="lista-tapioca" class="space-y-2"></div>
                </div>
                <div>
                    <h3 class="header-bebida font-black mb-4 pb-2 text-center uppercase tracking-widest">🥤 Bebidas</h3>
                    <div id="lista-bebida" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div id="lista-pedidos" class="grid-custom">
            <div class="col-span-full text-center py-20 text-zinc-700 font-black uppercase tracking-widest animate-pulse">Sincronizando com a planilha...</div>
        </div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[110] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-[#39FF14] italic uppercase mb-6 text-center">Relatório de Faturamento</h2>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 block mb-2 uppercase">Período Inicial</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="rel-data-inicio" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                        <input type="time" id="rel-hora-inicio" value="00:00" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 block mb-2 uppercase">Período Final</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="rel-data-fim" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                        <input type="time" id="rel-hora-fim" value="23:59" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                </div>
                <button onclick="processarRelatorio()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase text-xs hover:scale-105 transition-all shadow-[0_0_20px_rgba(57,255,20,0.3)]">Processar Vendas</button>
                <div id="resultado-relatorio" class="hidden mt-6 pt-6 border-t border-zinc-800 space-y-4"></div>
            </div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-6 text-zinc-500 font-black uppercase text-[10px] hover:text-white">Cancelar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx6XgE6wBcZPPjmtpAoyy6MseNXuS0eQ6VoA4TXfUwLoT0eG_AsJvAU3o6mlRxWISRcfQ/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let pedidosExcluidosLocalmente = new Set();
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        let audioDesbloqueado = false;
        let pedidosPendentesVistos = new Set();
        let audioCtx = null;
        let compressor = null;
        let analogRingInterval = null;
        const ringtone = document.getElementById('notificacao-som');

        function garantirAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            if (audioCtx && !compressor) {
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-22, audioCtx.currentTime);
                compressor.knee.setValueAtTime(18, audioCtx.currentTime);
                compressor.ratio.setValueAtTime(8, audioCtx.currentTime);
                compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                compressor.release.setValueAtTime(0.25, audioCtx.currentTime);
                compressor.connect(audioCtx.destination);
            }
        }

        function tocarPulsoAnalogico(inicio, duracao = 0.75, volumeMax = 0.42) {
            if (!audioCtx || !compressor) return;
            const ganho = audioCtx.createGain();
            ganho.gain.setValueAtTime(0.0001, inicio);
            ganho.gain.exponentialRampToValueAtTime(volumeMax, inicio + 0.015);
            ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + duracao);
            ganho.connect(compressor);

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();

            // Timbre mais "telefone antigo", menos beep eletrônico.
            osc1.type = 'square';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(430, inicio);
            osc2.frequency.setValueAtTime(475, inicio);

            // Leve "warble" para lembrar toque analógico.
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(22, inicio);
            lfoGain.gain.setValueAtTime(10, inicio);
            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);
            lfoGain.connect(osc2.frequency);

            osc1.connect(ganho);
            osc2.connect(ganho);
            osc1.start(inicio); osc2.start(inicio); lfo.start(inicio);
            osc1.stop(inicio + duracao); osc2.stop(inicio + duracao); lfo.stop(inicio + duracao);
        }

        function tocarToqueAnalogico() {
            if (!audioDesbloqueado) return;
            garantirAudioContext();
            if (!audioCtx || analogRingInterval) return;

            const tocarCiclo = () => {
                const t = audioCtx.currentTime + 0.02;
                tocarPulsoAnalogico(t, 0.78);
                tocarPulsoAnalogico(t + 0.95, 0.78);
            };

            tocarCiclo();
            analogRingInterval = setInterval(tocarCiclo, 3200);
        }

        function tocarSomPedidoNovo() {
            if (!audioDesbloqueado) return;
            pararSom();
            ringtone.volume = 1;
            ringtone.currentTime = 0;
            ringtone.play().catch(() => {
                // Fallback para toque sintético se o arquivo falhar.
                tocarToqueAnalogico();
            });
        }

        function pararSom() {
            ringtone.pause();
            ringtone.currentTime = 0;
            if (analogRingInterval) {
                clearInterval(analogRingInterval);
                analogRingInterval = null;
            }
        }

        function parseDataBR(stringData) {
            if(!stringData) return new Date();
            try {
                const partes = stringData.split(' ');
                const dataP = partes[0].split('/');
                const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
                return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
            } catch(e) { return new Date(); }
        }

        function extrairHoraConclusao(status) {
            if (!status) return "";
            const match = status.toUpperCase().match(/CONCLU[^\d]*(\d{2}:\d{2})/);
            return match ? match[1] : "";
        }

        function gerarStatusConcluido() {
            const agora = new Date();
            const hh = String(agora.getHours()).padStart(2, '0');
            const mm = String(agora.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        function lerHorariosConclusao() {
            try {
                return JSON.parse(localStorage.getItem('kf_horarios_conclusao') || '{}');
            } catch (e) {
                return {};
            }
        }

        function salvarHorarioConclusao(linha, hora) {
            const horarios = lerHorariosConclusao();
            horarios[String(linha)] = hora;
            localStorage.setItem('kf_horarios_conclusao', JSON.stringify(horarios));
        }

        function obterHorarioConclusao(linha) {
            const horarios = lerHorariosConclusao();
            return horarios[String(linha)] || "";
        }

        function removerHorarioConclusao(linha) {
            const horarios = lerHorariosConclusao();
            delete horarios[String(linha)];
            localStorage.setItem('kf_horarios_conclusao', JSON.stringify(horarios));
        }

        function normalizarTelefoneBR(tel) {
            if (!tel) return "";
            let num = String(tel).replace(/\D/g, '').replace(/^0+/, '');
            if (num.length === 10 || num.length === 11) num = "55" + num;
            if (num.length < 12 || num.length > 13) return "";
            if (!num.startsWith("55")) return "";
            return num;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );
                const pedidosComLinha = rows.slice(1).map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: parseFloat(row[5].replace("R$", "").replace(/\s/g, "").replace(",", ".")) || 0,
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || "DELIVERY").toUpperCase(),
                    telefone: row[8] || "",
                    taxa: row[9] || "0,00",
                    troco: row[10] || "NÃO",
                    latitude: row[11] || "",
                    longitude: row[12] || "",
                    localizacaoLink: row[13] || "",
                    localizacaoFonte: row[14] || ""
                }));

                todosOsPedidos = pedidosComLinha
                    .filter(p => p.nome && p.nome !== "")
                    .filter(p => !pedidosExcluidosLocalmente.has(p.linhaOriginal));

                const pendentesAtuais = todosOsPedidos.filter(p => p.status.includes("PENDENTE"));

                if (primeiraCarga) {
                    pendentesAtuais.forEach(p => pedidosPendentesVistos.add(p.linhaOriginal));
                } else {
                    const novosPendentes = pendentesAtuais.filter(p => !pedidosPendentesVistos.has(p.linhaOriginal));
                    if (novosPendentes.length > 0) {
                        if (audioDesbloqueado) {
                            tocarSomPedidoNovo();
                        } else {
                            const status = document.getElementById('status-conexao');
                            status.innerText = "⚠️ Clique na tela para ativar o som 📞";
                            status.classList.remove('text-[#39FF14]');
                            status.classList.add('text-zinc-500');
                        }
                    }
                    pendentesAtuais.forEach(p => pedidosPendentesVistos.add(p.linhaOriginal));
                }
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro ao carregar pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            let lista = [...todosOsPedidos].sort((a, b) => {
                const prioritario = (s) => (s.includes("PENDENTE") || s.includes("PREPARANDO")) ? 0 : 1;
                if (prioritario(a.status) !== prioritario(b.status)) return prioritario(a.status) - prioritario(b.status);
                return b.objData - a.objData;
            });
            lista.forEach(p => {
                const isPendente = p.status.includes("PENDENTE");
                const isCozinha = p.status.includes("PREPARANDO");
                const horaConclusao = extrairHoraConclusao(p.status) || (p.status.includes("CONCLU") ? obterHorarioConclusao(p.linhaOriginal) : "");
                
                let corBorda = isPendente ? "border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.2)]" : 
                               (isCozinha ? "border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.2)]" : "border-zinc-700");
                let espessuraBorda = isPendente ? "border-4" : (isCozinha ? "border-[3px]" : "border-2");
                let corStatus = isPendente ? "bg-yellow-600" : (isCozinha ? "bg-blue-600" : "bg-zinc-700");

                container.innerHTML += `
                    <div id="card-${p.linhaOriginal}" class="bg-zinc-900 ${espessuraBorda} ${corBorda} p-6 rounded-3xl flex flex-col transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-black text-zinc-500 block uppercase">${p.dataFull}</span>
                                    ${horaConclusao ? `<span class="text-[9px] font-black text-zinc-500">✅ ${horaConclusao}</span>` : ""}
                                </div>
                                <span class="status-badge mt-2 inline-block ${corStatus} text-white">${p.status}</span>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <span class="timer-badge" data-hora="${p.objData.toISOString()}" data-status="${p.status}">0m</span>
                            </div>
                        </div>
                        <h3 class="text-2xl font-black italic mb-1 uppercase tracking-tighter">${p.nome}</h3>
                        <p class="text-[10px] font-bold text-zinc-500 mb-4 uppercase italic">📍 ${p.endereco}</p>
                        
                        <div class="grid grid-cols-3 gap-1 mb-4">
                            <button onclick="abrirWhats('${p.telefone}')" class="btn-whats p-2 rounded-xl text-[7px] font-black uppercase hover:opacity-80 transition-all">WhatsApp</button>
                            <button onclick="abrirMapa('${p.endereco}', '${p.localizacaoLink}', '${p.latitude}', '${p.longitude}')" class="btn-mapa p-2 rounded-xl text-[7px] font-black uppercase hover:opacity-80 transition-all">Mapa</button>
                            <button onclick="chamarMotoboy('${p.nome}', '${p.endereco}', '${p.pagto}', '${p.total}', '${p.telefone}', '${p.localizacaoLink}', '${p.latitude}', '${p.longitude}')" class="btn-motoboy p-2 rounded-xl text-[7px] font-black uppercase hover:opacity-80 transition-all">🏍️ Motoboy</button>
                        </div>

                        <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-zinc-800/50 flex-grow">
                            ${p.itens
                                .split('|')
                                .flatMap(i => {
                                    const item = i.trim();
                                    if (!item) return [];
                                    const matchObs = item.match(/^(.*?)(\s*OBS:.*)$/i);
                                    if (matchObs && matchObs[1].trim()) {
                                        return [matchObs[1].trim(), matchObs[2].trim()];
                                    }
                                    return [item];
                                })
                                .map(item => {
                                    const isObs = item.toUpperCase().startsWith("OBS:");
                                    return `<div class="${isObs ? 'mt-3 mb-2' : 'mb-2'} text-sm font-bold uppercase text-zinc-300 border-b border-zinc-800/20 pb-1">/ ${item}</div>`;
                                }).join('')}
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-5">
                            <div class="bg-zinc-800 p-2 rounded-xl text-center">
                                <p class="text-[8px] font-black text-zinc-500 uppercase">Taxa Entrega</p>
                                <p class="text-xs font-black text-orange-500">R$ ${p.taxa}</p>
                            </div>
                            <div class="bg-zinc-800 p-2 rounded-xl text-center">
                                <p class="text-[8px] font-black text-zinc-500 uppercase">Troco para</p>
                                <p class="text-xs font-black text-zinc-300">${p.troco}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mb-4">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 py-2.5 rounded-xl font-black text-[8px] uppercase hover:bg-blue-500">Cozinha</button>
                            <button onclick="enviarEntrega('${p.telefone}', '${p.nome}')" class="btn-entrega py-2.5 rounded-xl font-black text-[8px] uppercase hover:opacity-80 transition-all">Saiu para entrega</button>
                            <button onclick="concluirPedido(${p.linhaOriginal}, this)" class="bg-emerald-600 py-2.5 rounded-xl font-black text-[8px] uppercase hover:bg-emerald-500">Concluir</button>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal})" class="bg-red-900/20 text-red-500 p-2 rounded-xl hover:bg-red-600 hover:text-white transition-all">🗑️</button>
                                <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black font-black px-2.5 py-2 rounded-xl text-[8px] uppercase hover:bg-zinc-200">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('.timer-badge').forEach(el => {
                const status = el.getAttribute('data-status') ? el.getAttribute('data-status').toUpperCase() : "";

                // CORREÇÃO: Se tiver a palavra CONCLU no status, escreve OK e sai da função (não calcula tempo)
                if (status.includes("CONCLU")) {
                    el.innerText = "OK";
                    el.className = "timer-badge bg-zinc-800 opacity-40";
                    return; 
                }

                const dataPedido = new Date(el.getAttribute('data-hora'));
                const diff = Math.floor((agora - dataPedido) / 60000);
                
                el.innerText = (diff < 0 ? 0 : diff) + "m";
                
                if(diff > 45) el.className = "timer-badge bg-red-600 animate-pulse";
                else if(diff > 25) el.className = "timer-badge bg-orange-600";
                else el.className = "timer-badge bg-zinc-700";
            });
        }

        async function alterarStatus(linha, status, btn) {
            const txt = btn.innerHTML;
            btn.innerHTML = "⏳";
            
            // Pausa imediata no visual
            const card = document.getElementById(`card-${linha}`);
            if (card) {
                const badge = card.querySelector('.timer-badge');
                if(badge) badge.setAttribute('data-status', status.toUpperCase());
            }

            try {
                await fetch(`${WEB_APP_URL}?row=${linha}&status=${encodeURIComponent(status)}&t=${new Date().getTime()}`, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1500);
                return true;
            } catch (e) { 
                btn.innerHTML = txt; 
                return false;
            }
        }

        async function concluirPedido(linha, btn) {
            const hora = gerarStatusConcluido();
            salvarHorarioConclusao(linha, hora);
            const ok = await alterarStatus(linha, 'CONCLUIDO', btn);
            if (!ok) removerHorarioConclusao(linha);
        }

        function abrirWhats(tel) {
            const num = normalizarTelefoneBR(tel);
            if(!num) return alert("Telefone inválido ou não disponível.");
            window.open(`https://wa.me/${num}`, '_blank');
        }

        function montarUrlMapaPedido(end, localizacaoLink, lat, lng) {
            const latNum = parseFloat(String(lat || "").replace(",", "."));
            const lngNum = parseFloat(String(lng || "").replace(",", "."));

            if (localizacaoLink && String(localizacaoLink).trim() !== "") {
                return String(localizacaoLink).trim();
            }
            if (!isNaN(latNum) && !isNaN(lngNum)) {
                return `https://www.google.com/maps?q=${latNum},${lngNum}`;
            }
            if (!end || end.includes("RETIRADA")) return "";
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(end)}`;
        }

        function abrirMapa(end, localizacaoLink, lat, lng) {
            const url = montarUrlMapaPedido(end, localizacaoLink, lat, lng);
            if (!url) {
                if (!end || end.includes("RETIRADA")) return alert("Pedido para retirada.");
                return;
            }
            window.open(url, '_blank');
        }

        function enviarEntrega(tel, nome) {
            const num = normalizarTelefoneBR(tel);
            if(!num) return alert("Telefone inválido ou não disponível.");
            const msg = encodeURIComponent(`🚀 Olá, ${nome}! Seu pedido da *KF Sabores* acabou de sair para entrega!`);
            window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
        }

        function chamarMotoboy(nome, endereco, pagto, total, telefoneCliente, localizacaoLink, lat, lng) {
            const num = "5521969692473";
            const mapa = montarUrlMapaPedido(endereco, localizacaoLink, lat, lng) ||
                (endereco && !String(endereco).includes("RETIRADA")
                    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endereco)}`
                    : "-");
            const telNormalizado = normalizarTelefoneBR(telefoneCliente);
            const telFormatado = telNormalizado || (telefoneCliente || "-");
            const telLink = telNormalizado ? `https://wa.me/${telNormalizado}` : "-";
            const msg = encodeURIComponent(
                `🏍️ *CHAMAR MOTOBOY*\n` +
                `Cliente: ${nome || "-"}\n` +
                `Telefone: ${telFormatado}\n` +
                `Contato cliente: ${telLink}\n` +
                `Endereço: ${endereco || "-"}\n` +
                `Localização: ${mapa}\n` +
                `Pagamento: ${pagto || "-"}\n` +
                `Total: ${total || "-"}`
            );
            window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
        }

        async function cancelarPedido(linha) {
            if (confirm("🚨 APAGAR DEFINITIVAMENTE DA PLANILHA?")) {
                const card = document.getElementById(`card-${linha}`);
                if (card) card.classList.add('excluindo');
                pedidosExcluidosLocalmente.add(linha);
                try {
                    await fetch(`${WEB_APP_URL}?action=delete&row=${linha}&t=${new Date().getTime()}`, { mode: 'no-cors' });
                    removerHorarioConclusao(linha);
                    setTimeout(() => { if(card) card.remove(); }, 500);
                } catch(e) {
                    pedidosExcluidosLocalmente.delete(linha);
                    if(card) card.classList.remove('excluindo');
                    alert("Erro ao excluir.");
                }
            }
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div class="cupom-termico">
                    <center><strong style="font-size:16px">KF SABORES</strong><br>${p.dataFull}</center><br>
                    <strong>CLIENTE:</strong> ${p.nome}<br>
                    <strong>ENDEREÇO:</strong> ${p.endereco}<br>
                    <hr style="border:1px dashed #000; margin: 5px 0">
                    <strong>PEDIDO:</strong><br>${p.itens.split('|').join('<br>')}<br>
                    <hr style="border:1px dashed #000; margin: 5px 0">
                    <strong>TAXA ENTREGA:</strong> R$ ${p.taxa}<br>
                    <strong>TOTAL:</strong> ${p.total}<br>
                    <strong>FORMA PAGTO:</strong> ${p.pagto}<br>
                    <strong>TROCO:</strong> ${p.troco}
                </div>`;
            window.print();
        }

        function toggleEstoque() { 
            const p = document.getElementById('painel-estoque');
            if(p.classList.contains('hidden')) carregarEstoque();
            p.classList.toggle('hidden'); 
        }

        async function carregarEstoque() {
            const cols = {
                pizza: document.getElementById('lista-pizza'),
                tapioca: document.getElementById('lista-tapioca'),
                bebida: document.getElementById('lista-bebida')
            };
            Object.values(cols).forEach(c => c.innerHTML = "<p class='text-center text-zinc-600 text-[10px] animate-pulse uppercase font-black'>Carregando...</p>");
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const dados = await res.json();
                Object.values(cols).forEach(c => c.innerHTML = "");
                dados.forEach(i => {
                    const isOff = i.status === 'PAUSADO';
                    const itemHtml = `
                        <div class="bg-zinc-800/50 p-4 rounded-2xl flex justify-between items-center border border-zinc-800 hover:border-zinc-700 transition-all">
                            <span class="text-[11px] font-black uppercase text-zinc-300 leading-tight">${i.nome}</span>
                            <button onclick="mudarStatusEstoque('${i.nome}', '${isOff ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                class="px-4 py-2 rounded-xl text-[10px] font-black transition-all ${isOff ? 'bg-red-600' : 'bg-green-600'}">
                                ${isOff ? 'OFF' : 'ON'}
                            </button>
                        </div>`;
                    const cat = i.categoria.toUpperCase();
                    if(cat.includes("PIZZA")) cols.pizza.innerHTML += itemHtml;
                    else if(cat.includes("TAPIOCA")) cols.tapioca.innerHTML += itemHtml;
                    else if(cat.includes("BEBIDA")) cols.bebida.innerHTML += itemHtml;
                });
            } catch(e) { console.error("Erro estoque:", e); }
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) });
            carregarEstoque();
        }

        function abrirModalRelatorio() {
            document.getElementById('resultado-relatorio').classList.add('hidden');
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }
        
        function processarRelatorio() {
            const dataIni = document.getElementById('rel-data-inicio').value;
            const horaIni = document.getElementById('rel-hora-inicio').value;
            const dataFim = document.getElementById('rel-data-fim').value;
            const horaFim = document.getElementById('rel-hora-fim').value;
            
            if(!dataIni || !dataFim) return alert("Selecione as datas!");
            
            const inicio = new Date(`${dataIni}T${horaIni}`);
            const fim = new Date(`${dataFim}T${horaFim}`);
            
            let totalDelivery = 0, qtdDelivery = 0;
            let totalBalcao = 0, qtdBalcao = 0;

            todosOsPedidos.forEach(p => {
                if((p.status.includes('CONCLU')) && p.objData >= inicio && p.objData <= fim) {
                    if (p.modalidade.includes('RETIRADA') || p.modalidade.includes('BALCÃO') || p.modalidade.includes('BALCAO')) {
                        totalBalcao += p.totalNum;
                        qtdBalcao++;
                    } else {
                        totalDelivery += p.totalNum;
                        qtdDelivery++;
                    }
                }
            });

            const totalGeral = totalDelivery + totalBalcao;
            const qtdGeral = qtdDelivery + qtdBalcao;

            const resDiv = document.getElementById('resultado-relatorio');
            resDiv.innerHTML = `
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="bg-zinc-800 p-3 rounded-2xl border-l-4 border-blue-500">
                        <p class="text-[9px] uppercase font-black text-zinc-500">🚚 Delivery (${qtdDelivery})</p>
                        <p class="text-sm font-black text-white">R$ ${totalDelivery.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="bg-zinc-800 p-3 rounded-2xl border-l-4 border-orange-500">
                        <p class="text-[9px] uppercase font-black text-zinc-500">🛍️ Balcão (${qtdBalcao})</p>
                        <p class="text-sm font-black text-white">R$ ${totalBalcao.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                </div>
                <div class="bg-[#39FF14] p-6 rounded-3xl text-black text-center shadow-lg">
                    <p class="font-black text-[10px] uppercase opacity-60">Faturamento Total (Líquido)</p>
                    <p class="text-4xl font-black italic">R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    <p class="font-bold text-[11px] mt-2 uppercase">${qtdGeral} Pedidos Concluídos</p>
                </div>`;
            resDiv.classList.remove('hidden');
        }

        document.body.addEventListener('click', async () => {
            try {
                garantirAudioContext();
                ringtone.volume = 0.08;
                if (audioCtx && audioCtx.state === 'running') {
                    // Pulso rápido para garantir desbloqueio em alguns navegadores.
                    tocarPulsoAnalogico(audioCtx.currentTime + 0.01, 0.05, 0.05);
                } else {
                    await ringtone.play();
                    ringtone.pause();
                    ringtone.currentTime = 0;
                }
                audioDesbloqueado = true;
            } catch (e) {
                audioDesbloqueado = false;
            }

            const status = document.getElementById('status-conexao');
            if (audioDesbloqueado) {
                status.innerText = "✅ MONITORAMENTO ATIVO (SOM LIGADO)";
                status.classList.remove('text-zinc-500');
                status.classList.add('text-[#39FF14]');
            } else {
                status.innerText = "⚠️ Não foi possível ativar o som. Tente clicar novamente.";
                status.classList.remove('text-[#39FF14]');
                status.classList.add('text-zinc-500');
            }
        });

        setInterval(carregarPedidos, 10000);
        setInterval(atualizarCronometros, 30000); 
        carregarPedidos();
    </script>
</body>
</html>
