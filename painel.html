<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; }
        }
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; }
        .linha { border-bottom: 1px dashed #000; margin: 4px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1rem; }
        body { background-color: #09090b; color: white; }
    </style>
</head>
<body class="p-4 font-sans">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase mt-2 italic">⚠️ Clique para ativar o receptor 📞</p>
            </div>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="gerarRelatorio('dia')" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px]">📊 Vendas Hoje</button>
                <button onclick="gerarRelatorio('semana')" class="bg-indigo-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px]">📅 Vendas Semana</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px]">📦 Estoque</button>
                <button onclick="window.open('https://kfsabores.github.io/KF-ORG/?admin=true', '_blank')" class="bg-zinc-700 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px]">⚙️ SITE ADM</button>
                <button onclick="carregarPedidos()" class="bg-zinc-800 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px]">🔄 Sinc</button>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-8 bg-zinc-900 p-6 rounded-3xl border border-orange-500/30">
            <h2 class="text-xl font-black text-orange-500 mb-6 uppercase italic">Gerenciar Estoque</h2>
            <div id="lista-estoque-categorias" class="space-y-8"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 id="rel-titulo" class="text-2xl font-black text-[#39FF14] italic uppercase mb-6 text-center">Relatório</h2>
            <div id="rel-content" class="space-y-4 text-sm font-bold uppercase text-zinc-300"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-8 bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase text-xs">Fechar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxIMMrePzpECmCR7yhkhpWwFGg4EupV2xaFSy3q4FLh3BgOD5o1Ern_3-0r54UfaOrA0g/exec'; 
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = [];
        let totalPedidosAnterior = 0;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function limparValor(valorStr) {
            if (!valorStr) return 0;
            // Remove tudo que não é número ou vírgula, depois troca vírgula por ponto
            let soNumeros = valorStr.toString().replace(/[^\d,]/g, '').replace(',', '.');
            return parseFloat(soNumeros) || 0;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );
                
                todosOsPedidos = rows.slice(1).filter(r => r[1]).map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataTxt: row[0],
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4] || 'N/A',
                    total: row[5],
                    totalNum: limparValor(row[5]),
                    status: (row[6] || '').toUpperCase(),
                    modalidade: (row[7] || "DELIVERY").toUpperCase()
                }));

                if (todosOsPedidos.length > totalPedidosAnterior && totalPedidosAnterior !== 0) {
                    ringtone.play().catch(() => {});
                }
                totalPedidosAnterior = todosOsPedidos.length;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            todosOsPedidos.reverse().forEach(p => {
                const concluido = p.status.includes("CONCLU");
                container.innerHTML += `
                    <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl flex flex-col border-t-8 ${p.modalidade.includes('RETIRADA') ? 'border-t-orange-600' : 'border-t-green-600'} ${concluido ? 'opacity-40' : ''}">
                        <div class="flex justify-between mb-2 text-[9px] font-bold text-zinc-500 uppercase">
                            <span>${p.dataTxt}</span>
                            <span class="px-2 py-1 rounded ${concluido ? 'bg-[#39FF14] text-black' : 'bg-blue-600 text-white'}">${concluido ? '✅ CONCLUÍDO' : '⏳ PENDENTE'}</span>
                        </div>
                        <h3 class="text-xl font-black italic uppercase text-[#39FF14]">${p.nome}</h3>
                        <p class="text-[10px] text-zinc-400 mb-3">${p.endereco}</p>
                        <div class="bg-black/30 p-3 rounded-xl mb-4 text-[10px] font-bold uppercase leading-tight">
                            ${p.itens.split('|').join('<br>• ')}
                        </div>
                        <div class="flex gap-2 mb-4">
                            ${!concluido ? `<button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUÍDO', this)" class="flex-1 bg-green-600/20 text-green-400 py-3 rounded-xl font-black text-[10px] uppercase border border-green-600/30">✅ Finalizar</button>` : ''}
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-zinc-800">
                            <span class="text-lg font-black italic">R$ ${p.totalNum.toFixed(2)}</span>
                            <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black px-4 py-2 rounded-xl font-black text-[10px]">IMPRIMIR</button>
                        </div>
                    </div>`;
            });
        }

        function gerarRelatorio(tipo) {
            // Pega o dia de hoje no formato da planilha (DD/MM/YYYY)
            const hojeData = new Date().toLocaleDateString('pt-BR');
            
            const filtrados = todosOsPedidos.filter(p => {
                const statusOk = p.status.includes("CONCLU");
                if (tipo === 'dia') {
                    return statusOk && p.dataTxt.includes(hojeData);
                }
                return statusOk; // Na semana mostra todos os concluídos carregados
            });

            const totalSoma = filtrados.reduce((acc, p) => acc + p.totalNum, 0);

            document.getElementById('rel-titulo').innerText = tipo === 'dia' ? "Vendas de Hoje" : "Relatório Geral";
            document.getElementById('rel-content').innerHTML = `
                <div class="flex justify-between border-b border-zinc-800 pb-2"><span>Pedidos Concluídos:</span> <span class="text-white">${filtrados.length}</span></div>
                <div class="flex justify-between border-b border-zinc-800 pb-2 text-[#39FF14] text-xl font-black"><span>Total:</span> <span>R$ ${totalSoma.toFixed(2)}</span></div>
                <p class="text-[9px] text-zinc-500 mt-4 text-center italic">Soma baseada na coluna "VALOR" para pedidos "CONCLUÍDO".</p>
            `;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        async function alterarStatus(linha, status, btn) {
            btn.innerText = "SINC..."; btn.disabled = true;
            try {
                await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`);
                setTimeout(carregarPedidos, 1500);
            } catch (e) { alert("Erro!"); }
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<p class='text-xs font-black animate-pulse'>BUSCANDO DADOS...</p>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoque = await res.json();
                let html = '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">';
                Object.keys(estoque).forEach(item => {
                    const isPausado = estoque[item] === 'PAUSADO';
                    html += `
                        <div class="bg-zinc-800 p-3 rounded-2xl border ${isPausado ? 'border-red-600/50 opacity-50' : 'border-zinc-700'}">
                            <p class="text-[9px] font-black uppercase mb-3 truncate">${item}</p>
                            <button onclick="mudarStatusEstoque('${item}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                class="w-full py-2 rounded-lg text-[9px] font-black uppercase ${isPausado ? 'bg-green-600' : 'bg-red-600'}">
                                ${isPausado ? 'Ativar' : 'Pausar'}
                            </button>
                        </div>`;
                });
                container.innerHTML = html + '</div>';
            } catch (e) { container.innerHTML = "Erro."; }
        }

        async function mudarStatusEstoque(item, novoStatus, btn) {
            btn.innerText = "⏳";
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item: item, status: novoStatus }) });
                setTimeout(carregarEstoque, 1000);
            } catch (e) { alert("Erro!"); }
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `<div class="cupom-termico"><center><strong>KF SABORES</strong><br>${p.dataTxt}</center><div class="linha"></div>CLIENTE: ${p.nome.toUpperCase()}<br>ENDEREÇO: ${p.endereco.toUpperCase()}<br><div class="linha"></div>ITENS:<br>${p.itens.split('|').join('<br>• ')}<div class="linha"></div>PAGTO: ${p.pagto.toUpperCase()}<br>TOTAL: R$ ${p.totalNum.toFixed(2)}<div class="linha"></div><center>BOM APETITE!</center></div>`;
            window.print();
        }

        document.body.addEventListener('click', () => { pararSom(); document.getElementById('status-conexao').innerText = "📞 MONITORANDO PEDIDOS"; document.getElementById('status-conexao').classList.replace('text-zinc-500', 'text-[#39FF14]'); }, { once: true });
        carregarPedidos();
        setInterval(carregarPedidos, 25000);
    </script>
</body>
</html>
