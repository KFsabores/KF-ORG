<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .item-separador { margin-bottom: 4px; display: block; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        .linha { border-bottom: 2px dashed #000; margin: 5px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; transition: all 0.3s ease; }
        .excluindo { transform: scale(0.8); opacity: 0; transition: all 0.5s ease; pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="abrirModalRelatorioPersonalizado()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg flex items-center gap-2">📊 RELATÓRIOS</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg">📦 Estoque</button>
                
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 transition-all shadow-lg border border-emerald-500 flex items-center gap-2">
                    🌐 SITE
                </a>
                <a href="https://kfsabores.github.io/KF-ORG/mapa-taxas.html" target="_blank" class="bg-zinc-800 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-700 transition-all shadow-lg border border-zinc-700">
                    🗺️ TAXAS
                </a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-[0_0_30px_rgba(249,115,22,0.1)]">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Controle de Disponibilidade</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs">Fechar ✕</button>
            </div>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio-novo" class="fixed inset-0 hidden flex items-center justify-center z-[110] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-[#39FF14] italic uppercase mb-2">Relatório Personalizado</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Início</label>
                        <input type="date" id="rel-data-inicio" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none">
                        <input type="time" id="rel-hora-inicio" value="00:00" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mt-2 text-white text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Fim</label>
                        <input type="date" id="rel-data-fim" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none">
                        <input type="time" id="rel-hora-fim" value="23:59" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mt-2 text-white text-sm outline-none">
                    </div>
                </div>
                <button onclick="processarRelatorioCustomizado()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase text-xs hover:scale-105 transition-all">Processar Dados</button>
                <div id="resultado-relatorio-custom" class="hidden mt-6 pt-6 border-t border-zinc-800 space-y-4"></div>
            </div>
            <button onclick="document.getElementById('modal-relatorio-novo').classList.add('hidden')" class="w-full mt-6 text-zinc-500 font-black uppercase text-[10px]">Cancelar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwzQpAcB3vYwJKIY0Ozs4luDkPeiNMeoXsTVN8qnD15RGwScKox-9ij5Epfe6F7AW5tEQ/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let pedidosExcluidosLocalmente = new Set(); // Lista de IDs excluídos para não voltarem na atualização
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date(0);
            const partes = stringData.split(' ');
            const dataP = partes[0].split('/');
            const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
            return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
        }

        function limparValor(valorStr) {
            if (!valorStr || valorStr === "") return 0;
            let val = valorStr.toString().replace("R$", "").replace(/\s/g, "").replace(",", ".");
            let num = parseFloat(val);
            return isNaN(num) ? 0 : num;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );

                const pedidosRaw = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                
                // Filtra os pedidos que acabamos de excluir para eles não voltarem
                todosOsPedidos = pedidosRaw
                    .map((row, idx) => ({
                        linhaOriginal: idx + 2,
                        idUnico: row[0] + row[1], // Gera um ID baseado na data+nome
                        dataFull: row[0], 
                        objData: parseDataBR(row[0]),
                        nome: row[1],
                        endereco: row[2],
                        itens: row[3],
                        pagto: row[4],
                        total: row[5],
                        totalNum: limparValor(row[5]),
                        status: (row[6] || 'PENDENTE').toUpperCase(),
                        modalidade: (row[7] || (row[2].toUpperCase().includes("RETIRADA") ? "RETIRADA" : "DELIVERY")).toUpperCase(),
                        telefone: row[8] || "",
                        taxaEntrega: row[9] || "0"
                    }))
                    .filter(p => !pedidosExcluidosLocalmente.has(p.linhaOriginal));

                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    const temNovoPendente = todosOsPedidos.some(p => p.status === 'PENDENTE');
                    if(temNovoPendente) ringtone.play().catch(e => {});
                }
                
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            let pedidosParaExibir = [...todosOsPedidos].sort((a, b) => {
                const statusA = (a.status.includes("PENDENTE") || a.status.includes("PREPARANDO")) ? 0 : 1;
                const statusB = (b.status.includes("PENDENTE") || b.status.includes("PREPARANDO")) ? 0 : 1;
                if (statusA !== statusB) return statusA - statusB;
                return b.objData - a.objData;
            });

            pedidosParaExibir.forEach(p => {
                const isConcluido = p.status.includes("CONCLUIDO");
                const isPreparando = p.status.includes("PREPARANDO");
                const isPendente = p.status.includes("PENDENTE");

                let cardColorClass = isPendente ? "border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.1)]" : 
                                   (isPreparando ? "border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.1)]" : "border-green-600");

                container.innerHTML += `
                    <div id="card-${p.linhaOriginal}" class="bg-zinc-900 border-2 ${cardColorClass} p-6 rounded-3xl flex flex-col h-full border-t-[10px] shadow-xl transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-zinc-500 font-bold text-[10px] block uppercase">${p.dataFull}</span>
                                <span class="status-badge mt-2 inline-block ${isPreparando ? 'bg-blue-600' : (isConcluido ? 'bg-green-700' : 'bg-yellow-600')} text-white">${p.status}</span>
                            </div>
                            <span class="timer-badge" data-hora-pedido="${p.objData.toISOString()}" data-status="${p.status}">...</span>
                        </div>

                        <h3 class="text-2xl font-black italic mb-2 uppercase leading-tight">${p.nome}</h3>
                        <p class="text-[11px] font-bold text-zinc-400 mb-4 uppercase italic">📍 ${p.endereco}</p>

                        <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-zinc-800/50 flex-grow text-sm font-bold uppercase">
                            ${p.itens.split('|').map(i => `<div class="mb-2 text-zinc-200 border-b border-zinc-800/50 pb-1">• ${i.trim()}</div>`).join('')}
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 text-white text-[10px] font-black py-4 rounded-xl uppercase">Cozinha</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-green-600 text-white text-[10px] font-black py-4 rounded-xl uppercase">Concluir</button>
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal})" class="bg-red-900/20 text-red-500 border border-red-500/30 font-black px-4 py-3 rounded-xl text-[12px] hover:bg-red-600 hover:text-white transition-all">🗑️</button>
                                <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black font-black px-5 py-3 rounded-xl text-[10px] uppercase">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        async function cancelarPedido(linha) {
            if (confirm("🚨 EXCLUIR DEFINITIVAMENTE?")) {
                const card = document.getElementById(`card-${linha}`);
                if (card) card.classList.add('excluindo'); // Efeito visual de sumir
                
                pedidosExcluidosLocalmente.add(linha); // Trava o pedido para não voltar
                
                try {
                    await fetch(`${WEB_APP_URL}?action=deleteRow&row=${linha}`, { mode: 'no-cors' });
                    setTimeout(() => { if(card) card.remove(); }, 500);
                } catch(e) {
                    alert("Erro ao excluir na planilha.");
                    pedidosExcluidosLocalmente.delete(linha);
                    if(card) card.classList.remove('excluindo');
                }
            }
        }

        async function alterarStatus(linha, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' });
            setTimeout(carregarPedidos, 1000);
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora-pedido]').forEach(el => {
                const dataPedido = new Date(el.getAttribute('data-hora-pedido'));
                const diff = Math.floor((agora - dataPedido) / 1000);
                const m = Math.floor(diff / 60);
                el.innerText = (m < 0 ? "0" : m) + "m";
            });
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `<div class="cupom-termico"><center>KF SABORES<br>${p.dataFull}</center><br>CLIENTE: ${p.nome}<br>ITENS: ${p.itens}<br>TOTAL: ${p.total}</div>`;
            window.print();
        }

        // ESTOQUE E RELATÓRIO (Funções mantidas conforme anterior)
        function toggleEstoque() { document.getElementById('painel-estoque').classList.toggle('hidden'); carregarEstoque(); }
        async function carregarEstoque() {
            const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
            const dados = await res.json();
            let html = "";
            dados.forEach(i => {
                const isPausado = i.status === 'PAUSADO';
                html += `<div class="bg-zinc-800 p-4 rounded-xl flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase">${i.nome}</span>
                    <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" class="px-4 py-2 rounded-lg text-[9px] font-black ${isPausado ? 'bg-green-600' : 'bg-red-600'}">${isPausado ? 'ATIVAR' : 'PAUSAR'}</button>
                </div>`;
            });
            document.getElementById('lista-estoque-categorias').innerHTML = html;
        }
        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) });
            carregarEstoque();
        }

        function abrirModalRelatorioPersonalizado() { document.getElementById('modal-relatorio-novo').classList.remove('hidden'); }
        function processarRelatorioCustomizado() {
            const inicio = new Date(`${document.getElementById('rel-data-inicio').value}T${document.getElementById('rel-hora-inicio').value}`);
            const fim = new Date(`${document.getElementById('rel-data-fim').value}T${document.getElementById('rel-hora-fim').value}`);
            let total = 0, qtd = 0;
            todosOsPedidos.forEach(p => {
                if(p.status.includes('CONCLU') && p.objData >= inicio && p.objData <= fim) {
                    total += p.totalNum; qtd++;
                }
            });
            document.getElementById('resultado-relatorio-custom').innerHTML = `<div class="bg-[#39FF14] p-4 rounded-xl text-black text-center font-black">TOTAL: R$ ${total.toFixed(2)} (${qtd} PEDIDOS)</div>`;
            document.getElementById('resultado-relatorio-custom').classList.remove('hidden');
        }

        document.body.addEventListener('click', () => {
            pararSom();
            document.getElementById('status-conexao').innerText = "✅ MONITORAMENTO ATIVO";
        }, { once: true });

        setInterval(carregarPedidos, 15000);
        carregarPedidos();
    </script>
</body>
</html>
