<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; display: block !important; } }
        body { background-color: #09090b; color: white; font-family: 'Inter', sans-serif; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-pendente { border-t-yellow-500; }
        .status-preparando { border-t-blue-500; }
        .status-concluido { border-t-zinc-700; opacity: 0.5; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl gap-4">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic uppercase leading-none">KF SABORES</h1>
                <p class="text-zinc-500 text-[10px] font-bold uppercase mt-2">📊 Gestão de Vendas e Produção</p>
            </div>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="gerarRelatorio('dia')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase hover:bg-blue-500">💰 Vendas Hoje</button>
                <button onclick="gerarRelatorio('semana')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase hover:bg-indigo-500">📅 Vendas Semana</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase hover:bg-orange-500">📦 Estoque</button>
                <button onclick="carregarPedidos()" class="bg-zinc-800 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-zinc-700">🔄 Sinc</button>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border border-orange-500/30">
            <h2 class="text-2xl font-black text-orange-500 uppercase italic mb-8 text-center">Disponibilidade de Itens</h2>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] bg-black/95 p-4 backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-10 text-center">
            <h2 id="rel-titulo" class="text-2xl font-black text-[#39FF14] italic uppercase mb-2">RELATÓRIO</h2>
            <div id="rel-content" class="mb-8"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase text-xs">Fechar</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWxHsDmWlQ84MywvMoVjoVsWoQKln4QOytg1-UrG5W0QajsFEHSObZKPeLszImydXrXA/exec'; 
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';
        let pedidosLocais = [];

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const res = await fetch(url);
                const csv = await res.text();
                const rows = csv.split('\n').map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
                
                pedidosLocais = rows.slice(1).filter(r => r[1]).map((row, idx) => ({
                    data: row[0],
                    linha: idx + 2,
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    valorTxt: row[5],
                    status: (row[6] || '').toUpperCase(),
                    modalidade: (row[7] || 'DELIVERY').toUpperCase()
                }));
                renderizarPedidos();
            } catch (e) { console.error("Erro ao carregar"); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            // Novos pedidos no topo
            [...pedidosLocais].reverse().forEach(p => {
                const statusLimp = p.status.includes('CONCLU') ? 'CONCLUIDO' : (p.status.includes('PREPARA') ? 'PREPARANDO' : 'PENDENTE');
                
                let borderColor = "border-t-yellow-500";
                if(statusLimp === 'PREPARANDO') borderColor = "border-t-blue-500";
                if(statusLimp === 'CONCLUIDO') borderColor = "border-t-zinc-700 opacity-50";

                container.innerHTML += `
                    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl border-t-8 ${borderColor} shadow-xl">
                        <div class="flex justify-between mb-4 text-[9px] font-black uppercase">
                            <span class="bg-zinc-800 px-2 py-1 rounded text-zinc-400">${p.modalidade}</span>
                            <span class="${statusLimp === 'PENDENTE' ? 'text-yellow-500' : (statusLimp === 'PREPARANDO' ? 'text-blue-400' : 'text-zinc-500')}">${p.status}</span>
                        </div>
                        <h3 class="text-2xl font-black uppercase mb-1">${p.nome}</h3>
                        <p class="text-[10px] text-zinc-500 mb-4 italic">${p.endereco}</p>
                        <div class="bg-black/40 p-4 rounded-2xl mb-6 text-xs font-bold uppercase border border-zinc-800/50">
                            ${p.itens.split('|').join('<br>• ')}
                        </div>
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-2xl font-black text-[#39FF14] italic">${p.valorTxt}</span>
                                <button onclick="window.print()" class="text-[10px] font-bold text-zinc-500 underline">🖨️ IMPRIMIR</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                ${statusLimp === 'PENDENTE' ? `
                                    <button onclick="alterarStatus(${p.linha}, 'PREPARANDO')" class="bg-blue-600 text-white py-2 rounded-xl font-black text-[9px] uppercase">COZINHA</button>
                                    <button onclick="alterarStatus(${p.linha}, 'CONCLUIDO')" class="bg-green-600 text-white py-2 rounded-xl font-black text-[9px] uppercase">FINALIZAR</button>
                                ` : (statusLimp === 'PREPARANDO' ? `
                                    <button onclick="alterarStatus(${p.linha}, 'CONCLUIDO')" class="col-span-2 bg-green-600 text-white py-2 rounded-xl font-black text-[9px] uppercase">CONCLUIR PEDIDO</button>
                                ` : '<span class="col-span-2 text-center text-[9px] font-bold text-zinc-600 tracking-widest py-2">PEDIDO ARQUIVADO</span>')}
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<p class='text-center animate-pulse'>Sincronizando Coluna C...</p>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoqueArr = await res.json();
                const grupos = {};
                estoqueArr.forEach(i => {
                    const cat = (i.categoria || "OUTROS").toUpperCase();
                    if (!grupos[cat]) grupos[cat] = [];
                    grupos[cat].push(i);
                });

                let html = "";
                Object.keys(grupos).sort().forEach(cat => {
                    html += `<div class="cat-card"><h3 class="text-[#39FF14] font-black uppercase text-xs mb-4 italic">● ${cat}</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                    grupos[cat].forEach(i => {
                        const isPausado = i.status === 'PAUSADO';
                        html += `<div class="bg-black/40 p-4 rounded-2xl border ${isPausado ? 'border-red-600/40 opacity-50' : 'border-zinc-800'}">
                            <p class="text-[10px] font-black uppercase mb-3 text-zinc-300">${i.nome}</p>
                            <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" class="w-full py-2 rounded-xl text-[9px] font-black ${isPausado ? 'bg-green-600' : 'bg-red-600'} uppercase">${isPausado ? 'Ativar' : 'Pausar'}</button>
                        </div>`;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (e) { console.error("Erro estoque"); }
        }

        function gerarRelatorio(tipo) {
            const concluidos = pedidosLocais.filter(p => p.status.includes('CONCLU'));
            let soma = 0;
            // Aqui você pode adicionar lógica de filtro por data se desejar separar dia de semana
            concluidos.forEach(p => {
                let v = p.valorTxt.toString().replace("R$", "").replace(/\./g, "").replace(",", ".");
                soma += parseFloat(v) || 0;
            });

            document.getElementById('rel-titulo').innerText = tipo === 'dia' ? 'VENDAS HOJE' : 'VENDAS SEMANA';
            document.getElementById('rel-content').innerHTML = `
                <div class="text-5xl font-black text-[#39FF14] mb-4 italic">R$ ${soma.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                <p class="text-zinc-500 text-xs font-bold uppercase">${concluidos.length} PEDIDOS</p>
            `;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        async function alterarStatus(row, status) {
            await fetch(`${WEB_APP_URL}?row=${row}&status=${status}`);
            carregarPedidos();
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerText = "⏳";
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) });
            setTimeout(carregarEstoque, 1000);
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        carregarPedidos();
        setInterval(carregarPedidos, 30000);
    </script>
</body>
</html>
