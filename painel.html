<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - PAINEL DE GESTÃO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0a0a0a; color: #fff; }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .status-pendente { background: #facc15; color: #000; }
        .status-cozinha { background: #3b82f6; color: #fff; }
        .status-entrega { background: #a855f7; color: #fff; }
        .btn-status { transition: 0.2s; font-size: 10px; font-weight: 800; padding: 10px; border-radius: 12px; text-transform: uppercase; }
        .timer-bad { color: #ff4444; animation: blink 1s infinite; font-weight: 900; }
        @keyframes blink { 50% { opacity: 0.4; } }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="audio-alerta" src="https://notificationsounds.com/storage/sounds/notifications/faded.mp3" preload="auto"></audio>

    <header class="flex flex-wrap justify-between items-center mb-10 gap-4 no-print">
        <div>
            <h1 class="text-4xl font-black italic text-[#39FF14] tracking-tighter">KF SABORES</h1>
            <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.3em]">Painel de Gestão Operacional</p>
        </div>
        <div class="flex gap-3">
            <button onclick="abrirRelatorio()" class="bg-amber-500 hover:bg-amber-600 text-black px-6 py-3 rounded-xl font-black text-xs uppercase shadow-lg transition-all">📊 Vendas</button>
            <button onclick="carregarPedidos()" class="bg-[#39FF14] hover:bg-green-500 text-black px-6 py-3 rounded-xl font-black text-xs uppercase shadow-lg transition-all">🔄 Sincronizar</button>
        </div>
    </header>

    <div id="grid-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </div>

    <div id="modal-relatorio" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100] no-print">
        <div class="bg-zinc-900 w-full max-w-md rounded-[2.5rem] p-8 border border-zinc-800 shadow-2xl">
            <h2 class="text-2xl font-black text-[#39FF14] italic mb-8 uppercase text-center">Relatório Financeiro</h2>
            <div class="space-y-4">
                <div class="bg-zinc-800/50 p-6 rounded-3xl border border-zinc-700">
                    <p class="text-zinc-500 text-[10px] font-bold uppercase mb-1">Faturamento do Turno (Até 03h)</p>
                    <p id="venda-dia" class="text-4xl font-black text-white">R$ 0,00</p>
                </div>
                <div class="bg-zinc-800/50 p-6 rounded-3xl border border-zinc-700">
                    <p class="text-zinc-500 text-[10px] font-bold uppercase mb-1">Faturamento da Semana (Qui-Seg)</p>
                    <p id="venda-semana" class="text-4xl font-black text-white">R$ 0,00</p>
                </div>
            </div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full bg-zinc-700 text-white py-5 rounded-2xl font-black uppercase mt-10 hover:bg-zinc-600 transition-colors">Fechar</button>
        </div>
    </div>

    <script>
        const URL_PLANILHA = "SUA_URL_DO_GOOGLE_SCRIPT_AQUI"; // Substitua pela sua URL final
        let pedidosGerais = [];
        let quantidadeAntiga = 0;

        async function carregarPedidos() {
            try {
                const response = await fetch(URL_PLANILHA);
                const data = await response.json();
                const rows = data.values || [];
                
                // Processa os dados da planilha
                const novosPedidos = rows.slice(1).map((r, i) => ({
                    index: i + 2,
                    data: r[0],
                    nome: r[1] || "Sem Nome",
                    endereco: r[2] || "Não Informado",
                    itens: r[3] || "",
                    pagamento: r[4] || "",
                    total: r[5] || "R$ 0,00",
                    status: (r[6] || 'PENDENTE').toUpperCase(),
                    modalidade: r[7] || "DELIVERY"
                }));

                // Lógica de Som: se o número de PENDENTES aumentou
                const qtdPendentes = novosPedidos.filter(p => p.status === 'PENDENTE').length;
                if (qtdPendentes > quantidadeAntiga && quantidadeAntiga !== 0) {
                    tocarAlerta();
                }
                quantidadeAntiga = qtdPendentes;
                pedidosGerais = novosPedidos;

                renderizarPedidos();
            } catch (error) {
                console.error("Erro ao carregar pedidos:", error);
            }
        }

        function renderizarPedidos() {
            const container = document.getElementById('grid-pedidos');
            container.innerHTML = "";

            // Oculta os concluídos para limpar o painel
            const ativos = pedidosGerais.filter(p => p.status !== "CONCLUIDO" && p.status !== "CONCLUÍDO");

            ativos.forEach(p => {
                const card = document.createElement('div');
                card.className = `bg-zinc-900 border-2 ${p.status === 'PENDENTE' ? 'neon-border animate-pulse-slow' : 'border-zinc-800'} rounded-3xl p-6 flex flex-col justify-between shadow-xl`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <span class="status-badge status-${p.status.toLowerCase()}">${p.status}</span>
                            <span class="timer-display text-sm font-black" data-start="${p.data}">00:00</span>
                        </div>
                        <h3 class="text-xl font-black uppercase italic leading-tight mb-1">${p.nome}</h3>
                        <p class="text-[10px] text-amber-500 font-bold mb-4 uppercase tracking-widest">${p.modalidade}</p>
                        
                        <div class="bg-black/40 p-3 rounded-xl mb-4 border border-zinc-800/50">
                            <p class="text-[9px] text-zinc-500 font-bold uppercase mb-1">Endereço:</p>
                            <p class="text-xs text-zinc-300 leading-snug">${p.endereco}</p>
                        </div>

                        <div class="mb-6">
                            <p class="text-[9px] text-[#39FF14] font-bold uppercase mb-2">Itens do Pedido:</p>
                            <div class="text-xs text-zinc-200 space-y-1">
                                ${p.itens.split('|').map(item => `• ${item.trim()}`).join('<br>')}
                            </div>
                        </div>

                        <div class="flex justify-between items-end border-t border-zinc-800 pt-4 mb-6">
                            <div>
                                <p class="text-[9px] text-zinc-500 font-bold uppercase">Pagamento:</p>
                                <p class="text-xs font-bold">${p.pagamento}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] text-zinc-500 font-bold uppercase">Total:</p>
                                <p class="text-xl font-black text-[#39FF14]">${p.total}</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 no-print">
                        <button onclick="atualizarStatus(${p.index}, 'COZINHA')" class="btn-status bg-blue-600/10 text-blue-400 border border-blue-600/30 hover:bg-blue-600 hover:text-white">Cozinha</button>
                        <button onclick="atualizarStatus(${p.index}, 'ENTREGA')" class="btn-status bg-purple-600/10 text-purple-400 border border-purple-600/30 hover:bg-purple-600 hover:text-white">Entrega</button>
                        <button onclick="atualizarStatus(${p.index}, 'CONCLUIDO')" class="btn-status col-span-2 bg-green-600/20 text-green-400 border border-green-600/40 hover:bg-green-600 hover:text-white mt-2">Finalizar Pedido ✅</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- CRONÔMETRO ---
        setInterval(() => {
            document.querySelectorAll('.timer-display').forEach(el => {
                const inicio = new Date(el.getAttribute('data-start'));
                const agora = new Date();
                const diff = Math.floor((agora - inicio) / 1000);
                
                if (isNaN(diff)) { el.innerText = "--:--"; return; }

                const min = Math.floor(diff / 60);
                const sec = diff % 60;
                el.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                
                if (min >= 30) el.classList.add('timer-bad');
            });
        }, 1000);

        // --- RELATÓRIO COM REGRAS DE HORÁRIO ---
        function abrirRelatorio() {
            let totalDia = 0;
            let totalSemana = 0;
            const agora = new Date();

            // Dia Comercial: Se for antes das 03h, ainda pertence ao turno do dia anterior
            let inicioTurnoHoje = new Date(agora);
            if (agora.getHours() < 3) {
                inicioTurnoHoje.setDate(inicioTurnoHoje.getDate() - 1);
            }
            inicioTurnoHoje.setHours(3, 0, 0, 0);

            // Semana Comercial: Quinta 19h até Segunda 03h
            const diaSemana = agora.getDay();
            let qui = new Date(agora);
            let diasAtrasQui = diaSemana >= 4 ? diaSemana - 4 : diaSemana + 3;
            qui.setDate(agora.getDate() - diasAtrasQui);
            qui.setHours(19, 0, 0, 0);

            let seg = new Date(qui);
            seg.setDate(qui.getDate() + 4);
            seg.setHours(3, 0, 0, 0);

            pedidosGerais.forEach(p => {
                const valor = parseFloat(p.total.replace('R$', '').replace('.', '').replace(',', '.'));
                if (isNaN(valor)) return;
                const dt = new Date(p.data);

                if (dt >= inicioTurnoHoje) totalDia += valor;
                if (dt >= qui && dt <= seg) totalSemana += valor;
            });

            document.getElementById('venda-dia').innerText = `R$ ${totalDia.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('venda-semana').innerText = `R$ ${totalSemana.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        async function atualizarStatus(linha, status) {
            const btn = event.target;
            btn.innerText = "⏳...";
            await fetch(`${URL_PLANILHA}?row=${linha}&status=${status}`);
            carregarPedidos();
        }

        function tocarAlerta() {
            const som = document.getElementById('audio-alerta');
            som.play().catch(() => console.log("Interaja com a página para liberar o som."));
        }

        // Início
        setInterval(carregarPedidos, 60000); // Atualiza a cada 1 minuto
        carregarPedidos();
    </script>
</body>
</html>
