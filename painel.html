<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39FF14;
            --retirada-orange: #f97316;
            --bg-dark: #09090b;
            --card-bg: #18181b;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            letter-spacing: -0.02em;
        }

        /* Efeito Glassmorphism e Neumorphism */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .grid-custom { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
            gap: 1.5rem; 
        }

        .status-badge { 
            font-size: 10px; 
            padding: 5px 10px; 
            border-radius: 8px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        .timer-badge { 
            background: #27272a; 
            color: #fff; 
            padding: 5px 12px; 
            border-radius: 12px; 
            font-family: monospace; 
            font-size: 13px; 
            font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Estilo de Impressão */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }

        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .linha { border-bottom: 2px dashed #000; margin: 5px 0; }
        
        /* Scrollbar Customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        .btn-action {
            transition: transform 0.1s active;
        }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-[1600px] mx-auto">
        <div class="flex flex-col lg:flex-row justify-between items-center mb-10 gap-6 bg-zinc-900/50 backdrop-blur-md p-8 rounded-[2.5rem] border border-white/5 shadow-2xl">
            <div class="text-center lg:text-left">
                <div class="flex items-center gap-3 justify-center lg:justify-start">
                    <div class="w-3 h-10 bg-[#39FF14] rounded-full"></div>
                    <h1 class="text-4xl font-black text-white italic tracking-tighter uppercase leading-none">KF <span class="text-[#39FF14]">SABORES</span></h1>
                </div>
                <p id="status-conexao" class="text-zinc-500 text-[11px] font-bold uppercase tracking-[0.2em] mt-3 animate-pulse">⚠️ Clique para ativar o monitoramento 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-3 justify-center">
                <button onclick="gerarRelatorio('dia')" class="bg-zinc-800 hover:bg-zinc-700 text-white px-5 py-3 rounded-2xl font-bold uppercase text-[11px] transition-all border border-white/5 flex items-center gap-2">📊 Turno</button>
                <button onclick="gerarRelatorio('semana')" class="bg-zinc-800 hover:bg-zinc-700 text-white px-5 py-3 rounded-2xl font-bold uppercase text-[11px] transition-all border border-white/5 flex items-center gap-2">📅 Semana</button>
                <button onclick="toggleEstoque()" class="bg-orange-600/20 text-orange-500 border border-orange-500/30 px-5 py-3 rounded-2xl font-bold uppercase text-[11px] hover:bg-orange-600 hover:text-white transition-all">📦 Estoque</button>
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-[#39FF14] text-black px-6 py-3 rounded-2xl font-black uppercase text-[11px] hover:brightness-110 transition-all shadow-[0_0_20px_rgba(57,255,20,0.3)]">🌐 Site</a>
                <a href="https://kfsabores.github.io/KF-ORG/mapa-taxas.html" target="_blank" class="bg-zinc-100 text-black px-6 py-3 rounded-2xl font-black uppercase text-[11px] hover:bg-white transition-all">🗺️ Taxas</a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-[3rem] border border-orange-500/30 shadow-2xl overflow-hidden relative">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic flex items-center gap-2">
                    <span class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-black not-italic">!</span>
                    Gestão de Itens
                </h2>
                <button onclick="toggleEstoque()" class="w-10 h-10 flex items-center justify-center bg-zinc-800 rounded-full text-zinc-400 hover:text-white transition-all">✕</button>
            </div>
            <div id="lista-estoque-categorias" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] p-4 bg-black/95 backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-[3rem] p-10 shadow-2xl">
            <h2 id="rel-titulo" class="text-3xl font-black text-[#39FF14] italic uppercase mb-8 text-center">Relatório</h2>
            <div id="rel-content" class="space-y-4"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-10 bg-zinc-800 text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-zinc-700 transition-all">Fechar Painel</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyUAwFYfg4ZiqQnFumpBYk8XDf8r7mYRJuhl1Ivhu5IPlQhkhxa-UgWZcx1nbueJUYyaw/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date(0);
            const partes = stringData.split(' ');
            const dataP = partes[0].split('/');
            const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
            return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
        }

        function limparValor(valorStr) {
            if (!valorStr || valorStr === "") return 0;
            let val = valorStr.toString().replace("R$", "").replace(/\s/g, "").replace(",", ".");
            let num = parseFloat(val);
            return isNaN(num) ? 0 : num;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );

                const pedidosRaw = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                todosOsPedidos = pedidosRaw.map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: limparValor(row[5]),
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || (row[2].toUpperCase().includes("RETIRADA") ? "RETIRADA" : "DELIVERY")).toUpperCase(),
                    telefone: row[8] || "",
                    taxaEntrega: row[9] || "0"
                }));

                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    const temNovoPendente = todosOsPedidos.some(p => p.status === 'PENDENTE');
                    if(temNovoPendente) ringtone.play().catch(e => {});
                }
                
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            let pedidosParaExibir = [...todosOsPedidos].sort((a, b) => {
                const statusA = (a.status.includes("PENDENTE") || a.status.includes("PREPARANDO")) ? 0 : 1;
                const statusB = (b.status.includes("PENDENTE") || b.status.includes("PREPARANDO")) ? 0 : 1;
                if (statusA !== statusB) return statusA - statusB;
                return b.objData - a.objData;
            });

            pedidosParaExibir.forEach(p => {
                const isRetirada = p.modalidade.includes('RETIRADA');
                const isConcluido = p.status.includes("CONCLUIDO");
                const isCozinha = p.status.includes("PREPARANDO");

                // Configuração Visual Dinâmica
                let cardStyle = "glass-card";
                let topBorder = isRetirada ? "border-t-orange-500" : "border-t-[#39FF14]";
                let statusColor = "bg-yellow-500 text-black";

                if (isCozinha) {
                    cardStyle = "bg-blue-900/10 border-blue-500/50";
                    statusColor = "bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]";
                    topBorder = "border-t-blue-500";
                } else if (isConcluido) {
                    cardStyle = "bg-zinc-900/40 border-zinc-800 opacity-50 grayscale-[0.5]";
                    statusColor = "bg-zinc-700 text-zinc-300";
                    topBorder = "border-t-zinc-700";
                } else {
                    cardStyle = "shadow-[0_10px_30px_rgba(0,0,0,0.5)] border-zinc-800";
                }

                let vTaxa = limparValor(p.taxaEntrega);
                let taxaTexto = isRetirada ? "🛍️ RETIRADA" : `🛵 TAXA: R$ ${vTaxa.toFixed(2)}`;

                const dadosParaImprimir = encodeURIComponent(JSON.stringify(p));
                const telLimpo = p.telefone.toString().replace(/\D/g, '');
                const linkZap = telLimpo ? `https://wa.me/55${telLimpo}` : '#';

                container.innerHTML += `
                    <div class="${cardStyle} ${topBorder} border-t-[10px] p-7 rounded-[2.5rem] flex flex-col h-full relative transition-all">
                        <div class="flex justify-between items-center mb-6">
                            <span class="status-badge ${statusColor}">${p.status}</span>
                            <span class="timer-badge" data-hora-pedido="${p.objData.toISOString()}" data-status="${p.status}">...</span>
                        </div>

                        <div class="mb-4">
                            <h3 class="text-3xl font-black italic uppercase leading-none tracking-tighter mb-1">${p.nome}</h3>
                            <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest">${p.dataFull}</span>
                        </div>
                        
                        <div class="flex gap-2 mb-6">
                            <a href="${linkZap}" target="_blank" class="bg-zinc-800 hover:bg-green-600 text-zinc-400 hover:text-white px-4 py-2 rounded-xl text-[9px] font-black border border-white/5 transition-all uppercase">WhatsApp</a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}" target="_blank" class="bg-zinc-800 hover:bg-blue-600 text-zinc-400 hover:text-white px-4 py-2 rounded-xl text-[9px] font-black border border-white/5 transition-all uppercase">Ver Mapa</a>
                        </div>

                        <div class="bg-black/40 p-5 rounded-3xl mb-6 border border-white/5 flex-grow">
                            <div class="text-xs font-bold text-zinc-500 mb-3 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-zinc-600 rounded-full"></span> PRODUTOS
                            </div>
                            <div class="space-y-3">
                                ${p.itens.split('|').map(i => `<div class="text-[13px] font-bold text-zinc-100 uppercase border-b border-zinc-800/50 pb-2 leading-relaxed tracking-tight">• ${i.trim()}</div>`).join('')}
                            </div>
                        </div>

                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-1">${taxaTexto}</p>
                                <p class="text-3xl font-black text-[#39FF14] italic tracking-tighter">${p.total}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="imprimir('${dadosParaImprimir}')" class="bg-white text-black font-black px-5 py-4 rounded-2xl text-[10px] uppercase shadow-lg hover:scale-105 active:scale-95 transition-all">Imprimir</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mt-6 pt-6 border-t border-white/5">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600/10 hover:bg-blue-600 text-blue-500 hover:text-white border border-blue-600/20 py-4 rounded-2xl text-[10px] font-black uppercase transition-all">COZINHA</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-emerald-600/10 hover:bg-emerald-600 text-emerald-500 hover:text-white border border-emerald-600/20 py-4 rounded-2xl text-[10px] font-black uppercase transition-all">CONCLUIR</button>
                        </div>
                        
                        <button onclick="cancelarPedido(${p.linhaOriginal}, this)" class="absolute -top-3 -right-3 w-8 h-8 bg-zinc-900 border border-zinc-800 text-red-500 rounded-full flex items-center justify-center hover:bg-red-600 hover:text-white transition-all shadow-xl">✕</button>
                    </div>`;
            });
            atualizarCronometros();
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora-pedido]').forEach(el => {
                const status = el.getAttribute('data-status');
                const dataPedido = new Date(el.getAttribute('data-hora-pedido'));
                
                if (status.includes('CONCLU')) {
                    el.innerText = "OK";
                    el.className = "timer-badge opacity-40";
                    return;
                }

                const diff = Math.floor((agora - dataPedido) / 1000);
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const tempoTexto = (h > 0 ? h + "h " : "") + String(m).padStart(2, '0') + "m";
                
                el.innerText = tempoTexto;

                if (m >= 40 || h > 0) el.className = "timer-badge bg-red-600 text-white animate-pulse border-none";
                else if (m >= 20) el.className = "timer-badge bg-yellow-600 text-black border-none";
                else el.className = "timer-badge";
            });
        }

        async function alterarStatus(linha, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' });
            setTimeout(carregarPedidos, 1000);
        }

        async function cancelarPedido(linha, btn) {
            if (confirm("🚨 EXCLUIR PEDIDO PERMANENTEMENTE?")) {
                btn.innerHTML = "⏳";
                await fetch(`${WEB_APP_URL}?action=deleteRow&row=${linha}`, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1000);
            }
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div class="cupom-termico">
                    <center>
                        <strong style="font-size: 18px;">KF SABORES</strong><br>
                        ${p.modalidade.toUpperCase()}<br>
                        ${p.dataFull}
                    </center>
                    <div class="linha"></div>
                    CLIENTE: ${p.nome.toUpperCase()}<br>
                    TEL: ${p.telefone}<br>
                    END: ${p.endereco.toUpperCase()}<br>
                    <div class="linha"></div>
                    ITENS:<br>
                    ${p.itens.split('|').map(i => `• ${i.trim().toUpperCase()}`).join('<br>')}<br>
                    <div class="linha"></div>
                    PAGTO: ${p.pagto.toUpperCase()}<br>
                    TAXA: R$ ${limparValor(p.taxaEntrega).toFixed(2)}<br>
                    <strong>TOTAL: ${p.total}</strong><br>
                    <div class="linha"></div>
                    <center><br>BOM APETITE!</center>
                </div>`;
            setTimeout(() => { window.print(); }, 500);
        }

        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<p class='col-span-full text-center py-10 text-zinc-500 font-bold animate-pulse uppercase'>Sincronizando Banco de Dados...</p>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoqueArr = await res.json();
                const grupos = {};
                
                estoqueArr.forEach(i => {
                    const cat = (i.categoria || "OUTROS").toUpperCase();
                    if (!grupos[cat]) grupos[cat] = [];
                    grupos[cat].push(i);
                });

                let html = "";
                Object.keys(grupos).sort().forEach(cat => {
                    html += `
                        <div class="bg-black/30 p-6 rounded-[2rem] border border-white/5">
                            <h3 class="text-[#39FF14] font-black uppercase text-xs mb-5 italic flex items-center gap-2">
                                <span class="w-2 h-2 bg-[#39FF14] rounded-full"></span> ${cat}
                            </h3>
                            <div class="grid grid-cols-2 gap-3">`;
                    
                    grupos[cat].forEach(i => {
                        const isPausado = i.status === 'PAUSADO';
                        html += `
                            <div class="bg-zinc-900/50 p-4 rounded-2xl border ${isPausado ? 'border-red-600/30' : 'border-white/5'}">
                                <p class="text-[10px] font-black uppercase mb-3 text-zinc-400 h-8 overflow-hidden leading-tight">${i.nome}</p>
                                <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                    class="w-full py-2.5 rounded-xl text-[9px] font-black uppercase transition-all ${isPausado ? 'bg-emerald-600 text-white' : 'bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white'}">
                                    ${isPausado ? 'Ativar' : 'Pausar'}
                                </button>
                            </div>`;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "<p class='text-red-500 text-center py-10 font-bold'>Erro ao conectar com o estoque.</p>"; }
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStock', item, status }) 
            });
            setTimeout(carregarEstoque, 800);
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        function gerarRelatorio(tipo) {
            const agora = new Date();
            let listaFiltrada = [];
            
            todosOsPedidos.forEach(p => {
                if (!p.status.includes('CONCLU')) return;
                let inicioTurno = new Date(agora);
                if (agora.getHours() < 17) inicioTurno.setDate(agora.getDate() - 1);
                inicioTurno.setHours(17, 0, 0);
                if (tipo === 'dia' ? (p.objData >= inicioTurno) : (p.objData >= new Date(new Date().setDate(new Date().getDate()-7)))) listaFiltrada.push(p);
            });

            let totalDel = 0, totalRet = 0;
            listaFiltrada.forEach(p => {
                if (p.modalidade.includes("RETIRADA")) totalRet += p.totalNum;
                else totalDel += p.totalNum;
            });

            document.getElementById('rel-titulo').innerText = tipo === 'dia' ? "Turno Atual" : "Últimos 7 Dias";
            document.getElementById('rel-content').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-zinc-800/50 p-6 rounded-3xl border-l-4 border-blue-500">
                        <p class="text-[10px] uppercase font-black text-zinc-500 tracking-widest mb-1">🛵 Delivery</p>
                        <p class="text-2xl font-black">R$ ${totalDel.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="bg-zinc-800/50 p-6 rounded-3xl border-l-4 border-orange-500">
                        <p class="text-[10px] uppercase font-black text-zinc-500 tracking-widest mb-1">🛍️ Retirada</p>
                        <p class="text-2xl font-black">R$ ${totalRet.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="bg-[#39FF14] p-8 rounded-[2.5rem] text-center shadow-[0_15px_40px_rgba(57,255,20,0.2)]">
                        <p class="text-[11px] uppercase font-black text-black opacity-60 mb-1">Total Consolidado</p>
                        <p class="text-5xl font-black text-black italic tracking-tighter">R$ ${(totalDel + totalRet).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                </div>`;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        document.body.addEventListener('click', () => {
            pararSom();
            document.getElementById('status-conexao').innerText = "✅ MONITORAMENTO ATIVO";
            document.getElementById('status-conexao').className = "text-[#39FF14] text-[11px] font-bold uppercase tracking-[0.2em] mt-3";
        }, { once: true });

        setInterval(carregarPedidos, 15000);
        setInterval(atualizarCronometros, 10000);
        carregarPedidos();
    </script>
</body>
</html>
