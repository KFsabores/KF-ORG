<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; overflow-x: hidden; }
        
        /* Estilo de Impressão */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }

        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; }
        
        /* Animação de Exclusão */
        .excluindo { transform: scale(0.8); opacity: 0; transition: all 0.5s ease; pointer-events: none; }
        
        /* Scrollbar Personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="abrirModalRelatorioPersonalizado()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg flex items-center gap-2">📊 RELATÓRIOS</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg">📦 Estoque</button>
                
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 transition-all shadow-lg border border-emerald-500">🌐 SITE</a>
                <a href="https://kfsabores.github.io/KF-ORG/mapa-taxas.html" target="_blank" class="bg-zinc-800 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-700 transition-all shadow-lg border border-zinc-700">🗺️ TAXAS</a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Controle de Disponibilidade</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs">Fechar ✕</button>
            </div>
            <div id="lista-estoque-categorias" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom">
            <div class="col-span-full text-center py-20 text-zinc-600 font-black uppercase tracking-widest animate-pulse">Carregando pedidos da KF...</div>
        </div>
    </div>

    <div id="modal-relatorio-novo" class="fixed inset-0 hidden flex items-center justify-center z-[110] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-[#39FF14] italic uppercase mb-2">Relatório de Vendas</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Início</label>
                        <input type="date" id="rel-data-inicio" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Fim</label>
                        <input type="date" id="rel-data-fim" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none">
                    </div>
                </div>
                <button onclick="processarRelatorioCustomizado()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase text-xs hover:scale-105 transition-all">Gerar Resumo</button>
                <div id="resultado-relatorio-custom" class="hidden mt-6 pt-6 border-t border-zinc-800 space-y-4"></div>
            </div>
            <button onclick="document.getElementById('modal-relatorio-novo').classList.add('hidden')" class="w-full mt-6 text-zinc-500 font-black uppercase text-[10px]">Fechar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzqRNCIUqXvlkwdHjsuVkgMbm2_uyqkoYq9Wq9HPgOEfhfzrj9dg5g76wOw49-4bYXKrg/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let pedidosExcluidosLocalmente = new Set(); 
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date();
            try {
                const partes = stringData.split(' ');
                const dataP = partes[0].split('/');
                const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
                return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
            } catch(e) { return new Date(); }
        }

        function limparValor(valorStr) {
            if (!valorStr) return 0;
            let val = valorStr.toString().replace("R$", "").replace(/\s/g, "").replace(",", ".");
            return parseFloat(val) || 0;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );

                const pedidosRaw = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                
                todosOsPedidos = pedidosRaw
                    .map((row, idx) => ({
                        linhaOriginal: idx + 2,
                        dataFull: row[0], 
                        objData: parseDataBR(row[0]),
                        nome: row[1],
                        endereco: row[2],
                        itens: row[3],
                        pagto: row[4],
                        total: row[5],
                        totalNum: limparValor(row[5]),
                        status: (row[6] || 'PENDENTE').toUpperCase(),
                        modalidade: (row[7] || "DELIVERY").toUpperCase()
                    }))
                    .filter(p => !pedidosExcluidosLocalmente.has(p.linhaOriginal));

                // Lógica de Som para novos pedidos
                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    const temNovoPendente = todosOsPedidos.some(p => p.status.includes('PENDENTE'));
                    if(temNovoPendente) ringtone.play().catch(e => {});
                }
                
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            let pedidosOrdenados = [...todosOsPedidos].sort((a, b) => {
                const prioritario = (s) => s.includes("PENDENTE") || s.includes("PREPARANDO") ? 0 : 1;
                if (prioritario(a.status) !== prioritario(b.status)) return prioritario(a.status) - prioritario(b.status);
                return b.objData - a.objData;
            });

            pedidosOrdenados.forEach(p => {
                const isConcluido = p.status.includes("CONCLUIDO") || p.status.includes("CONCLUÍDO");
                const isPreparando = p.status.includes("PREPARANDO");
                const isPendente = p.status.includes("PENDENTE");

                let borderClass = isPendente ? "border-yellow-500" : (isPreparando ? "border-blue-500" : "border-zinc-700 opacity-75");
                let statusColor = isPendente ? "bg-yellow-600" : (isPreparando ? "bg-blue-600" : "bg-zinc-700");

                container.innerHTML += `
                    <div id="card-${p.linhaOriginal}" class="bg-zinc-900 border-t-[12px] ${borderClass} p-6 rounded-3xl flex flex-col shadow-2xl transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-zinc-500 font-bold text-[10px] block uppercase">${p.dataFull}</span>
                                <span class="status-badge mt-2 inline-block ${statusColor} text-white">${p.status}</span>
                            </div>
                            <span class="timer-badge" data-hora="${p.objData.toISOString()}">0m</span>
                        </div>

                        <h3 class="text-2xl font-black italic mb-1 uppercase tracking-tighter">${p.nome}</h3>
                        <p class="text-[11px] font-bold text-zinc-500 mb-4 uppercase italic">📍 ${p.endereco}</p>

                        <div class="bg-black/40 p-4 rounded-2xl mb-6 border border-zinc-800/50 flex-grow">
                            ${p.itens.split('|').map(i => `<div class="mb-2 text-sm font-bold uppercase text-zinc-300 border-b border-zinc-800/50 pb-1">• ${i.trim()}</div>`).join('')}
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-black py-4 rounded-xl uppercase transition-all">Cozinha</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-black py-4 rounded-xl uppercase transition-all">Concluir</button>
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal})" class="bg-red-900/20 text-red-500 border border-red-500/30 font-black px-4 py-3 rounded-xl hover:bg-red-600 hover:text-white transition-all">🗑️</button>
                                <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black font-black px-5 py-3 rounded-xl text-[10px] uppercase hover:bg-zinc-200">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        async function cancelarPedido(linha) {
            if (confirm("🚨 EXCLUIR DEFINITIVAMENTE?\nIsso apagará o registro na planilha.")) {
                const card = document.getElementById(`card-${linha}`);
                if (card) card.classList.add('excluindo');
                
                pedidosExcluidosLocalmente.add(linha);
                
                try {
                    // Chamada usando action=delete como definido no seu Script
                    const urlExclusao = `${WEB_APP_URL}?action=delete&row=${linha}&t=${new Date().getTime()}`;
                    await fetch(urlExclusao, { mode: 'no-cors' });
                    
                    setTimeout(() => { if(card) card.remove(); }, 500);
                } catch(e) {
                    alert("Erro ao excluir. Tente novamente.");
                    pedidosExcluidosLocalmente.delete(linha);
                    if(card) card.classList.remove('excluindo');
                }
            }
        }

        async function alterarStatus(linha, status, btn) {
            const original = btn.innerHTML;
            btn.innerHTML = "⏳";
            const urlStatus = `${WEB_APP_URL}?row=${linha}&status=${status}&t=${new Date().getTime()}`;
            try {
                await fetch(urlStatus, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1500);
            } catch (e) { 
                btn.innerHTML = original;
            }
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora]').forEach(el => {
                const dataPedido = new Date(el.getAttribute('data-hora'));
                const m = Math.floor((agora - dataPedido) / 60000);
                el.innerText = (m < 0 ? 0 : m) + "m";
                if(m > 40) el.classList.replace('bg-zinc-700', 'bg-red-600');
            });
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div class="cupom-termico">
                    <center>KF SABORES<br>${p.dataFull}</center><br>
                    CLIENTE: ${p.nome}<br>
                    END: ${p.endereco}<br>
                    <hr>
                    ITENS:<br>${p.itens.split('|').join('<br>')}<br>
                    <hr>
                    TOTAL: ${p.total}<br>
                    PAGTO: ${p.pagto}
                </div>`;
            window.print();
        }

        // ESTOQUE
        function toggleEstoque() { 
            const p = document.getElementById('painel-estoque');
            if(p.classList.contains('hidden')) { carregarEstoque(); }
            p.classList.toggle('hidden'); 
        }

        async function carregarEstoque() {
            document.getElementById('lista-estoque-categorias').innerHTML = "Carregando...";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const dados = await res.json();
                let html = "";
                dados.forEach(i => {
                    const isPausado = i.status === 'PAUSADO';
                    html += `
                        <div class="bg-zinc-800 p-4 rounded-2xl flex justify-between items-center border border-zinc-700">
                            <div>
                                <p class="text-[10px] font-black text-zinc-500 uppercase">${i.categoria}</p>
                                <p class="text-xs font-bold uppercase">${i.nome}</p>
                            </div>
                            <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                class="px-4 py-2 rounded-xl text-[9px] font-black transition-all ${isPausado ? 'bg-green-600' : 'bg-red-600'}">
                                ${isPausado ? 'ATIVAR' : 'PAUSAR'}
                            </button>
                        </div>`;
                });
                document.getElementById('lista-estoque-categorias').innerHTML = html;
            } catch(e) { document.getElementById('lista-estoque-categorias').innerHTML = "Erro ao carregar estoque."; }
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStock', item, status }) 
            });
            carregarEstoque();
        }

        function abrirModalRelatorioPersonalizado() { document.getElementById('modal-relatorio-novo').classList.remove('hidden'); }
        
        function processarRelatorioCustomizado() {
            const ini = document.getElementById('rel-data-inicio').value;
            const fim = document.getElementById('rel-data-fim').value;
            if(!ini || !fim) return alert("Selecione as datas");

            const dIni = new Date(ini + "T00:00:00");
            const dFim = new Date(fim + "T23:59:59");

            let total = 0, qtd = 0;
            todosOsPedidos.forEach(p => {
                if(p.status.includes('CONCLU') && p.objData >= dIni && p.objData <= dFim) {
                    total += p.totalNum; qtd++;
                }
            });

            const res = document.getElementById('resultado-relatorio-custom');
            res.innerHTML = `
                <div class="bg-[#39FF14] p-6 rounded-2xl text-black text-center">
                    <p class="font-black text-[10px] uppercase opacity-70">Total faturado</p>
                    <p class="text-3xl font-black italic">R$ ${total.toFixed(2)}</p>
                    <p class="font-bold text-[11px] mt-2">${qtd} PEDIDOS ENTREGUES</p>
                </div>`;
            res.classList.remove('hidden');
        }

        // Ativação do Som
        document.body.addEventListener('click', () => {
            pararSom();
            document.getElementById('status-conexao').innerText = "✅ MONITORAMENTO ATIVO";
            document.getElementById('status-conexao').classList.add('text-[#39FF14]');
        }, { once: true });

        // Loop de Atualização
        setInterval(carregarPedidos, 15000);
        setInterval(atualizarCronometros, 60000);
        carregarPedidos();
    </script>
</body>
</html>
