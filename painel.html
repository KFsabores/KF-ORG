<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; }
        
        /* Configuração de Impressão Térmica */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }
        
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
        .card-pedido { transition: all 0.3s ease; border: 1px solid #27272a; }
        .card-pedido:hover { border-color: #39FF14; transform: translateY(-2px); }
        
        /* Scrollbar Personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <span class="w-3 h-3 bg-[#39FF14] rounded-full animate-pulse"></span>
                    <h1 class="text-3xl font-black italic tracking-tighter uppercase">Gestão <span class="text-[#39FF14]">KF Sabores</span></h1>
                </div>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest">Aguardando interação para monitorar...</p>
            </div>

            <div class="flex flex-wrap gap-3">
                <button onclick="window.location.href='./index.html?admin=true'" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-2xl font-black text-xs transition-all border border-zinc-700">
                    🌐 ABRIR SITE
                </button>
                <button onclick="window.location.href='./mapa-taxas.html'" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-2xl font-black text-xs transition-all border border-zinc-700">
                    📍 TAXAS
                </button>
                <button onclick="gerarRelatorio()" class="bg-[#39FF14] text-black px-6 py-3 rounded-2xl font-black text-xs shadow-lg shadow-[#39FF14]/20 hover:scale-105 transition-all">
                    📊 RELATÓRIO HOJE
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-6">
                <h2 class="text-sm font-black uppercase tracking-[0.3em] text-zinc-500 flex items-center gap-3">
                    Pedidos Pendentes <span id="count-pendentes" class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full">0</span>
                </h2>
                <div id="container-pedidos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>

            <div class="space-y-6">
                <h2 class="text-sm font-black uppercase tracking-[0.3em] text-zinc-500">Resumo de Hoje</h2>
                <div class="bg-zinc-900 rounded-[2.5rem] p-8 border border-zinc-800">
                    <div class="space-y-6">
                        <div>
                            <p class="text-zinc-500 text-[10px] font-black uppercase mb-1">Total faturado</p>
                            <p id="total-faturado" class="text-4xl font-black italic text-[#39FF14]">R$ 0,00</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4 pt-6 border-t border-zinc-800">
                            <div>
                                <p class="text-zinc-500 text-[10px] font-black uppercase">Entregas</p>
                                <p id="total-delivery" class="text-xl font-bold">0</p>
                            </div>
                            <div>
                                <p class="text-zinc-500 text-[10px] font-black uppercase">Retiradas</p>
                                <p id="total-retirada" class="text-xl font-bold">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[3rem] max-w-lg w-full shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-black italic">RESUMO DO DIA</h3>
                <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="text-zinc-500 hover:text-white">FECHAR</button>
            </div>
            <div id="conteudo-relatorio" class="space-y-4">
                </div>
        </div>
    </div>

    <div id="print-area" class="hidden"></div>

    <audio id="notificacao-som" src="https://www.soundjay.com/buttons/sounds/beep-07.mp3" preload="auto"></audio>

    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyR67m9099_Uv6-6OonYc2M47-E37Z8vAn6G0m2oVv6X-lX6o7_G-5z7Wp522yv3H56/exec";
        let pedidosLocais = [];
        let somHabilitado = false;

        async function buscarPedidos() {
            try {
                const response = await fetch(webAppUrl);
                const data = await response.json();
                
                // Verifica se há novos pedidos para tocar o som
                if (data.length > pedidosLocais.length && pedidosLocais.length > 0) {
                    tocarSom();
                }

                pedidosLocais = data;
                renderizarPedidos();
                atualizarResumo();
            } catch (error) {
                console.error("Erro ao buscar pedidos:", error);
            }
        }

        function renderizarPedidos() {
            const container = document.getElementById('container-pedidos');
            const countPendentes = document.getElementById('count-pendentes');
            
            // Filtra apenas pedidos do dia de hoje (ou lógica similar)
            container.innerHTML = pedidosLocais.slice().reverse().map((p, index) => `
                <div class="bg-zinc-900 p-6 rounded-[2rem] card-pedido relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[10px] font-black px-2 py-1 bg-[#39FF14] text-black rounded-lg uppercase mr-2">${p.modalidade}</span>
                            <span class="text-zinc-500 text-[10px] font-bold">${p.timestamp || ''}</span>
                        </div>
                        <button onclick="imprimirPedido('${p.timestamp}')" class="text-zinc-500 hover:text-[#39FF14]">
                            🖨️
                        </button>
                    </div>

                    <h3 class="font-black text-lg uppercase leading-tight mb-1">${p.nome}</h3>
                    <p class="text-zinc-500 text-[10px] font-bold mb-4">📱 ${p.telefone}</p>

                    <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-zinc-800">
                        <p class="text-[11px] font-medium text-zinc-300 leading-relaxed">${p.itens}</p>
                    </div>

                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-zinc-500 text-[9px] uppercase font-black">Pagamento</p>
                            <p class="text-xs font-bold text-zinc-300">${p.pagamento}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-zinc-500 text-[9px] uppercase font-black">Total</p>
                            <p class="text-xl font-black text-[#39FF14]">R$ ${p.total}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            countPendentes.innerText = pedidosLocais.length;
        }

        function atualizarResumo() {
            const total = pedidosLocais.reduce((acc, p) => acc + parseFloat(p.total.replace(',', '.')), 0);
            const delivery = pedidosLocais.filter(p => p.modalidade === 'DELIVERY').length;
            const retirada = pedidosLocais.filter(p => p.modalidade === 'RETIRADA').length;

            document.getElementById('total-faturado').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('total-delivery').innerText = delivery;
            document.getElementById('total-retirada').innerText = retirada;
        }

        function tocarSom() {
            const som = document.getElementById('notificacao-som');
            som.play().catch(e => console.log("Aguardando interação para áudio"));
        }

        function imprimirPedido(timestamp) {
            const p = pedidosLocais.find(x => x.timestamp === timestamp);
            if(!p) return;

            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div class="cupom-termico">
                    <center>
                        <strong style="font-size: 16px;">KF SABORES</strong><br>
                        --------------------------------
                        <br><strong>CUPOM DE PEDIDO</strong><br>
                        --------------------------------
                    </center>
                    <strong>CLIENTE:</strong> ${p.nome.toUpperCase()}<br>
                    <strong>DATA:</strong> ${p.timestamp}<br>
                    <strong>MODALIDADE:</strong> ${p.modalidade}<br>
                    --------------------------------<br>
                    <strong>ITENS:</strong><br>
                    ${p.itens.split('|').join('<br>')}<br>
                    --------------------------------<br>
                    <strong>ENDEREÇO:</strong><br>
                    ${p.endereco}<br>
                    --------------------------------<br>
                    <strong>PAGAMENTO:</strong> ${p.pagamento}<br>
                    <strong>TAXA:</strong> R$ ${p.taxa}<br>
                    <strong style="font-size: 15px;">TOTAL: R$ ${p.total}</strong><br>
                    <center>
                        <br>Obrigado pela preferência!
                    </center>
                </div>
            `;
            window.print();
        }

        function gerarRelatorio() {
            const modal = document.getElementById('modal-relatorio');
            const conteudo = document.getElementById('conteudo-relatorio');
            
            const totalGeral = pedidosLocais.reduce((acc, p) => acc + parseFloat(p.total.replace(',', '.')), 0);
            
            conteudo.innerHTML = `
                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-zinc-800 p-6 rounded-3xl border-l-4 border-[#39FF14]">
                        <p class="text-[10px] font-black text-zinc-500 uppercase">Faturamento Total</p>
                        <p class="text-3xl font-black text-[#39FF14]">R$ ${totalGeral.toFixed(2)}</p>
                    </div>
                    <div class="bg-zinc-800 p-4 rounded-2xl">
                        <p class="text-xs font-bold">Total de Pedidos: ${pedidosLocais.length}</p>
                        <p class="text-xs text-zinc-400">Delivery: ${pedidosLocais.filter(x => x.modalidade === 'DELIVERY').length}</p>
                        <p class="text-xs text-zinc-400">Retirada: ${pedidosLocais.filter(x => x.modalidade === 'RETIRADA').length}</p>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        // Monitoramento constante
        setInterval(buscarPedidos, 10000); // Atualiza a cada 10 segundos
        
        // Ativa som e monitoramento na primeira interação
        document.body.addEventListener('click', () => {
            if(!somHabilitado) {
                somHabilitado = true;
                buscarPedidos();
                document.getElementById('status-conexao').innerText = "✅ MONITORAMENTO ATIVO";
                document.getElementById('status-conexao').className = "text-[#39FF14] text-[10px] font-bold uppercase tracking-widest";
            }
        });

    </script>
</body>
</html>
