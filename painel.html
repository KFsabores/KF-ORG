<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro V8.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; overflow-x: hidden; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }

        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 12px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; }
        .excluindo { transform: scale(0.8); opacity: 0; transition: all 0.5s ease; pointer-events: none; }
        
        .header-pizza { color: #ef4444; border-bottom: 2px solid #ef4444; }
        .header-tapioca { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
        .header-bebida { color: #3b82f6; border-bottom: 2px solid #3b82f6; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="abrirModalRelatorio()" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg flex items-center gap-2">📊 RELATÓRIOS</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg flex items-center gap-2">📦 ESTOQUE</button>
                
                <a href="https://kfsabores.github.io/KF-ORG/mapa-taxas.html" target="_blank" class="bg-zinc-700 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-600 transition-all shadow-lg flex items-center gap-2">📍 MAPA TAXAS</a>
                
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 text-white px-5 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 transition-all shadow-lg">🌐 SITE</a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Controle de Disponibilidade</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs hover:text-white">Fechar ✕</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <h3 class="header-pizza font-black mb-4 pb-2 text-center uppercase tracking-widest">🍕 Pizzas</h3>
                    <div id="lista-pizza" class="space-y-2"></div>
                </div>
                <div>
                    <h3 class="header-tapioca font-black mb-4 pb-2 text-center uppercase tracking-widest">🌮 Tapiocas</h3>
                    <div id="lista-tapioca" class="space-y-2"></div>
                </div>
                <div>
                    <h3 class="header-bebida font-black mb-4 pb-2 text-center uppercase tracking-widest">🥤 Bebidas</h3>
                    <div id="lista-bebida" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div id="lista-pedidos" class="grid-custom">
            <div class="col-span-full text-center py-20 text-zinc-700 font-black uppercase tracking-widest animate-pulse">Sincronizando com a planilha...</div>
        </div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[110] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-[#39FF14] italic uppercase mb-6 text-center">Relatório de Faturamento</h2>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 block mb-2 uppercase">Período Inicial</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="rel-data-inicio" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                        <input type="time" id="rel-hora-inicio" value="00:00" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 block mb-2 uppercase">Período Final</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="rel-data-fim" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                        <input type="time" id="rel-hora-fim" value="23:59" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                </div>
                <button onclick="processarRelatorio()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase text-xs hover:scale-105 transition-all shadow-[0_0_20px_rgba(57,255,20,0.3)]">Processar Vendas</button>
                <div id="resultado-relatorio" class="hidden mt-6 pt-6 border-t border-zinc-800 space-y-4"></div>
            </div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-6 text-zinc-500 font-black uppercase text-[10px] hover:text-white">Cancelar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzqRNCIUqXvlkwdHjsuVkgMbm2_uyqkoYq9Wq9HPgOEfhfzrj9dg5g76wOw49-4bYXKrg/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let pedidosExcluidosLocalmente = new Set();
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date();
            try {
                const partes = stringData.split(' ');
                const dataP = partes[0].split('/');
                const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
                return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
            } catch(e) { return new Date(); }
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );
                const pedidosFiltrados = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                todosOsPedidos = pedidosFiltrados.map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: parseFloat(row[5].replace("R$", "").replace(/\s/g, "").replace(",", ".")) || 0,
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || "DELIVERY").toUpperCase(),
                    taxa: row[9] || "0,00",
                    troco: row[10] || "NÃO"
                })).filter(p => !pedidosExcluidosLocalmente.has(p.linhaOriginal));

                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    const novos = todosOsPedidos.filter(p => p.status.includes("PENDENTE"));
                    if(novos.length > 0) ringtone.play().catch(e => {});
                }
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro ao carregar pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            let lista = [...todosOsPedidos].sort((a, b) => {
                const prioritario = (s) => (s.includes("PENDENTE") || s.includes("PREPARANDO")) ? 0 : 1;
                if (prioritario(a.status) !== prioritario(b.status)) return prioritario(a.status) - prioritario(b.status);
                return b.objData - a.objData;
            });
            lista.forEach(p => {
                const isPendente = p.status.includes("PENDENTE");
                const isCozinha = p.status.includes("PREPARANDO");
                let corBorda = isPendente ? "border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.2)]" : 
                               (isCozinha ? "border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.2)]" : "border-zinc-700");
                let corStatus = isPendente ? "bg-yellow-600" : (isCozinha ? "bg-blue-600" : "bg-zinc-700");

                container.innerHTML += `
                    <div id="card-${p.linhaOriginal}" class="bg-zinc-900 border-t-[12px] ${corBorda} p-6 rounded-3xl flex flex-col transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-[10px] font-black text-zinc-500 block uppercase">${p.dataFull}</span>
                                <span class="status-badge mt-2 inline-block ${corStatus} text-white">${p.status}</span>
                            </div>
                            <span class="timer-badge" data-hora="${p.objData.toISOString()}">0m</span>
                        </div>
                        <h3 class="text-2xl font-black italic mb-1 uppercase tracking-tighter">${p.nome}</h3>
                        <p class="text-[10px] font-bold text-zinc-500 mb-4 uppercase italic">📍 ${p.endereco}</p>
                        <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-zinc-800/50 flex-grow">
                            ${p.itens.split('|').map(i => `<div class="mb-2 text-sm font-bold uppercase text-zinc-300 border-b border-zinc-800/20 pb-1">/ ${i.trim()}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-5">
                            <div class="bg-zinc-800 p-2 rounded-xl text-center">
                                <p class="text-[8px] font-black text-zinc-500 uppercase">Taxa Entrega</p>
                                <p class="text-xs font-black text-orange-500">R$ ${p.taxa}</p>
                            </div>
                            <div class="bg-zinc-800 p-2 rounded-xl text-center">
                                <p class="text-[8px] font-black text-zinc-500 uppercase">Troco para</p>
                                <p class="text-xs font-black text-zinc-300">${p.troco}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 py-4 rounded-xl font-black text-[10px] uppercase hover:bg-blue-500">Cozinha</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-emerald-600 py-4 rounded-xl font-black text-[10px] uppercase hover:bg-emerald-500">Concluir</button>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal})" class="bg-red-900/20 text-red-500 p-3 rounded-xl hover:bg-red-600 hover:text-white transition-all">🗑️</button>
                                <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black font-black px-4 py-3 rounded-xl text-[10px] uppercase hover:bg-zinc-200">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        async function cancelarPedido(linha) {
            if (confirm("🚨 APAGAR DEFINITIVAMENTE DA PLANILHA?")) {
                const card = document.getElementById(`card-${linha}`);
                if (card) card.classList.add('excluindo');
                pedidosExcluidosLocalmente.add(linha);
                try {
                    await fetch(`${WEB_APP_URL}?action=delete&row=${linha}&t=${new Date().getTime()}`, { mode: 'no-cors' });
                    setTimeout(() => { if(card) card.remove(); }, 500);
                } catch(e) {
                    pedidosExcluidosLocalmente.delete(linha);
                    if(card) card.classList.remove('excluindo');
                    alert("Erro ao excluir.");
                }
            }
        }

        async function alterarStatus(linha, status, btn) {
            const txt = btn.innerHTML;
            btn.innerHTML = "⏳";
            try {
                await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}&t=${new Date().getTime()}`, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1500);
            } catch (e) { btn.innerHTML = txt; }
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div class="cupom-termico">
                    <center><strong style="font-size:16px">KF SABORES</strong><br>${p.dataFull}</center><br>
                    <strong>CLIENTE:</strong> ${p.nome}<br>
                    <strong>ENDEREÇO:</strong> ${p.endereco}<br>
                    
                    <hr style="border:1px dashed #000; margin: 5px 0">
                    <strong>PEDIDO:</strong><br>${p.itens.split('|').join('<br>')}<br>
                    <hr style="border:1px dashed #000; margin: 5px 0">
                    
                    <strong>TAXA ENTREGA:</strong> R$ ${p.taxa}<br>
                    <strong>TOTAL:</strong> ${p.total}<br>
                    
                    <strong>FORMA PAGTO:</strong> ${p.pagto}<br>
                    <strong>TROCO:</strong> ${p.troco}
                </div>`;
            window.print();
        }

        function toggleEstoque() { 
            const p = document.getElementById('painel-estoque');
            if(p.classList.contains('hidden')) carregarEstoque();
            p.classList.toggle('hidden'); 
        }

        async function carregarEstoque() {
            const cols = {
                pizza: document.getElementById('lista-pizza'),
                tapioca: document.getElementById('lista-tapioca'),
                bebida: document.getElementById('lista-bebida')
            };
            Object.values(cols).forEach(c => c.innerHTML = "<p class='text-center text-zinc-600 text-[10px] animate-pulse uppercase font-black'>Carregando...</p>");
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const dados = await res.json();
                Object.values(cols).forEach(c => c.innerHTML = "");
                dados.forEach(i => {
                    const isOff = i.status === 'PAUSADO';
                    const itemHtml = `
                        <div class="bg-zinc-800/50 p-4 rounded-2xl flex justify-between items-center border border-zinc-800 hover:border-zinc-700 transition-all">
                            <span class="text-[11px] font-black uppercase text-zinc-300 leading-tight">${i.nome}</span>
                            <button onclick="mudarStatusEstoque('${i.nome}', '${isOff ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                class="px-4 py-2 rounded-xl text-[10px] font-black transition-all ${isOff ? 'bg-red-600' : 'bg-green-600'}">
                                ${isOff ? 'OFF' : 'ON'}
                            </button>
                        </div>`;
                    const cat = i.categoria.toUpperCase();
                    if(cat.includes("PIZZA")) cols.pizza.innerHTML += itemHtml;
                    else if(cat.includes("TAPIOCA")) cols.tapioca.innerHTML += itemHtml;
                    else if(cat.includes("BEBIDA")) cols.bebida.innerHTML += itemHtml;
                });
            } catch(e) { console.error("Erro estoque:", e); }
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) });
            carregarEstoque();
        }

        function abrirModalRelatorio() {
            document.getElementById('resultado-relatorio').classList.add('hidden');
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }
        
        function processarRelatorio() {
            const dataIni = document.getElementById('rel-data-inicio').value;
            const horaIni = document.getElementById('rel-hora-inicio').value;
            const dataFim = document.getElementById('rel-data-fim').value;
            const horaFim = document.getElementById('rel-hora-fim').value;
            if(!dataIni || !dataFim) return alert("Selecione as datas!");
            const inicio = new Date(`${dataIni}T${horaIni}`);
            const fim = new Date(`${dataFim}T${horaFim}`);
            let total = 0, qtd = 0;
            todosOsPedidos.forEach(p => {
                if((p.status.includes('CONCLU')) && p.objData >= inicio && p.objData <= fim) {
                    total += p.totalNum;
                    qtd++;
                }
            });
            const resDiv = document.getElementById('resultado-relatorio');
            resDiv.innerHTML = `
                <div class="bg-[#39FF14] p-6 rounded-3xl text-black text-center shadow-lg">
                    <p class="font-black text-[10px] uppercase opacity-60">Faturamento Líquido</p>
                    <p class="text-4xl font-black italic">R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    <p class="font-bold text-[11px] mt-2 uppercase">${qtd} Pedidos</p>
                </div>`;
            resDiv.classList.remove('hidden');
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora]').forEach(el => {
                const dataPedido = new Date(el.getAttribute('data-hora'));
                const diff = Math.floor((agora - dataPedido) / 60000);
                el.innerText = (diff < 0 ? 0 : diff) + "m";
                if(diff > 45) el.className = "timer-badge bg-red-600 animate-pulse";
                else if(diff > 25) el.className = "timer-badge bg-orange-600";
            });
        }

        document.body.addEventListener('click', () => {
            pararSom();
            const status = document.getElementById('status-conexao');
            status.innerText = "✅ MONITORAMENTO ATIVO";
            status.classList.remove('text-zinc-500');
            status.classList.add('text-[#39FF14]');
        }, { once: true });

        setInterval(carregarPedidos, 15000);
        setInterval(atualizarCronometros, 60000);
        carregarPedidos();
    </script>
</body>
</html>
