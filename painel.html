<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .item-separador { margin-bottom: 4px; display: block; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        .linha { border-bottom: 2px dashed #000; margin: 5px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
           <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="gerarRelatorioRapido('dia')" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg">📊 Hoje</button>
                <button onclick="toggleFiltroRelatorio()" class="bg-purple-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-purple-500 transition-all shadow-lg">📅 Personalizado</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg">📦 Estoque</button>
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 transition-all shadow-lg flex items-center gap-2">🌐 SITE</a>
            </div>
        </div>

        <div id="painel-filtro" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-purple-500/50 shadow-2xl">
            <h2 class="text-xl font-black text-purple-400 uppercase italic mb-6">Relatório por Data e Hora</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-2">Início (Data e Hora)</label>
                    <input type="datetime-local" id="filtro-inicio" class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-white focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-2">Fim (Data e Hora)</label>
                    <input type="datetime-local" id="filtro-fim" class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-white focus:border-purple-500 outline-none">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="processarRelatorioPersonalizado()" class="flex-1 bg-purple-600 text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-purple-500">Gerar Relatório</button>
                <button onclick="toggleFiltroRelatorio()" class="px-6 bg-zinc-800 text-white rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Controle de Disponibilidade</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs">Fechar ✕</button>
            </div>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[100] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 id="rel-titulo" class="text-2xl font-black text-[#39FF14] italic uppercase mb-6 border-b border-zinc-800 pb-2 italic">Relatório de Vendas</h2>
            <div id="rel-periodo-texto" class="text-[10px] text-zinc-500 font-bold uppercase mb-4"></div>
            <div id="rel-content" class="space-y-4 text-left"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-8 bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Fechar Relatório</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyW6qYo-UiDo6GrmRxAcFIgPcp6ZKHGl4Hzqse1F4qGJeCCROJDLTFfINeqr5yw7o8R5w/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date(0);
            const partes = stringData.split(' ');
            const dataP = partes[0].split('/');
            const horaP = partes[1] ? partes[1].split(':') : ["00","00","00"];
            return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1], horaP[2] || 0);
        }

        function limparValor(valorStr) {
            if (!valorStr || valorStr === "") return 0;
            let val = valorStr.toString().replace("R$", "").replace(/\s/g, "").replace(",", ".");
            let num = parseFloat(val);
            return isNaN(num) ? 0 : num;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );

                const pedidosRaw = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                todosOsPedidos = pedidosRaw.map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: limparValor(row[5]),
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || "DELIVERY").toUpperCase(),
                    telefone: row[8] || "",
                    taxaEntrega: row[9] || "0"
                }));

                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    if(todosOsPedidos.some(p => p.status.includes('PENDENTE'))) ringtone.play().catch(e => {});
                }
                
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            let pedidosSorted = [...todosOsPedidos].sort((a, b) => {
                const statusA = (a.status.includes("PENDENTE") || a.status.includes("PREPARANDO")) ? 0 : 1;
                const statusB = (b.status.includes("PENDENTE") || b.status.includes("PREPARANDO")) ? 0 : 1;
                if (statusA !== statusB) return statusA - statusB;
                return b.objData - a.objData;
            });

            pedidosSorted.forEach(p => {
                const isConcluido = p.status.includes("CONCLU");
                const isPreparando = p.status.includes("PREPARANDO");
                const isPendente = p.status.includes("PENDENTE");

                let cardColor = "border-zinc-700";
                if (isPendente) cardColor = "border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.2)]";
                else if (isPreparando) cardColor = "border-blue-500";
                else if (isConcluido) cardColor = "border-green-600";
                
                container.innerHTML += `
                    <div class="bg-zinc-900 border-2 ${cardColor} p-6 rounded-3xl flex flex-col h-full border-t-[10px] transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-zinc-500 font-bold text-[10px] block uppercase">${p.dataFull}</span>
                                <span class="status-badge mt-2 inline-block ${isPreparando ? 'bg-blue-600' : (isConcluido ? 'bg-green-700' : 'bg-yellow-600')} text-white">${p.status}</span>
                            </div>
                            <span class="timer-badge" data-hora-pedido="${p.objData.toISOString()}" data-status="${p.status}">...</span>
                        </div>
                        <h3 class="text-2xl font-black italic mb-2 uppercase leading-tight">${p.nome}</h3>
                        <p class="text-[11px] font-bold text-zinc-400 mb-4 uppercase italic">📍 ${p.endereco}</p>
                        <div class="bg-black/40 p-4 rounded-2xl mb-4 flex-grow text-sm font-bold uppercase">
                            ${p.itens.split('|').map(i => `<div class="mb-1 border-b border-zinc-800 pb-1">• ${i.trim()}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 text-white text-[10px] font-black py-4 rounded-xl uppercase">Cozinha</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-green-600 text-white text-[10px] font-black py-4 rounded-xl uppercase">Concluir</button>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal}, this)" class="bg-red-900/20 text-red-500 border border-red-500/30 font-black px-4 py-3 rounded-xl">🗑️</button>
                                <button onclick="imprimirPedido('${encodeURIComponent(JSON.stringify(p))}')" class="bg-white text-black font-black px-5 py-3 rounded-xl text-[10px] uppercase">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora-pedido]').forEach(el => {
                const status = el.getAttribute('data-status').toUpperCase();
                const dataPedido = new Date(el.getAttribute('data-hora-pedido'));
                const diff = Math.floor((agora - dataPedido) / 1000);
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const tempoTexto = (h > 0 ? h + "h " : "") + String(m).padStart(2, '0') + "m";

                if (status.includes('CONCLU')) {
                    el.className = "timer-badge bg-zinc-700 opacity-50";
                    if (el.innerText === "..." || el.innerText === "calculando...") el.innerText = tempoTexto;
                    return; 
                }
                el.innerText = tempoTexto;
                if (m >= 40 || h > 0) el.className = "timer-badge bg-red-600 animate-pulse";
                else if (m >= 20) el.className = "timer-badge bg-yellow-600";
            });
        }

        // --- LÓGICA DE RELATÓRIO PERSONALIZADO ---
        function toggleFiltroRelatorio() { document.getElementById('painel-filtro').classList.toggle('hidden'); }

        function processarRelatorioPersonalizado() {
            const inicioInput = document.getElementById('filtro-inicio').value;
            const fimInput = document.getElementById('filtro-fim').value;

            if (!inicioInput || !fimInput) {
                alert("Por favor, selecione as duas datas.");
                return;
            }

            const dataInicio = new Date(inicioInput);
            const dataFim = new Date(fimInput);

            let filtrados = todosOsPedidos.filter(p => {
                const concluido = p.status.includes('CONCLU');
                const noPrazo = p.objData >= dataInicio && p.objData <= dataFim;
                return concluido && noPrazo;
            });

            exibirModalRelatorio(filtrados, `De ${inicioInput.replace('T', ' ')} até ${fimInput.replace('T', ' ')}`);
        }

        function gerarRelatorioRapido(tipo) {
            const agora = new Date();
            let inicio = new Date(agora);
            inicio.setHours(0,0,0,0);
            
            let filtrados = todosOsPedidos.filter(p => p.status.includes('CONCLU') && p.objData >= inicio);
            exibirModalRelatorio(filtrados, "Vendas de Hoje (Geral)");
        }

        function exibirModalRelatorio(lista, periodoTexto) {
            let totalDel = 0, qtdDel = 0, totalRet = 0, qtdRet = 0;
            
            lista.forEach(p => {
                if (p.modalidade.includes("RETIRADA")) { totalRet += p.totalNum; qtdRet++; }
                else { totalDel += p.totalNum; qtdDel++; }
            });

            document.getElementById('rel-periodo-texto').innerText = periodoTexto;
            document.getElementById('rel-content').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-zinc-800 p-4 rounded-2xl border-l-4 border-blue-500">
                        <p class="text-[10px] uppercase font-black text-zinc-500">🛵 Delivery (${qtdDel})</p>
                        <p class="text-xl font-black">R$ ${totalDel.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="bg-zinc-800 p-4 rounded-2xl border-l-4 border-orange-600">
                        <p class="text-[10px] uppercase font-black text-zinc-500">🛍️ Retirada (${qtdRet})</p>
                        <p class="text-xl font-black">R$ ${totalRet.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="bg-zinc-800 p-6 rounded-3xl border border-[#39FF14]/30 text-center">
                        <p class="text-[10px] uppercase font-black text-zinc-500 mb-1">FATURAMENTO TOTAL</p>
                        <p class="text-4xl font-black text-[#39FF14] italic">R$ ${(totalDel + totalRet).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                </div>`;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        async function alterarStatus(linha, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' });
            setTimeout(carregarPedidos, 1000);
        }

        async function cancelarPedido(linha, btn) {
            if (confirm("🚨 APAGAR PERIDO PERMANENTEMENTE?")) {
                btn.innerHTML = "⏳";
                await fetch(`${WEB_APP_URL}?action=delete&row=${linha}`, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1000);
            }
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<p class='text-center animate-pulse'>Carregando...</p>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque&t=${new Date().getTime()}`);
                const estoqueArr = await res.json();
                const grupos = {};
                const ordem = ["PIZZA", "TAPIOCA", "BEBIDA"];

                estoqueArr.forEach(i => {
                    const cat = (i.categoria || "OUTROS").toUpperCase();
                    if (!grupos[cat]) grupos[cat] = [];
                    grupos[cat].push(i);
                });

                let html = "";
                Object.keys(grupos).sort((a,b) => (ordem.indexOf(a)===-1?99:ordem.indexOf(a)) - (ordem.indexOf(b)===-1?99:ordem.indexOf(b))).forEach(cat => {
                    html += `<div class="cat-card"><h3 class="text-[#39FF14] font-black uppercase text-xs mb-4 italic">${cat}</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                    grupos[cat].forEach(i => {
                        const isPausado = i.status === 'PAUSADO';
                        html += `
                            <div class="bg-black/40 p-4 rounded-2xl border ${isPausado ? 'border-red-600/40' : 'border-zinc-800'}">
                                <p class="text-[10px] font-black uppercase mb-3 text-zinc-300 h-8 overflow-hidden">${i.nome}</p>
                                <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                    class="w-full py-2 rounded-xl text-[9px] font-black uppercase ${isPausado ? 'bg-green-600' : 'bg-red-600'} text-white">
                                    ${isPausado ? 'Ativar' : 'Pausar'}
                                </button>
                            </div>`;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "Erro ao carregar estoque."; }
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStock', item, status }) });
            setTimeout(carregarEstoque, 800);
        }

        function imprimirPedido(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `<div class="cupom-termico"><center><strong>KF SABORES</strong><br>${p.modalidade}<br>${p.dataFull}</center><div class="linha"></div>CLIENTE: ${p.nome}<br>END: ${p.endereco}<br><div class="linha"></div>ITENS:<br>${p.itens.split('|').map(i => `• ${i.trim().toUpperCase()}<br>`).join('')}<div class="linha"></div>TOTAL: ${p.total}</div>`;
            window.print();
        }

        document.body.addEventListener('click', () => { pararSom(); }, { once: true });
        setInterval(carregarPedidos, 15000);
        setInterval(atualizarCronometros, 10000);
        carregarPedidos();
    </script>
</body>
</html>
