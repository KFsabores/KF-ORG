<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF Sabores - PAINEL DE GESTÃO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0a0a0a; color: #fff; }
        .neon-border { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .status-pendente { background: #facc15; color: #000; }
        .status-cozinha { background: #3b82f6; color: #fff; }
        .status-entrega { background: #a855f7; color: #fff; }
        .btn-status { transition: 0.2s; font-size: 10px; font-weight: 800; padding: 8px; border-radius: 8px; text-transform: uppercase; }
        .timer-bad { color: #ff4444; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body class="p-4">

    <header class="flex flex-wrap justify-between items-center mb-8 gap-4 no-print">
        <div>
            <h1 class="text-3xl font-black italic text-[#39FF14]">KF SABORES</h1>
            <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest">Painel de Controle de Pedidos</p>
        </div>
        <div class="flex gap-2">
            <button onclick="abrirRelatorio()" class="bg-amber-500 hover:bg-amber-600 text-black px-6 py-3 rounded-xl font-black text-xs uppercase shadow-lg">📊 Vendas</button>
            <button onclick="carregarPedidos()" class="bg-[#39FF14] hover:bg-green-500 text-black px-6 py-3 rounded-xl font-black text-xs uppercase shadow-lg">🔄 Sincronizar Agora</button>
        </div>
    </header>

    <div id="grid-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

    <div id="modal-relatorio" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[100] no-print">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-8 border border-zinc-700">
            <h2 class="text-2xl font-black text-[#39FF14] italic mb-6 uppercase">Relatório de Vendas</h2>
            <div class="space-y-4">
                <div class="bg-zinc-800 p-4 rounded-2xl border border-zinc-700">
                    <p class="text-zinc-400 text-[10px] font-bold uppercase">Vendas de Hoje</p>
                    <p id="venda-dia" class="text-3xl font-black text-white">R$ 0,00</p>
                </div>
                <div class="bg-zinc-800 p-4 rounded-2xl border border-zinc-700">
                    <p class="text-zinc-400 text-[10px] font-bold uppercase">Vendas da Semana</p>
                    <p id="venda-semana" class="text-3xl font-black text-white">R$ 0,00</p>
                </div>
            </div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full bg-zinc-700 text-white py-4 rounded-2xl font-black uppercase mt-8">Fechar</button>
        </div>
    </div>

    <script>
        const URL_PLANILHA = "SUA_URL_DO_GOOGLE_SCRIPT_AQUI"; // Certifique-se de que é a mesma do Index
        let pedidosGerais = [];

        async function carregarPedidos() {
            try {
                const response = await fetch(URL_PLANILHA);
                const data = await response.json();
                const rows = data.values;
                
                // Ignorar cabeçalho e filtrar apenas pedidos que NÃO estão "CONCLUÍDO"
                // r[6] é a coluna Status e r[1] é o nome do cliente
                pedidosGerais = rows.slice(1).map((r, i) => ({
                    index: i + 2, // Linha real na planilha
                    data: r[0],
                    nome: r[1],
                    endereco: r[2],
                    itens: r[3],
                    pagamento: r[4],
                    total: r[5],
                    status: r[6] || 'PENDENTE',
                    modalidade: r[7]
                }));

                renderizarPedidos();
            } catch (error) {
                console.error("Erro ao carregar:", error);
            }
        }

        function renderizarPedidos() {
            const container = document.getElementById('grid-pedidos');
            container.innerHTML = "";

            // Filtramos para não exibir concluídos na tela principal
            const ativos = pedidosGerais.filter(p => p.status.toUpperCase() !== "CONCLUIDO" && p.nome);

            ativos.forEach(p => {
                const card = document.createElement('div');
                card.className = `bg-zinc-900 border-2 ${p.status === 'PENDENTE' ? 'neon-border' : 'border-zinc-800'} rounded-3xl p-6 flex flex-col justify-between`;
                
                // Cálculo do Tempo
                const tempoHtml = `<span class="timer-display font-black text-lg" data-start="${p.data}">00:00</span>`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="status-badge status-${p.status.toLowerCase()}">${p.status}</span>
                            ${tempoHtml}
                        </div>
                        <h3 class="text-xl font-black uppercase italic">${p.nome}</h3>
                        <p class="text-[10px] text-amber-500 font-bold mb-3">${p.modalidade || 'DELIVERY'}</p>
                        <div class="text-zinc-400 text-xs mb-4 pb-4 border-b border-zinc-800">
                            <p class="font-bold text-white mb-1">ENDEREÇO:</p> ${p.endereco}
                        </div>
                        <div class="text-zinc-300 text-sm mb-4">
                            <p class="font-bold text-[#39FF14] text-[10px] mb-1">ITENS:</p>
                            ${p.itens.split('|').join('<br>•')}
                        </div>
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-[10px] font-bold text-zinc-500 uppercase">Total:</span>
                            <span class="text-xl font-black text-[#39FF14]">${p.total}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 no-print">
                        <button onclick="atualizarStatus(${p.index}, 'COZINHA')" class="btn-status bg-blue-600/20 text-blue-400 border border-blue-600/50 hover:bg-blue-600 hover:text-white">Cozinha</button>
                        <button onclick="atualizarStatus(${p.index}, 'ENTREGA')" class="btn-status bg-purple-600/20 text-purple-400 border border-purple-600/50 hover:bg-purple-600 hover:text-white">Entrega</button>
                        <button onclick="atualizarStatus(${p.index}, 'CONCLUIDO')" class="btn-status col-span-2 bg-green-600/20 text-green-400 border border-green-600/50 hover:bg-green-600 hover:text-white mt-2">Finalizar Pedido ✅</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Função do Cronômetro
        setInterval(() => {
            document.querySelectorAll('.timer-display').forEach(el => {
                const start = new Date(el.getAttribute('data-start'));
                const now = new Date();
                const diff = Math.floor((now - start) / 1000);
                
                if (isNaN(diff)) { el.innerText = "--:--"; return; }

                const min = Math.floor(diff / 60);
                const sec = diff % 60;
                el.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                
                // Se passar de 30 minutos, fica vermelho
                if (min >= 30) el.classList.add('timer-bad');
            });
        }, 1000);

        async function atualizarStatus(linha, novoStatus) {
            // Chamada ao script do Google para atualizar a célula na Coluna G (7)
            const url = `${URL_PLANILHA}?row=${linha}&status=${novoStatus}`;
            await fetch(url);
            carregarPedidos();
        }

        function abrirRelatorio() {
            let totalDia = 0;
            let totalSemana = 0;
            const hoje = new Date().toLocaleDateString();
            
            // Cálculo simplificado de semana (últimos 7 dias)
            const seteDiasAtras = new Date();
            seteDiasAtras.setDate(seteDiasAtras.getDate() - 7);

            pedidosGerais.forEach(p => {
                const valor = parseFloat(p.total.replace('R$', '').replace(',', '.'));
                if (isNaN(valor)) return;

                const dataPedido = new Date(p.data);
                
                // Soma Dia
                if (dataPedido.toLocaleDateString() === hoje) {
                    totalDia += valor;
                }
                // Soma Semana
                if (dataPedido > seteDiasAtras) {
                    totalSemana += valor;
                }
            });

            document.getElementById('venda-dia').innerText = `R$ ${totalDia.toFixed(2).replace('.', ',')}`;
            document.getElementById('venda-semana').innerText = `R$ ${totalSemana.toFixed(2).replace('.', ',')}`;
            document.getElementById('modal-relatorio').classList.remove('hidden');
        }

        // Auto-sincronizar a cada 1 minuto
        setInterval(carregarPedidos, 60000);
        carregarPedidos();
    </script>
</body>
</html>
