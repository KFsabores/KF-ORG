<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KF SABORES | Painel de Gestão Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b;
            --card-bg: #18181b;
            --accent: #39FF14;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: #f4f4f5;
            letter-spacing: -0.01em;
        }
        /* Efeito de vidro sutil */
        .glass {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .grid-custom {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        /* Estilo de cupom para os itens */
        .item-list {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        /* Scrollbar elegante */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; color: #000; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-[1600px] mx-auto">
        
        <header class="glass mb-10 p-6 rounded-[2rem] flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.4)]">
                    <span class="text-black font-black text-xl italic">KF</span>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tighter uppercase">KF SABORES</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                        <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest">Sistema Operacional</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex flex-wrap gap-3">
                <button onclick="gerarRelatorio('dia')" class="bg-zinc-800 hover:bg-zinc-700 px-5 py-2.5 rounded-xl text-xs font-bold transition-all">RELATÓRIO</button>
                <button onclick="toggleEstoque()" class="bg-zinc-800 hover:bg-zinc-700 px-5 py-2.5 rounded-xl text-xs font-bold transition-all">ESTOQUE</button>
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2.5 rounded-xl text-xs font-black uppercase shadow-lg shadow-emerald-900/20 transition-all">ABRIR SITE</a>
            </nav>
        </header>

        <main id="lista-pedidos" class="grid-custom"></main>
    </div>

    <div id="painel-estoque" class="fixed inset-0 z-[200] hidden bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-4xl max-h-[80vh] overflow-y-auto rounded-[2.5rem] p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black italic uppercase">Gestão de Estoque</h2>
                <button onclick="toggleEstoque()" class="w-10 h-10 bg-zinc-800 rounded-full flex items-center justify-center">✕</button>
            </div>
            <div id="lista-estoque-categorias" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <div id="modal-relatorio" class="fixed inset-0 hidden flex items-center justify-center z-[300] bg-black/80 backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-[2rem] p-8 shadow-2xl">
            <h2 id="rel-titulo" class="text-xl font-black uppercase mb-6">Relatório</h2>
            <div id="rel-content" class="space-y-4"></div>
            <button onclick="document.getElementById('modal-relatorio').classList.add('hidden')" class="w-full mt-8 bg-white text-black py-4 rounded-2xl font-bold uppercase text-xs">Fechar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyUAwFYfg4ZiqQnFumpBYk8XDf8r7mYRJuhl1Ivhu5IPlQhkhxa-UgWZcx1nbueJUYyaw/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let travaStatus = {}; 
        const ringtone = document.getElementById('notificacao-som');

        function parseDataBR(stringData) {
            if(!stringData) return new Date(0);
            const partes = stringData.split(' ');
            const dataP = partes[0].split('/');
            const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
            return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );

                todosOsPedidos = rows.slice(1).filter(r => r[1]).map((row, idx) => {
                    const linha = idx + 2;
                    let statusBase = (row[6] || 'PENDENTE').toUpperCase();
                    if (travaStatus[linha]) statusBase = travaStatus[linha];

                    return {
                        linhaOriginal: linha,
                        dataFull: row[0], 
                        objData: parseDataBR(row[0]),
                        nome: row[1],
                        endereco: row[2],
                        itens: row[3],
                        pagto: row[4],
                        total: row[5],
                        totalNum: parseFloat(row[5].toString().replace("R$", "").replace(",", ".")),
                        status: statusBase,
                        modalidade: (row[7] || "DELIVERY").toUpperCase(),
                        telefone: row[8] || "",
                        taxaEntrega: row[9] || "0"
                    };
                });
                renderizarPedidos();
            } catch (e) { console.error(e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            todosOsPedidos.sort((a, b) => {
                const statusA = (a.status.includes("CONCLU")) ? 1 : 0;
                const statusB = (b.status.includes("CONCLU")) ? 1 : 0;
                return statusA - statusB || b.objData - a.objData;
            }).forEach(p => {
                const isConcluido = p.status.includes("CONCLU");
                const isPreparando = p.status.includes("PREPAR");
                
                // Cores de status dinâmicas
                let statusColor = "bg-amber-500/10 text-amber-500 border-amber-500/20";
                let borderColor = "border-zinc-800";
                let glow = "shadow-none";

                if (isConcluido) {
                    statusColor = "bg-emerald-500/10 text-emerald-500 border-emerald-500/20";
                    borderColor = "border-emerald-500/30";
                } else if (isPreparando) {
                    statusColor = "bg-blue-500/10 text-blue-500 border-blue-500/20";
                    borderColor = "border-blue-500/30";
                }

                container.innerHTML += `
                    <div class="glass relative rounded-[2rem] p-6 flex flex-col h-full transition-all border-2 ${borderColor} ${isConcluido ? 'opacity-80 scale-95' : 'hover:scale-[1.02] shadow-2xl shadow-black'}">
                        
                        <div class="absolute left-0 top-10 bottom-10 w-1 rounded-r-full ${isConcluido ? 'bg-emerald-500' : isPreparando ? 'bg-blue-500' : 'bg-amber-500'}"></div>

                        <div class="flex justify-between items-start mb-5">
                            <div>
                                <span class="${statusColor} border px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest">${p.status}</span>
                                <p class="text-[10px] text-zinc-500 font-medium mt-2">${p.dataFull}</p>
                            </div>
                            <div class="timer-badge px-3 py-1 bg-zinc-800/50 rounded-lg font-mono text-[11px] font-bold" data-hora-pedido="${p.objData.toISOString()}" data-status="${p.status}">--:--</div>
                        </div>

                        <h3 class="text-xl font-extrabold text-white mb-1 truncate">${p.nome}</h3>
                        <p class="text-[10px] text-zinc-400 font-medium mb-4 flex items-center gap-1 uppercase truncate">
                            <svg class="w-3 h-3 text-zinc-600" fill="currentColor" viewBox="0 0 20 20"><path d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"/></svg>
                            ${p.endereco}
                        </p>

                        <div class="item-list flex-grow mb-5">
                            <ul class="space-y-3">
                                ${p.itens.split('|').map(i => `
                                    <li class="text-[11px] font-semibold text-zinc-200 flex gap-2">
                                        <span class="text-zinc-600 font-black">×</span> ${i.trim().toUpperCase()}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <div class="flex items-end justify-between mb-6">
                            <div>
                                <p class="text-[9px] text-zinc-500 font-bold uppercase mb-1">Pagamento: ${p.pagto}</p>
                                <p class="text-2xl font-black text-white italic">R$ ${p.totalNum.toFixed(2)}</p>
                            </div>
                            <button onclick="imprimir('${encodeURIComponent(JSON.stringify(p))}')" class="p-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl transition-all">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                            </button>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="py-3 bg-blue-600/10 hover:bg-blue-600 text-blue-500 hover:text-white rounded-xl text-[10px] font-black uppercase transition-all border border-blue-500/20">PREPARAR</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="py-3 bg-emerald-600/10 hover:bg-emerald-600 text-emerald-500 hover:text-white rounded-xl text-[10px] font-black uppercase transition-all border border-emerald-500/20">CONCLUIR</button>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora-pedido]').forEach(el => {
                const status = el.getAttribute('data-status');
                const diff = Math.floor((agora - new Date(el.getAttribute('data-hora-pedido'))) / 1000);
                const m = Math.floor((diff % 3600) / 60);
                const h = Math.floor(diff / 3600);
                const tempo = (h > 0 ? h + "h " : "") + String(m).padStart(2, '0') + "m";
                
                el.innerText = tempo;
                if (!status.includes('CONCLU')) {
                    if (m >= 40) el.className = "px-3 py-1 rounded-lg font-mono text-[11px] font-bold bg-red-600 text-white animate-pulse";
                    else if (m >= 20) el.className = "px-3 py-1 rounded-lg font-mono text-[11px] font-bold bg-amber-500 text-black";
                }
            });
        }

        async function alterarStatus(linha, status, btn) {
            btn.innerText = "⏳";
            travaStatus[linha] = status;
            renderizarPedidos(); // Atualiza visual na hora
            
            try {
                await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' });
                setTimeout(carregarPedidos, 1500);
            } catch (e) { console.error(e); }
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<p class='text-zinc-500 animate-pulse'>Sincronizando produtos...</p>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoqueArr = await res.json();
                const grupos = {};
                estoqueArr.forEach(i => {
                    const cat = i.categoria || "DIVERSOS";
                    if (!grupos[cat]) grupos[cat] = [];
                    grupos[cat].push(i);
                });

                container.innerHTML = Object.keys(grupos).map(cat => `
                    <div class="bg-black/20 p-6 rounded-3xl border border-white/5">
                        <h3 class="text-emerald-500 font-black text-xs uppercase mb-4 tracking-widest">${cat}</h3>
                        <div class="space-y-2">
                            ${grupos[cat].map(i => `
                                <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl">
                                    <span class="text-[11px] font-bold uppercase text-zinc-300">${i.nome}</span>
                                    <button onclick="mudarStatusEstoque('${i.nome}', '${i.status === 'PAUSADO' ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                        class="px-4 py-1.5 rounded-lg text-[9px] font-black uppercase ${i.status === 'PAUSADO' ? 'bg-red-600' : 'bg-emerald-600'}">
                                        ${i.status === 'PAUSADO' ? 'OFF' : 'ON'}
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (e) { }
        }

        // Funções de som e inicialização
        document.body.addEventListener('click', () => {
            ringtone.pause();
            document.getElementById('status-conexao').innerText = "CONECTADO AO SERVIDOR";
            document.getElementById('status-conexao').className = "text-emerald-500 text-[10px] font-bold uppercase tracking-widest";
        }, { once: true });

        setInterval(carregarPedidos, 15000);
        setInterval(atualizarCronometros, 10000);
        carregarPedidos();

        // Estilo de impressão adaptado
        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div style="font-family: monospace; width: 48mm; padding: 2mm; font-size: 12px;">
                    <center><strong>KF SABORES</strong><br>${p.modalidade}</center><br>
                    DATA: ${p.dataFull}<br>
                    CLIENTE: ${p.nome}<br>
                    ----------------------------<br>
                    ITENS:<br>
                    ${p.itens.split('|').map(i => `• ${i.trim().toUpperCase()}`).join('<br>')}<br>
                    ----------------------------<br>
                    TOTAL: R$ ${p.totalNum.toFixed(2)}<br>
                    PAGTO: ${p.pagto}<br><br>
                    <center>BOM APETITE!</center>
                </div>`;
            window.print();
        }
    </script>
</body>
</html>
