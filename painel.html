<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL KF - Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #09090b; color: white; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; display: block !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 48mm; background: #fff; color: #000; }
            @page { margin: 0; size: auto; }
        }
        .cupom-termico { font-family: 'Courier New', Courier, monospace; width: 48mm; font-size: 13px; line-height: 1.2; color: #000; font-weight: bold; padding: 2px; }
        .item-separador { margin-bottom: 4px; display: block; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        .linha { border-bottom: 2px dashed #000; margin: 5px 0; }
        .grid-custom { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .cat-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .timer-badge { background: #3f3f46; color: #fff; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 12px; font-weight: bold; transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="notificacao-som" src="https://www.soundjay.com/phone/phone-ring-01.mp3" preload="auto" loop></audio>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-[#39FF14] italic tracking-tighter uppercase leading-none">KF SABORES</h1>
                <p id="status-conexao" class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-2 italic">⚠️ Clique na tela para ativar o som 📞</p>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="abrirModalRelatorioPersonalizado()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 transition-all shadow-lg flex items-center gap-2">📊 RELATÓRIOS</button>
                <button onclick="toggleEstoque()" class="bg-orange-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 transition-all shadow-lg">📦 Estoque</button>
                
                <a href="https://kfsabores.github.io/KF-ORG/?admin=true" target="_blank" class="bg-emerald-600 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 transition-all shadow-lg border border-emerald-500 flex items-center gap-2">
                    🌐 ABRIR SITE
                </a>

                <a href="https://kfsabores.github.io/KF-ORG/mapa-taxas.html" target="_blank" class="bg-zinc-800 text-white px-4 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-zinc-700 transition-all shadow-lg border border-zinc-700 flex items-center gap-2">
                    🗺️ TAXAS
                </a>
            </div>
        </div>

        <div id="painel-estoque" class="hidden mb-10 bg-zinc-900 p-8 rounded-3xl border-2 border-orange-500/50 shadow-[0_0_30px_rgba(249,115,22,0.1)]">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500 uppercase italic">Controle de Disponibilidade</h2>
                <button onclick="toggleEstoque()" class="text-zinc-500 font-bold uppercase text-xs">Fechar ✕</button>
            </div>
            <div id="lista-estoque-categorias" class="space-y-6"></div>
        </div>

        <div id="lista-pedidos" class="grid-custom"></div>
    </div>

    <div id="modal-relatorio-novo" class="fixed inset-0 hidden flex items-center justify-center z-[110] p-4 bg-black/95">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-[#39FF14] italic uppercase mb-2">Gerar Relatório</h2>
            <p class="text-zinc-500 text-[10px] font-bold uppercase mb-6 tracking-widest">Selecione o período e horário</p>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Data Início</label>
                        <input type="date" id="rel-data-inicio" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Hora Início</label>
                        <input type="time" id="rel-hora-inicio" value="00:00" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Data Fim</label>
                        <input type="date" id="rel-data-fim" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase">Hora Fim</label>
                        <input type="time" id="rel-hora-fim" value="23:59" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white text-sm outline-none focus:border-[#39FF14]">
                    </div>
                </div>

                <button onclick="processarRelatorioCustomizado()" class="w-full bg-[#39FF14] text-black py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:scale-105 transition-all mt-4">Processar Dados</button>
                
                <div id="resultado-relatorio-custom" class="hidden mt-6 pt-6 border-t border-zinc-800 space-y-4">
                    </div>
            </div>

            <button onclick="document.getElementById('modal-relatorio-novo').classList.add('hidden')" class="w-full mt-6 text-zinc-500 font-black uppercase text-[10px] tracking-widest hover:text-white transition-all">Cancelar</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwzQpAcB3vYwJKIY0Ozs4luDkPeiNMeoXsTVN8qnD15RGwScKox-9ij5Epfe6F7AW5tEQ/exec';
        const SPREADSHEET_ID = '1JPwiFeHtkgi10DgEXwZY1qW1-TQ_cawIEUkDKb_ux9o';

        let todosOsPedidos = []; 
        let totalPedidosAnterior = 0;
        let primeiraCarga = true;
        const ringtone = document.getElementById('notificacao-som');

        function pararSom() { ringtone.pause(); ringtone.currentTime = 0; }

        function parseDataBR(stringData) {
            if(!stringData) return new Date(0);
            const partes = stringData.split(' ');
            const dataP = partes[0].split('/');
            const horaP = partes[1] ? partes[1].split(':') : ["00","00"];
            return new Date(dataP[2], dataP[1]-1, dataP[0], horaP[0], horaP[1]);
        }

        function limparValor(valorStr) {
            if (!valorStr || valorStr === "") return 0;
            let val = valorStr.toString().replace("R$", "").replace(/\s/g, "").replace(",", ".");
            let num = parseFloat(val);
            return isNaN(num) ? 0 : num;
        }

        async function carregarPedidos() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=PEDIDOSKF&t=${new Date().getTime()}`;
            try {
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim())
                );

                const pedidosRaw = rows.slice(1).filter(r => r[1] && r[1] !== ""); 
                todosOsPedidos = pedidosRaw.map((row, idx) => ({
                    linhaOriginal: idx + 2,
                    dataFull: row[0], 
                    objData: parseDataBR(row[0]),
                    nome: row[1],
                    endereco: row[2],
                    itens: row[3],
                    pagto: row[4],
                    total: row[5],
                    totalNum: limparValor(row[5]),
                    status: (row[6] || 'PENDENTE').toUpperCase(),
                    modalidade: (row[7] || (row[2].toUpperCase().includes("RETIRADA") ? "RETIRADA" : "DELIVERY")).toUpperCase(),
                    telefone: row[8] || "",
                    taxaEntrega: row[9] || "0"
                }));

                if (!primeiraCarga && todosOsPedidos.length > totalPedidosAnterior) {
                    const temNovoPendente = todosOsPedidos.some(p => p.status === 'PENDENTE');
                    if(temNovoPendente) ringtone.play().catch(e => {});
                }
                
                totalPedidosAnterior = todosOsPedidos.length;
                primeiraCarga = false;
                renderizarPedidos();
            } catch (e) { console.error("Erro carga pedidos:", e); }
        }

        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = "";
            
            let pedidosParaExibir = [...todosOsPedidos].sort((a, b) => {
                const statusA = (a.status.includes("PENDENTE") || a.status.includes("PREPARANDO")) ? 0 : 1;
                const statusB = (b.status.includes("PENDENTE") || b.status.includes("PREPARANDO")) ? 0 : 1;
                if (statusA !== statusB) return statusA - statusB;
                return b.objData - a.objData;
            });

            pedidosParaExibir.forEach(p => {
                const isRetirada = p.modalidade.includes('RETIRADA');
                const isConcluido = p.status.includes("CONCLUIDO");
                const isPreparando = p.status.includes("PREPARANDO");
                const isPendente = p.status.includes("PENDENTE");

                let cardColorClass = "border-zinc-700";
                if (isPendente) cardColorClass = "border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.1)]";
                else if (isPreparando) cardColorClass = "border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.1)]";
                else if (isConcluido) cardColorClass = "border-green-600";
                
                let vTaxa = limparValor(p.taxaEntrega);
                let vTotal = p.totalNum;
                let vSubtotal = vTotal - vTaxa;

                let taxaTexto = isRetirada 
                    ? "🛍️ RETIRADA EM LOJA" 
                    : `🛵 TAXA: R$ ${vTaxa.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

                const dadosParaImprimir = encodeURIComponent(JSON.stringify(p));
                const linkZap = p.telefone.replace(/\D/g, '') ? `https://wa.me/55${p.telefone.replace(/\D/g, '')}` : '#';

                container.innerHTML += `
                    <div id="card-${p.linhaOriginal}" class="bg-zinc-900 border-2 ${cardColorClass} p-6 rounded-3xl flex flex-col h-full border-t-[10px] shadow-xl ${isConcluido ? 'opacity-85' : ''} transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-zinc-500 font-bold text-[10px] block uppercase">${p.dataFull}</span>
                                <span class="status-badge mt-2 inline-block ${isPreparando ? 'bg-blue-600' : (isConcluido ? 'bg-green-700' : 'bg-yellow-600')} text-white">${p.status}</span>
                            </div>
                            <span class="timer-badge" data-hora-pedido="${p.objData.toISOString()}" data-status="${p.status}">...</span>
                        </div>

                        <h3 class="text-2xl font-black italic mb-2 uppercase leading-tight">${p.nome}</h3>
                        
                        <div class="flex gap-2 mb-4">
                            <a href="${linkZap}" target="_blank" class="bg-green-600/20 text-green-500 px-3 py-2 rounded-xl text-[10px] font-black border border-green-600/30 hover:bg-green-600 hover:text-white transition-all uppercase">WhatsApp</a>
                        </div>

                        <p class="text-[11px] font-bold text-zinc-400 mb-4 uppercase italic">📍 ${p.endereco}</p>

                        <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-zinc-800/50 flex-grow text-sm font-bold uppercase leading-relaxed">
                            ${p.itens.split('|').map(i => `<div class="mb-2 text-zinc-200 border-b border-zinc-800/50 pb-1">• ${i.trim()}</div>`).join('')}
                        </div>

                        <div class="mb-6 space-y-1">
                             <div class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">SUBTOTAL: R$ ${vSubtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                             <div class="text-[10px] font-black uppercase text-orange-500 tracking-widest">${taxaTexto}</div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="pararSom(); alterarStatus(${p.linhaOriginal}, 'PREPARANDO', this)" class="bg-blue-600 text-white text-[10px] font-black py-4 rounded-xl uppercase hover:bg-blue-500 transition-all">Cozinha</button>
                            <button onclick="alterarStatus(${p.linhaOriginal}, 'CONCLUIDO', this)" class="bg-green-600 text-white text-[10px] font-black py-4 rounded-xl uppercase hover:bg-green-500 transition-all">Concluir</button>
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                            <span class="text-xl font-black text-[#39FF14] italic">${p.total}</span>
                            <div class="flex gap-2">
                                <button onclick="cancelarPedido(${p.linhaOriginal}, this)" class="bg-red-900/20 text-red-500 border border-red-500/30 font-black px-4 py-3 rounded-xl text-[12px] hover:bg-red-600 hover:text-white transition-all">🗑️</button>
                                <button onclick="imprimir('${dadosParaImprimir}')" class="bg-white text-black font-black px-5 py-3 rounded-xl text-[10px] uppercase shadow-lg hover:bg-[#39FF14] transition-all">Imprimir</button>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCronometros();
        }

        function atualizarCronometros() {
            const agora = new Date();
            document.querySelectorAll('[data-hora-pedido]').forEach(el => {
                const status = el.getAttribute('data-status');
                const dataPedido = new Date(el.getAttribute('data-hora-pedido'));
                const diff = Math.floor((agora - dataPedido) / 1000);
                if (diff < 0) { el.innerText = "00:00"; return; }
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                el.innerText = (h > 0 ? h + "h " : "") + String(m).padStart(2, '0') + "m";
                if (!status.includes('CONCLU')) {
                    if (m >= 40 || h > 0) el.className = "timer-badge bg-red-600 animate-pulse";
                    else if (m >= 20) el.className = "timer-badge bg-yellow-600";
                    else el.className = "timer-badge bg-zinc-700";
                } else {
                    el.className = "timer-badge bg-zinc-700 opacity-50";
                }
            });
        }

        async function alterarStatus(linha, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(`${WEB_APP_URL}?row=${linha}&status=${status}`, { mode: 'no-cors' });
            setTimeout(carregarPedidos, 1500);
        }

        async function cancelarPedido(linha, btn) {
            if (confirm("🚨 DESEJA EXCLUIR?\nEste pedido será removido permanentemente da planilha.")) {
                btn.innerHTML = "⏳";
                try {
                    await fetch(`${WEB_APP_URL}?action=deleteRow&row=${linha}`, { mode: 'no-cors' });
                    // Remove da tela imediatamente
                    const card = document.getElementById(`card-${linha}`);
                    if(card) card.style.display = 'none';
                    setTimeout(carregarPedidos, 1500);
                } catch(e) { alert("Erro ao excluir."); }
            }
        }

        function imprimir(dados) {
            const p = JSON.parse(decodeURIComponent(dados));
            const area = document.getElementById('print-area');
            const lista = p.itens.split('|').map(i => `<span class="item-separador">• ${i.trim().toUpperCase()}</span>`).join('');
            area.innerHTML = `
                <div class="cupom-termico">
                    <center><strong style="font-size: 18px;">KF SABORES</strong><br>${p.modalidade.toUpperCase()}<br>${p.dataFull}</center>
                    <div class="linha"></div>
                    CLIENTE: ${p.nome.toUpperCase()}<br>TEL: ${p.telefone}<br>END: ${p.endereco.toUpperCase()}<br>
                    <div class="linha"></div>
                    ITENS:<br>${lista}
                    <div class="linha"></div>
                    PAGTO: ${p.pagto.toUpperCase()}<br>TAXA: R$ ${limparValor(p.taxaEntrega).toFixed(2)}<br>TOTAL: ${p.total}<br>
                    <div class="linha"></div>
                    <center><br>OBRIGADO PELA PREFERÊNCIA!</center>
                </div>`;
            setTimeout(() => { window.print(); }, 500);
        }

        // --- FUNÇÕES DE ESTOQUE ATUALIZADAS ---
        async function carregarEstoque() {
            const container = document.getElementById('lista-estoque-categorias');
            container.innerHTML = "<p class='text-center animate-pulse text-zinc-500 font-bold uppercase'>Sincronizando estoque...</p>";
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEstoque`);
                const estoqueArr = await res.json();
                
                if(!estoqueArr || estoqueArr.length === 0) {
                    container.innerHTML = "<p class='text-center text-zinc-500'>Nenhum item encontrado na aba ESTOQUE.</p>";
                    return;
                }

                const grupos = {};
                estoqueArr.forEach(i => {
                    const cat = (i.categoria || "OUTROS").toUpperCase();
                    if (!grupos[cat]) grupos[cat] = [];
                    grupos[cat].push(i);
                });

                let html = "";
                Object.keys(grupos).sort().forEach(cat => {
                    html += `<div class="cat-card">
                        <h3 class="text-[#39FF14] font-black uppercase text-xs mb-4 italic flex items-center gap-2">
                            <span class="w-2 h-2 bg-[#39FF14] rounded-full animate-pulse"></span> ${cat}
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                    grupos[cat].forEach(i => {
                        const isPausado = (i.status === 'PAUSADO' || i.disponivel === 'NÃO');
                        html += `
                            <div class="bg-black/40 p-4 rounded-2xl border ${isPausado ? 'border-red-600/40 opacity-60' : 'border-zinc-800'} transition-all">
                                <p class="text-[10px] font-black uppercase mb-3 text-zinc-300 leading-tight h-8 overflow-hidden">${i.nome}</p>
                                <button onclick="mudarStatusEstoque('${i.nome}', '${isPausado ? 'DISPONÍVEL' : 'PAUSADO'}', this)" 
                                    class="w-full py-2 rounded-xl text-[9px] font-black uppercase transition-all ${isPausado ? 'bg-green-600 text-white' : 'bg-red-600/80 text-white hover:bg-red-600'}">
                                    ${isPausado ? 'Ativar' : 'Pausar'}
                                </button>
                            </div>`;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "<p class='text-red-500'>Erro ao conectar com a aba ESTOQUE.</p>"; }
        }

        async function mudarStatusEstoque(item, status, btn) {
            btn.innerHTML = "⏳";
            await fetch(WEB_APP_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStock', item: item, status: status }) 
            });
            setTimeout(carregarEstoque, 1000);
        }

        function toggleEstoque() {
            const p = document.getElementById('painel-estoque');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden')) carregarEstoque();
        }

        // --- NOVO SISTEMA DE RELATÓRIO COM CALENDÁRIO ---
        function abrirModalRelatorioPersonalizado() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('rel-data-inicio').value = hoje;
            document.getElementById('rel-data-fim').value = hoje;
            document.getElementById('resultado-relatorio-custom').classList.add('hidden');
            document.getElementById('modal-relatorio-novo').classList.remove('hidden');
        }

        function processarRelatorioCustomizado() {
            const dataI = document.getElementById('rel-data-inicio').value;
            const horaI = document.getElementById('rel-hora-inicio').value;
            const dataF = document.getElementById('rel-data-fim').value;
            const horaF = document.getElementById('rel-hora-fim').value;

            const inicio = new Date(`${dataI}T${horaI}`);
            const fim = new Date(`${dataF}T${horaF}`);

            let totalDel = 0, qtdDel = 0, totalRet = 0, qtdRet = 0;

            todosOsPedidos.forEach(p => {
                // Filtra apenas concluídos dentro do período
                if (p.status.includes('CONCLU') && p.objData >= inicio && p.objData <= fim) {
                    if (p.modalidade.includes("RETIRADA")) {
                        totalRet += p.totalNum;
                        qtdRet++;
                    } else {
                        totalDel += p.totalNum;
                        qtdDel++;
                    }
                }
            });

            const resDiv = document.getElementById('resultado-relatorio-custom');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-zinc-800 p-4 rounded-2xl border-l-4 border-[#39FF14]">
                        <p class="text-[9px] uppercase font-black text-zinc-500">🛵 Delivery (${qtdDel})</p>
                        <p class="text-lg font-black">R$ ${totalDel.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="bg-zinc-800 p-4 rounded-2xl border-l-4 border-orange-600">
                        <p class="text-[9px] uppercase font-black text-zinc-500">🛍️ Retirada (${qtdRet})</p>
                        <p class="text-lg font-black">R$ ${totalRet.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                </div>
                <div class="bg-zinc-800 p-5 rounded-3xl border border-[#39FF14]/30 text-center">
                    <p class="text-[10px] uppercase font-black text-zinc-500 mb-1">TOTAL NO PERÍODO</p>
                    <p class="text-3xl font-black text-[#39FF14] italic">R$ ${(totalDel + totalRet).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                </div>
            `;
        }

        document.body.addEventListener('click', () => {
            pararSom();
            document.getElementById('status-conexao').innerText = "✅ MONITORAMENTO ATIVO";
            document.getElementById('status-conexao').className = "text-[#39FF14] text-[10px] font-bold uppercase tracking-widest mt-2";
        }, { once: true });

        setInterval(carregarPedidos, 15000);
        setInterval(atualizarCronometros, 10000);
        carregarPedidos();
    </script>
</body>
</html>
